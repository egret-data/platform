[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "egret-marimo"
version = "0.1.0"
description = "egret_marimo: gateway and pod-API clients for egret data apps"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["egret_marimo"]

[tool.pytest.ini_options]
pythonpath = ["tests"]
