coordinator=true
node-scheduler.include-coordinator=false
discovery.uri=http://localhost:8080
http-server.http.port=8080
query.max-memory=256MB
query.max-memory-per-node=200MB
memory.heap-headroom-per-node=100MB
http-server.process-forwarded=true
access-control.config-files=/etc/trino/access-control.properties
http-server.authentication.type=PASSWORD
http-server.authentication.allow-insecure-over-http=${ENV:ALLOW_INSECURE}
internal-communication.shared-secret=${ENV:TRINO_INTERNAL_SECRET}
