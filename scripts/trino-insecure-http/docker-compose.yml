# Standalone Trino 483 mirroring egret's impersonate-engine render.
# Run through check.sh (it generates secrets/keystore into a temp dir: WORK).
services:
  coordinator:
    image: trinodb/trino:483
    hostname: coordinator
    ports: ["18080:8080", "18443:8443"]
    environment:
      ALLOW_INSECURE: ${ALLOW_INSECURE:-true}
      TRINO_INTERNAL_SECRET: ${TRINO_INTERNAL_SECRET}
    volumes:
      - ./etc/coordinator.config.properties:/etc/trino/config.properties:ro
      - ./etc/jvm.config:/etc/trino/jvm.config:ro
      - ./etc/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - ./etc/access-control.properties:/etc/trino/access-control.properties:ro
      - ./etc/rules.json:/etc/trino/rules.json:ro
      - ${WORK}/password.db:/etc/trino/password.db:ro
      - ${WORK}/keystore.pem:/etc/trino/tls/keystore.pem:ro
  worker:
    image: trinodb/trino:483
    hostname: worker
    depends_on: [coordinator]
    environment:
      TRINO_INTERNAL_SECRET: ${TRINO_INTERNAL_SECRET}
    volumes:
      - ./etc/worker.config.properties:/etc/trino/config.properties:ro
      - ./etc/jvm.config:/etc/trino/jvm.config:ro
