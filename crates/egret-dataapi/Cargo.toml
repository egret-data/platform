[package]
name = "egret-dataapi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
egret-core = { workspace = true, features = ["http"] }
egret-dataapi-api.workspace = true
egret-metastore.workspace = true
# The mini machine-IdP `ClientVerifier`/`VerifiedClient` this crate's
# `ClientStore` implements — a second audience (`data-api`) on the same IdP the
# Catalog Client registry already registers with.
egret-machine-idp.workspace = true
# Management routes (Task 5): `UserRepo::insert_service` mints the service
# account's `users` row, and `SessionService` is what the `WsContext` extractor
# authenticates against.
egret-auth.workspace = true
# `WsContext` — the extractor that resolves `{workspace}` and membership. The
# workspace a handler acts on comes from here, never from a second read of the
# path segment.
egret-workspace.workspace = true
# The Query seam's LEAF contract crate — `QueryExecPort` (schema resolution for
# validate-before-publish) plus the shared `Engine`/`Database` vocabulary. This
# crate must never depend on `egret-query` itself: the whole point of the port
# is that the Data API can move to its own binary by swapping the impl.
egret-query-api.workspace = true
# The append-only audit trail (Task 5). `AuditSink::emit` is a non-blocking
# `try_send` on an mpsc channel — it never awaits and never fails the caller, so
# no handler's error type changes to carry it.
egret-audit.workspace = true
axum.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tokio.workspace = true
async-trait.workspace = true
# Client-secret hashing (create) + verification (the `ClientVerifier` impl).
# Argon2 matches `CatalogStore::verify_client` — affordable here because it
# runs once per TOKEN, not once per API request.
argon2.workspace = true
# Random client-id/secret material.
rand.workspace = true
base64.workspace = true
utoipa.workspace = true
# The endpoint-SQL renderer (`render.rs`). Chosen for one structural property:
# `Environment::set_formatter` replaces value emission wholesale, so a template
# has NO path from `{{ … }}` to raw SQL text — the formatter writes `?` and binds.
# Feature set is pinned in the workspace manifest; read the comment there before
# adding one.
minijinja.workspace = true
# The serving response cache's key (`serving/cache.rs`). A hash rather than a
# concatenation so the key is fixed-length however many parameters an endpoint
# declares, and so no separator question arises from a value containing one.
sha2.workspace = true

[dev-dependencies]
tower.workspace = true
# `serving_auth.rs` asserts that every rejection arm LOGS its reason. The doc on
# `verify_serving_token` promises an operator can tell a stale token from a
# replayed catalog one; without a subscriber to capture the events, that promise
# was prose and stayed false through a whole review.
tracing-subscriber.workspace = true
# `CedarPdp::build` needs an `EventBus` — the route tests run against the REAL
# PDP, not a mocked decision, so a mis-scoped permission cannot pass.
egret-events.workspace = true
