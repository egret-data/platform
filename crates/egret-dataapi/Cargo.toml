[package]
name = "egret-dataapi"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
egret-core = { workspace = true, features = ["http"] }
egret-dataapi-api.workspace = true
egret-metastore.workspace = true
# The mini machine-IdP `ClientVerifier`/`VerifiedClient` this crate's
# `ClientStore` implements — a second audience (`data-api`) on the same IdP the
# Catalog Client registry already registers with.
egret-machine-idp.workspace = true
# Management routes (Task 5): `UserRepo::insert_service` mints the service
# account's `users` row, and `SessionService` is what the `WsContext` extractor
# authenticates against.
egret-auth.workspace = true
# `WsContext` — the extractor that resolves `{workspace}` and membership. The
# workspace a handler acts on comes from here, never from a second read of the
# path segment.
egret-workspace.workspace = true
# The Query seam's LEAF contract crate — `QueryExecPort` (schema resolution for
# validate-before-publish) plus the shared `Engine`/`Database` vocabulary. This
# crate must never depend on `egret-query` itself: the whole point of the port
# is that the Data API can move to its own binary by swapping the impl.
egret-query-api.workspace = true
# The append-only audit trail (Task 5). `AuditSink::emit` is a non-blocking
# `try_send` on an mpsc channel — it never awaits and never fails the caller, so
# no handler's error type changes to carry it.
egret-audit.workspace = true
axum.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
# The metrics FACADE only (`counter!`/`histogram!`). No recorder, no exporter:
# a library crate must not decide how a process exposes its metrics, and until
# `egret-bin` installs one every macro here compiles to a no-op. See
# `serving/metrics.rs` for the label set and why it is bounded.
metrics.workspace = true
tokio.workspace = true
async-trait.workspace = true
# Client-secret hashing (create) + verification (the `ClientVerifier` impl).
# Argon2 matches `CatalogStore::verify_client` — affordable here because it
# runs once per TOKEN, not once per API request.
argon2.workspace = true
# Random client-id/secret material.
rand.workspace = true
base64.workspace = true
utoipa.workspace = true
# The endpoint-SQL renderer (`render.rs`). Chosen for one structural property:
# `Environment::set_formatter` replaces value emission wholesale, so a template
# has NO path from `{{ … }}` to raw SQL text — the formatter writes `?` and binds.
# Feature set is pinned in the workspace manifest; read the comment there before
# adding one.
minijinja.workspace = true
# The serving response cache's key (`serving/cache.rs`). A hash rather than a
# concatenation so the key is fixed-length however many parameters an endpoint
# declares, and so no separator question arises from a value containing one.
sha2.workspace = true
# Package 4: the SHARED rate-limit/response-cache store (`serving/shared.rs`),
# which is what stops a multi-replica deployment from multiplying every published
# rate limit by its replica count. Feature set is pinned in the workspace
# manifest; `script` is load-bearing, not a convenience — read the comment there
# before touching it.
redis.workspace = true
# `url::form_urlencoded` — the serving path's parameter decoding
# (`serving/params.rs`). Reached through `url` rather than by adding
# `form_urlencoded` directly because `url` is already the workspace's pinned
# entry point for it, and because this must decode the way axum's own `Query`
# extractor does: percent-decoding plus `+` as a space.
url.workspace = true
# `ServiceExt::oneshot` — the Try-it route (`try_it.rs`) calls the REAL serving
# router in process through its tower `Service`, the same way the test suites
# drive it. A production dependency rather than a dev one for exactly that
# reason: the guarantee is that a trial traverses the shipped router, so the
# call has to be in the shipped code.
tower.workspace = true
# C1 Task 2: `check_constraints`/`compile_pattern` in `lifecycle.rs` compiles
# and applies an author-declared `ParamSpec::pattern` at publish time.
regex.workspace = true
# Package 5: the same author `pattern`, asked a question a `Regex` cannot answer
# — not "does this VALUE match" but "can this pattern's language contain a
# character that is unsafe in SQL text". `pattern_confines_to_safe_alphabet`
# walks the parsed HIR to decide it, and refuses anything it cannot prove safe.
regex-syntax.workspace = true
# C2 Task 1: the response-transform evaluator (`transform.rs`). The sandbox is a
# property of the LANGUAGE, not of globals we remembered to strip — the module's
# first test is what pins that claim.
starlark = { workspace = true }

[dev-dependencies]
# One private, already-migrated database per test process. Replaces the
# `#[path]`-included `tests/test_db/mod.rs` this crate used to own.
egret-test-db.workspace = true
# `serving_shared_store.rs` opens its OWN connection to look at what
# `SharedStore` actually wrote. Asking the implementation whether it stored
# something is asking it to confirm its own claim, and would pass just as well
# against an in-process map — which is the one failure this suite is written to
# make impossible.
redis.workspace = true
# `serving_auth.rs` asserts that every rejection arm LOGS its reason. The doc on
# `verify_serving_token` promises an operator can tell a stale token from a
# replayed catalog one; without a subscriber to capture the events, that promise
# was prose and stayed false through a whole review.
tracing-subscriber.workspace = true
# `serving_metrics.rs` installs a REAL Prometheus recorder and scrapes it, so
# the assertions are about a value that MOVED on the shipped path rather than
# about a counter's existence. Dev-only: the exporter is `egret-server`'s.
metrics-exporter-prometheus.workspace = true
# `CedarPdp::build` needs an `EventBus` — the route tests run against the REAL
# PDP, not a mocked decision, so a mis-scoped permission cannot pass.
egret-events.workspace = true
# `serving_starrocks_live.rs` ONLY. Every other suite in this crate drives a fake
# `QueryExecPort`, so nothing engine-side had ever been executed by a test and every
# claim about StarRocks or Trino behaviour rested on reading rather than running.
# That file swaps the fake for `egret_query::EngineState`, the real implementation
# the binary ships.
#
# A DEV-dependency, deliberately. The note beside `egret-query-api` above still holds
# for the library: `egret-dataapi` must never depend on `egret-query`, because the
# whole point of the port is that the seam can move to another binary. A dev-only
# edge does not link into the library and cannot be reached from `src/`, so the
# architectural rule is intact — and there is no cycle, `egret-query` does not depend
# on this crate.
egret-query.workspace = true
# The concrete `EngineState` the port implementation lives on needs these to be
# constructed at all: an object store (inert here — the Data API path never
# materialises a result set to S3), a secret store for the connection, and the
# engine-token minter trait the delegation path resolves through.
# (`egret-auth` and `egret-workspace` are already normal dependencies above.)
egret-storage.workspace = true
egret-secrets.workspace = true
egret-analytics-api.workspace = true
# J-F3 Task 1b: `DataApiState::group_recompiler` is a port the binary fills with
# `egret_perm_compile::PermGroupRecompiler`; the suites build the state with the
# REAL implementation, not a stub, so a service-account delete in a test
# recompiles exactly as it does in production. Dev-only, like `egret-query`
# above: the library stays off the compiler, and there is no cycle
# (`egret-perm-compile` does not depend on this crate).
egret-perm-compile.workspace = true
