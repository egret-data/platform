[package]
name = "egret-catalog-registry"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The platform catalog registry (SP3): the `registry` schema, the typed
# per-kind catalog configuration, and rendering.
# No axum and no engine-mgmt dependency: engine-mgmt (routes, apply) and
# catalog-engine (warehouse routes) both depend on this crate.
[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
regex.workspace = true
# `CatalogDef::probe_target` parses the stored metastore URI into the host and
# port a reachability probe dials (SP3c D4). Pinned by the workspace.
url.workspace = true
egret-config.workspace = true
egret-metastore.workspace = true
egret-secrets.workspace = true
# `perm` seam (SP4a Task 6 fix round 1, Important 1): `ensure_warehouse_catalog`
# writes a `catalog_workspaces` row too (the warehouse catalog assigned to its
# owning workspace) and must sync the same implicit `perm.grants` row the PUT
# .../workspaces handler does, in the SAME transaction — D3's invariant
# ("assigning a catalog to a workspace grants it read") otherwise holds on
# only one of its two write paths. Safe to add here post-split
# (`egret-perm-compile` carries the `egret-policy` dependency now; this crate
# gets none of it).
egret-perm.workspace = true
sqlx.workspace = true
chrono.workspace = true
tracing.workspace = true

[dev-dependencies]
egret-test-db.workspace = true
tokio.workspace = true
# `no_primary_is_warned.rs` reads back the WARN `list_engine_attachments` emits
# for an engine with catalogs and no primary. That promise is the only thing
# standing between a zero-primary engine and Trino silently renumbering its
# catalogs, and without a subscriber to capture the event it is prose.
tracing-subscriber.workspace = true
