[package]
name = "egret-workspace"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# `http` feature: reference `egret_core::http::ErrorBody` in the OpenAPI
# annotations (E0·P4b-2).
egret-core = { workspace = true, features = ["http"] }
egret-audit = { workspace = true }
egret-metastore.workspace = true
egret-auth.workspace = true
# SP4a D3: a workspace-membership write recompiles the Ranger profiles whose
# compiled policies enumerate that membership, in the SAME transaction as the
# `access_grants` write (`members::MemberRepo`). Cycle-checked: nothing in
# `egret-perm-compile`'s graph (egret-perm, egret-policy, egret-auth,
# egret-core) depends on `egret-workspace`.
egret-perm-compile.workspace = true
axum.workspace = true
# `cookie` feature: read the session cookie (`CookieJar`) in the ws_admin
# impersonation start endpoint to key the overlay on the caller's own session.
axum-extra = { workspace = true }
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait.workspace = true
# OpenAPI emit (E0·P4b-2): `#[utoipa::path]` on the me/admin/ws-member routers'
# handlers + the per-router doc structs merged in `openapi()`.
utoipa.workspace = true

[dev-dependencies]
# One private, already-migrated database per test process, cloned from a
# shared template. Replaces the shared `DATABASE_URL` database, which
# nothing cleaned and every fixture paid for.
egret-test-db.workspace = true
tokio.workspace = true
tower.workspace = true
http-body-util = "0.1"
egret-config.workspace = true
# Real `CedarPdp` in the authz-gate tests needs an `EventBus` to build against
# (the migrated `require()` gates resolve through `WorkspaceState.pdp`).
egret-events.workspace = true
# SP4a D3: `tests/member_recompile.rs` builds a real Ranger profile + engine +
# assigned catalog and asserts a membership write updates the COMPILED policy.
egret-perm.workspace = true
egret-policy.workspace = true
serde_json.workspace = true
