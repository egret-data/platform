[package]
name = "egret-workspace"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# `http` feature: reference `egret_core::http::ErrorBody` in the OpenAPI
# annotations (E0·P4b-2).
egret-core = { workspace = true, features = ["http"] }
egret-metastore.workspace = true
egret-auth.workspace = true
axum.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
anyhow.workspace = true
tracing.workspace = true
async-trait.workspace = true
# OpenAPI emit (E0·P4b-2): `#[utoipa::path]` on the me/admin/ws-member routers'
# handlers + the per-router doc structs merged in `openapi()`.
utoipa.workspace = true

[dev-dependencies]
tokio.workspace = true
tower.workspace = true
http-body-util = "0.1"
egret-config.workspace = true
