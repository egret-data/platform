[package]
name = "egret-workflow"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
# Already in this workspace's tree via utoipa 5.5.0, so this adds zero new
# transitive crates -- `cargo tree -i serde_norway` shows utoipa as its only
# parent today. Chosen over the more popular serde_yaml because that crate is
# archived upstream (0.9.34+deprecated) and reaches us only through kube-client.
# Error::location() gives the line/column that spec section 9 layer 1 requires.
serde_norway = "0.9"
# `arbitrary_precision` is named here so that THIS crate's own resolution
# equals the one it ships in, not because W2 wants to turn a feature on.
#
# It is already on in the shipping binary: `starlark` 0.14.2 enables it,
# `egret-dataapi` depends on starlark, and `egret-bin` pulls both
# `egret-dataapi` and `egret-workflow`, so cargo's feature unification turns it
# on for every crate in that build. Measured, not assumed --
# `cargo tree -p egret-bin --format "{p} [{f}]"` shows
# `serde_json v1.0.151 [alloc,arbitrary_precision,default,indexmap,preserve_order,raw_value,std]`
# where the same command for `-p egret-workflow` showed it absent.
#
# That difference is what made `cargo test -p egret-workflow` green while the
# same tests failed in `cargo test --workspace`: 13 lib tests and both oracle
# tests. Declaring the feature deletes the difference -- there is now no
# resolution of this crate in which the tests mean something else. See
# `runners::env::OrderedJsonVisitor::visit_map` for what the feature changes.
#
# Two things keep it from drifting back:
# `runners::env::tests::the_arbitrary_precision_sentinel_is_still_spelled_this_way`
# fails by name if this line is dropped (it asserts the resolution the crate is
# written against, under every command anyone runs), and `just
# test-shipping-resolution` -- also a step in `.github/workflows/ci.yml` --
# compiles this crate's tests with `-p egret-bin` selected, which is the
# resolution that actually ships and therefore catches the NEXT feature.
serde_json = { workspace = true, features = ["arbitrary_precision"] }

# Task 5: the repository. `egret-metastore` for `Db`. Plain `sqlx` for
# `query_as`/`FromRow`, following `crates/egret-dataapi/src/endpoints.rs`.
#
# Task 7: `http` feature turned on -- this crate now DOES map to axum
# (`Error -> Response`, `WorkspacePath`, `Ack`) for `routes.rs`, unlike the
# note this comment used to carry ("no `http` feature ... that is Task 7's
# job").
egret-core = { workspace = true, features = ["http"] }
egret-metastore.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
# W2 Task 5: `date`/`dateAdd`/`timestamp*` take an IANA `timeZone` argument
# (`ZoneId.of("Asia/Tokyo")`), and a zone's DST transitions decide what
# `dateAdd(1, 'DAYS')` answers -- chrono alone carries fixed offsets only.
# Already a workspace dependency (schedules resolve their zone through it), so
# this adds a direct edge and no new crate.
chrono-tz.workspace = true
# W13b Task 3: a `dependsOn` condition's key is Kestra's
# `Hashing.hashToString` -- Guava `murmur3_128`, seed 0 -- over the
# dependency's content (`trigger::depends_on::condition_key`). Pinned to the
# version already in Cargo.lock through `iceberg`, so this adds a direct edge
# and no new crate.
murmur3 = "=0.5.2"
# Package #5a Task A4 (spec D3): `runners::arith`'s port of Java's
# `BigDecimal` (exact `add`/`subtract`, `DECIMAL128` `multiply`/`divide`/
# `remainder`) carries the unscaled value as a `BigInt`. Pinned to the version
# already in Cargo.lock through `ion-rs`, so this adds a direct edge and no
# new crate.
num-bigint = "=0.4.8"
anyhow.workspace = true

# Task 6 (publish): `RefKind` and `WorkflowRefPort` -- the port trait publish
# resolves every reference through -- now live in this leaf crate rather than
# here, so `egret-dataapi`/`egret-automation`/etc. can implement it without
# depending on the workflow engine.
egret-workflow-api.workspace = true

# W5a Task 2: `scripts::gate` reads `egret_config::PluginConfigurations` (the
# `allowed-images` allowlist). `egret-config` sits below this crate and depends
# on nothing of it, so the edge creates no cycle; it was already a
# dev-dependency (see below), and this makes it a normal one.
egret-config.workspace = true

# KI-112: `secret_inputs` seals a SECRET input's value with `egret_secrets::Crypto`,
# the workspace secret store's own AES-256-GCM. It was a dev-dependency (see
# below) and depends only on egret-core and egret-metastore, so no cycle.
egret-secrets.workspace = true

# Task 7 (routes): the HTTP surface. `axum`/`utoipa` for the router and its
# OpenAPI doc; `egret-workspace` for `WsContext` (the extractor that resolves
# `{workspace}`, membership, and the feature-entitlement gate); `egret-auth`
# for `SessionService`, which `WsContext` authenticates against; `egret-audit`
# for the mutation trail every other management seam writes to.
#
# W9a Task 7: the `multipart` feature, for FILE inputs uploaded to
# `POST .../flows/{id}/executions` (`routes::start_flow_execution`). It adds
# ONE crate to the build, `multer` (axum's multipart parser), and nothing else
# new: its own dependencies were already in the lock file.
axum = { workspace = true, features = ["multipart"] }
# W9a Task 7: `Limited`, the body limit the start route applies per content
# type -- 2 MiB for JSON (axum's default, unchanged) and `max_file_bytes` plus
# 1 MiB for multipart. Already in the tree under axum and a direct dependency
# of a dozen sibling crates, so no new crate.
http-body-util = "0.1"
utoipa.workspace = true
egret-workspace.workspace = true
egret-auth.workspace = true
egret-audit.workspace = true

# W3b Task 6: `worker::handlers::sql` is `egret.sql`, and it is built on
# `QueryExecPort` -- the LEAF contract crate, never `egret-query`. The programme
# spec section 6.4 states the rule ("handlers depend on port traits, never on
# concrete crates, exactly as `egret-dataapi` holds `Arc<dyn QueryExecPort>` and
# does not know `egret-query`"), and this is that rule applied: the port carries
# the workspace-scoping obligation, `Param`/`Limits`/`TabularResult` are its
# vocabulary, and `ExecFailure::kind_of` is how the handler tells an engine
# failure from egret's own without matching on a message.
#
# `egret-query` itself is a DEV-dependency below, for the live test only.
egret-query-api.workspace = true

# Task 7's `refs.rs`: the real `WorkflowRefPort` implementation resolves
# `RefKind::DataApiEndpoint` through this LEAF contract crate (no sqlx/axum,
# mirroring `egret-automation`'s identical pair) rather than depending on
# `egret-dataapi` itself. `RefKind::Database`/`Dataset`/`Chart` have no such
# port anywhere in the workspace yet and resolve to `None` (fail-closed) --
# see `refs.rs`'s module comment for the per-kind table. (`RefKind::Notebook`
# resolved through `egret-analytics-api` below the same way until Data Apps
# P6 removed it; that dependency stays for the `engine_token` seam its own
# live test, `tests/sql_starrocks_live.rs`, still uses.)
egret-dataapi-api.workspace = true
egret-analytics-api.workspace = true

# `refs.rs`'s `WorkflowRefs` implements `WorkflowRefPort` (async-trait), and
# `routes.rs`'s DTO conversions from `spec::{Finding, ValidationReport}`
# derive `Serialize`/`ToSchema` -- moved out of [dev-dependencies] because
# both are now used by the library itself, not only by
# `tests/publish.rs`'s `FakeRefs`.
async-trait.workspace = true

# W2 Task 2: `runners::rewrite::RewriteError` derives `thiserror::Error`,
# following the rest of the workspace's error-type convention (see e.g.
# `egret-core`, `egret-dataapi`).
thiserror.workspace = true

# W2 Task 3: `runners::env` builds the real render environment, so minijinja
# moves out of [dev-dependencies] (where Task 2 kept it, only to parse-check
# its rewrites) and becomes a runtime dependency. The workspace entry's
# feature list is taken AS-IS -- `default-features = false` plus six named
# features, with `macros` and `multi_template` deliberately OFF so
# `{% macro %}`, `{% call %}`, `{% include %}` and `{% extends %}` do not
# parse at all. Nothing added here needs them: Kestra's Pebble extension
# registers no tags of its own (`Extension.getTokenParsers()` returns null),
# and a `Property` is a single literal template with no loader behind it.
minijinja.workspace = true

# W2 Task 3: `VariableRenderer`'s `{% raw %}` protection is a regex in Kestra
# (`VariableRenderer.java:23`) and is ported as that same regex here -- see
# `runners::env::RAW_PATTERN`. Already in this workspace's tree, so this adds
# no new transitive crates.
regex.workspace = true
# W9b Task 5 fix round 1 (I1): `storage::nsfiles::glob` checks each pattern
# with the parser `regex` itself runs, so a syntax error names its pattern
# while the whole list compiles as ONE `RegexSet` under one size budget. The
# workspace pins it beside `regex` (one parser; see the root manifest), so
# this adds a direct edge and no new crate.
regex-syntax.workspace = true

# W2 Task 4: the `md5`/`sha1`/`sha512` filters are Kestra's `ShaBaseFilter`,
# i.e. `MessageDigest.getInstance(...)` over the input's UTF-8 bytes, rendered
# as lowercase hex. `sha2` and `hex` are already workspace dependencies;
# `sha1` 0.10 is already a direct dependency of `egret-bin` and `md-5` 0.10 is
# the same RustCrypto generation (`digest` 0.10) as `sha2` 0.10, so all four
# share one `digest` rather than dragging in the 0.11 line beside it.
#
# There is deliberately no `sha256` filter: Kestra's `Md5Filter`/`Sha1Filter`/
# `Sha512Filter` all carry a copy-pasted "implements the 'sha256' filter"
# javadoc, but `Extension.getFilters()` registers only those three names.
sha2.workspace = true
sha1 = "0.10"
md-5 = "0.10"
hex.workspace = true

# W2 Task 4: `slugify` is `io.kestra.core.utils.Slugify.of`, whose second step
# is `Normalizer.normalize(s, Form.NFD)` -- that is what turns "Café" into
# "cafe" rather than "caf", because the combining accent is only strippable by
# the `[^\w-]` pass once decomposition has separated it from the base letter.
# Already in this workspace's lock file at 0.1.25, so this adds a direct edge
# and no new compilation. `oracle/corpus.json`'s `filter-slugify-accents` is
# the entry that fails without it.
unicode-normalization = "0.1"

# W2 Task 6: the `jq` filter is Kestra's `JqFilter`, which compiles the query
# with `net.thisptr:jackson-jq` at `Versions.JQ_1_6`. `jaq` is the Rust
# implementation of the same language; the three crates are its library split
# (`jaq-core` the interpreter, `jaq-std` the standard library, `jaq-json` the
# JSON value type and reader). A 132-expression sweep of Kestra's jq surface
# against these agreed on 116 -- the 16 that differ are enumerated in
# `oracle/README.md`.
#
# `ion-rs` is deliberately NOT here, though W2 Task 6's brief names it:
# measured on 1.0.1, its text writer emits `{a: 1}` where Kestra emits `{a:1}`,
# a trailing comma inside sequences, `1e100` for `1.0e100`, and unescaped
# control characters -- and its `Writer`/`ValueWriter` are `pub(crate)`, so
# none of that is configurable. `runners::ionfmt` writes the format directly
# instead; its module doc carries the table.
#
# W9a Task 8: the READER of `ion-rs` 1.0.1 is now used (`storage::ion`), for
# the file API's preview: Kestra's STORE files are BINARY Ion with a version
# marker per row and no lines, and `ionfmt::read_ion` refuses the timestamps
# and blobs they hold. Nothing above changes: egret still writes Ion itself.
# W9a Task 12 fix rounds 3-4: `experimental-reader-writer` makes `SymbolTable`
# public, and `experimental-tooling-apis` makes `SystemReader` and
# `SystemStreamItem` public, so `storage::ion` sees EVERY item the reader
# consumes -- a version marker, a local symbol table, a value -- and charges
# the symbol table after each one, not only after a value (the elements of a
# value are counted by the depth scan before the reader sees them, so no
# lazy walk is needed). Pinned `=1.0.1`, the features' API cannot move.
# PIN NOTE (fix round 5): `storage::ion` also relies on
# `SystemReader::pending_context_changes()` returning a type `ion-rs` does
# NOT export (`pub(crate) struct PendingContextChanges`, reachable only
# through that `pub fn`) and calls its `local_symbols()` and
# `imported_symbols()` on it. A later `ion-rs` may hide or rename it: on
# ANY bump, re-check `lazy/system_reader.rs` and `tests/ion_memory.rs`'s
# back-to-back symbol-table test before trusting the symbol charge.
ion-rs = { version = "=1.0.1", features = [
    "experimental-reader-writer",
    "experimental-tooling-apis",
] }
jaq-core = "3.1"
jaq-std = "3.0"
jaq-json = "2.0"

# W2 Task 7: `uuid()`, `id()`, `ksuid()`, `nanoId()` and `randomInt()` are
# `SecureRandom` / `Math.random()` in Kestra. `rand` is already a workspace
# dependency at 0.8, so this is a direct edge and no new crate; `getrandom`
# under it is the same OS entropy source `SecureRandom` reads.
#
# `uuid` is deliberately NOT used for `uuid()`: the workspace entry carries
# `["v4", "serde"]` and Kestra's function is a **v7**, so it would mean adding
# a feature to a shared dependency for sixteen bytes of layout that this
# module has to pin against the artifact's bytecode anyway.
rand.workspace = true

# W2 Task 8: `encrypt()`/`decrypt()` are `io.kestra.core.encryption.EncryptionService`,
# and that class is pure -- `AES/GCM/NoPadding`, a base64 key, a 12-byte random
# IV prefixed to the ciphertext, a 128-bit auth tag, base64 out. Read from
# `javap -p -c EncryptionService`, not from a doc. Both crates are ALREADY
# workspace dependencies (`egret-secrets` and `egret-engine-mgmt` both take
# aes-gcm today), so this is a direct edge and no new crate; `aes` itself reaches
# the AES-192 key size through `aes_gcm::aes`, which aes-gcm re-exports, rather
# than through a second dependency entry.
aes-gcm.workspace = true
base64.workspace = true

# W3b Task 3: `worker::handlers::sleep` is `core.flow.Sleep`, which must
# actually wait -- a Sleep that returned immediately would make every
# `overlapping` ordered pair in the execution oracle unreachable -- and it must
# wait without blocking the runtime thread, so `tokio::time::sleep`. `tracing`
# is `worker::handlers::TracingSink`, the shipping `LogSink`: `core.log.Log`
# has no output at all, so its log lines are the only thing it produces.
# Both were already in this workspace's tree (tokio was this crate's own
# dev-dependency), so neither adds a new crate to the build.
tokio.workspace = true
tracing.workspace = true

# W10 Task 2: `runtime::spawn` is cancelled by a `CancellationToken`, which is
# the same shape `egret-automation`'s ticker and `egret-kernel`'s reaper already
# take from `egret-bin` -- one token cancelled on SIGINT stops every background
# loop the binary started. Already a workspace dependency (egret-automation and
# egret-kernel both take it), so this is a direct edge and no new crate.
#
# W9a Task 7: the `io` feature, for `io::StreamReader` -- an uploaded part (a
# stream of `Bytes`) read as the `AsyncRead` `storage::inputs::upload_input`
# streams into the store. `egret-provisioner` already turns it on
# (`crates/egret-provisioner/Cargo.toml`), so no new crate.
tokio-util = { workspace = true, features = ["io", "io-util"] }

# W5a Task 4: `worker::k8s` is the Kubernetes task runner
# (`io.kestra.plugin.ee.kubernetes.runner.Kubernetes`). Both crates are the
# workspace's own entries, already linked into `egret-bin` by the notebook
# kernel launcher (`kernel_launcher_k8s.rs`), so this adds edges and no new
# crate; `ws` (in the workspace entry) is what `pods/exec` needs.
# `futures-util` reads `pods/log`, which kube hands back as a
# `futures::AsyncBufRead`; also already in the tree.
kube.workspace = true
k8s-openapi.workspace = true
futures-util.workspace = true

# W9a Task 3: `storage::FileStore` holds the object store an execution's files
# live in (the `S3Store` `egret-bin` already builds for query results). Was a
# dev-dependency (the StarRocks live test's `EngineState`); the library now
# uses it.
egret-storage.workspace = true

# W9b Task 9: `storage::nsfiles::zip` (the streamed export) computes each
# entry's CRC-32 as its body streams through. A new DIRECT dependency; the
# crate and this exact version were already in Cargo.lock (flate2 and others
# pull it), so no new crate enters the build.
crc32fast = "=1.5.0"

# Package #3 Task A2 (spec D10): an input's `validator` is a Java regex, full
# match, with lookaround and backreferences, which `regex` cannot express.
# `fancy-regex` gives both plus a backtrack limit, which stands in for
# Kestra's 10 s timeout. Pinned to the version already in Cargo.lock (through
# `starlark`), so this adds a direct edge and no new crate.
fancy-regex = "=0.16.2"
# Package #4 (http tasks): every request to a flow-chosen URL goes through
# the shared egress guard (vetted, pinned, no proxy, redirects re-vetted).
# `reqwest` for its request/response types, `url` to parse and extend the
# task's `uri`, `bytes` for bodies. All three were already in Cargo.lock.
egret-egress.workspace = true
reqwest.workspace = true
url.workspace = true
bytes.workspace = true
# Package #4 Task C3 (spec D6): `http.Request` fails on a code point Java's
# `Character.isDefined` rejects, which needs Unicode's unassigned table.
# Pinned to the version already in Cargo.lock, so this adds an edge only.
unicode-general-category = "=1.1.0"

[features]
# `storage::install_mem_for_tests` and `egret_storage::MemStore`; and
# `runtime::install_served_for_tests` (no-silent-stall Task 2).
test-util = ["egret-storage/test-util"]

[dev-dependencies]
# minijinja moved to [dependencies] in W2 Task 3 (`runners::env` builds the
# real environment). `runners::rewrite`'s tests still reach it as
# `minijinja::...` through the crate's own dependency, to parse-check every
# rewritten output -- a test that pins a shape minijinja rejects is worse
# than no test, since it certifies a bug.

# serde_json moved to [dependencies] in W1 (Property<T> uses it directly);
# tests still reach it as `serde_json::...` via the crate's own dependency.

# repo.rs's DB-gated tests (`tests/repo.rs`): one private, already-migrated
# database per test process, per `egret-test-db`'s own doc.
egret-test-db.workspace = true

# tests/routes.rs drives the router over a real `axum::Router` and a real
# `CedarPdp`, following `crates/egret-dataapi/tests/endpoints_routes.rs`.
# Body bytes come off the response via `axum::body::to_bytes`, so no separate
# `http-body-util` dependency is needed (that crate's own dependency covers it).
tower.workspace = true
egret-events.workspace = true

# W3b Task 6: `tests/sql_starrocks_live.rs` ONLY, and it is the whole instrument
# for `egret.sql` -- that handler reaches ZERO corpus entries, so the execution
# ratchet says nothing about it and a real engine has to. This mirrors
# `egret-dataapi`'s `serving_starrocks_live.rs` exactly, including the reason it
# is dev-only: the library must never depend on `egret-query`, because the whole
# point of `QueryExecPort` is that the seam can move to another binary. A
# dev-only edge does not link into the library and cannot be reached from
# `src/`, and there is no cycle -- `egret-query` does not depend on this crate.
egret-query.workspace = true
# What `EngineState` needs to exist at all: an object store (inert here -- this
# path never materialises a result set), the secret stores a `DatabaseRepo`
# opens a connection's credentials through, and the engine-token minter the
# delegation branch would resolve through (refused, so the branch being taken is
# a failure rather than a silent mint). (`egret-storage` itself moved to
# [dependencies] in W9a Task 3.)
#
# W9a Task 3: this crate's own `test-util` feature (`storage::install_mem_for_tests`,
# `egret_storage::MemStore`) for its unit and integration tests, the pattern
# `egret-storage`'s own Cargo.toml uses.
egret-workflow = { path = ".", features = ["test-util"] }
# W9c Task 3: `tokio::time::pause` for the KV expiry sweeper's first-pass
# test (`#[tokio::test(start_paused = true)]`).
tokio = { workspace = true, features = ["test-util"] }
egret-analytics-api.workspace = true

# W10 Task 2, `tests/runtime.rs` ONLY, and for exactly one assertion:
# `the_config_default_working_timeout_equals_the_workers_own`. The two numbers
# it compares live in crates that cannot see each other -- `egret-config` sits
# BELOW this one, so `DEFAULT_WORKING_TIMEOUT` cannot be named from there and
# the config's `3600` would otherwise be a second copy nothing compares to the
# first. A dev-only edge does not link into the library, cannot be reached from
# `src/`, and creates no cycle (`egret-config` does not depend on this crate) --
# the same argument this file already makes for `egret-query`.
# (W5a Task 2 made it a normal dependency above; the dev-only edge this
# paragraph argued for is now subsumed by it.)

# W13a Task 4, `tests/flow_trigger_fire.rs` ONLY: the processor gives up on an
# event after five attempts and says which listeners at `warn`, and that log
# line is the only place the give-up is visible. Captured the way
# `egret-dataapi`'s `tests/serving_auth.rs` does. Already a workspace
# dependency, so no new crate.
tracing-subscriber.workspace = true

# `tests/k8s_runner_live.rs` and `runtime::tests` (debt D3 wiring test): kube's TLS client needs a rustls crypto
# provider, and this tree enables both ring and aws-lc-rs, so none is chosen
# automatically (a runtime panic). `egret-bin` installs ring at startup with
# this same pin (`crates/egret-bin/Cargo.toml`); the test's `main` does the
# same. Already in the lock file, so no new crate.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# `tests/container_docker_live.rs` runs WITHOUT libtest, and that is fix round
# 1's reviewer plan item 2 rather than a preference.
#
# libtest has no stable way for a test to report itself IGNORED at run time, so
# a suite that self-skips reports `13 passed` — a test that did not run counted
# as passed. That is exactly the shape `tests/sql_starrocks_live.rs` shipped
# (`7 passed; 0 failed; 0 ignored` in 0.00s with no engine, the identical line
# in 0.88s with one) and the reviewer's point is that an honest
# `0 passed; 13 ignored` would have made it unmisreadable the day it landed.
#
# The hand-rolled main() emits libtest's own line format, so `cargo test`'s
# output and every tool that counts `test result:` lines keep working — see the
# file's own doc for what it does and does not implement.
[[test]]
name = "container_docker_live"
harness = false

# W5a Task 4: the Kubernetes runner against a real cluster, gated on
# `EGRET_TEST_KIND=1` and reported IGNORED (never passed) without it -- the
# same hand-rolled main as `container_docker_live`, for the same reason.
[[test]]
name = "k8s_runner_live"
harness = false

# W9a Task 4 fix round 1: `read()` against RustFS (a real S3Store) on one, two
# and four tokio workers with as many or more concurrent renders, under a
# watchdog so a wedged runtime FAILS. Gated on EGRET_TEST_S3_ENDPOINT and
# reported IGNORED (never passed) without it -- the same hand-rolled main.
[[test]]
name = "storage_render_s3_live"
harness = false

# W9a Task 8: a 64 MiB download through the execution file API, from RustFS,
# gated on EGRET_TEST_S3_ENDPOINT and reported IGNORED without it.
[[test]]
name = "storage_files_api_s3_live"
harness = false

# W9a Task 13: the pruner and the orphan sweep on RustFS, under a throwaway
# prefix and a fence refusing any delete outside it; IGNORED without the gate.
[[test]]
name = "storage_prune_s3_live"
harness = false

# W9b Task 3: namespace file writes on MinIO (a 20 MiB multipart file; a move
# and a purge of names with spaces and non-ASCII), under a throwaway prefix
# and a fence refusing any delete outside it; IGNORED without the gate.
[[test]]
name = "nsfiles_s3_live"
harness = false

# W9b Task 8: the namespace file API on MinIO (a 64 MiB upload and streamed
# download through the routes), under a throwaway prefix and a fence refusing
# any delete outside it; IGNORED without the gate. Its own binary: the routes
# read the process's one installed store.
[[test]]
name = "nsfiles_api_s3_live"
harness = false

# W9c Task 3: the KV writes, purge and expiry sweep on MinIO (a value of
# exactly max_read_bytes), under a throwaway prefix and a fence refusing any
# delete outside it; IGNORED without the gate.
[[test]]
name = "kv_s3_live"
harness = false
