[package]
name = "egret-audit"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
egret-core = { workspace = true }
egret-metastore = { workspace = true }
tokio = { workspace = true, features = ["sync", "rt", "time", "macros"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
sqlx = { workspace = true }

[dev-dependencies]
# One private, already-migrated database per test process, cloned from a
# shared template. Replaces the shared `DATABASE_URL` database, which
# nothing cleaned and every fixture paid for.
egret-test-db.workspace = true
tokio = { workspace = true, features = ["full"] }
