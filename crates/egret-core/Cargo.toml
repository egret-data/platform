[package]
name = "egret-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
thiserror.workspace = true
anyhow.workspace = true
serde.workspace = true
uuid.workspace = true
axum = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }

[features]
# Opt-in HTTP mapping (Error -> Response, ApiError<D>). Pure-domain consumers
# of egret-core do not pull axum unless they enable this.
http = ["dep:axum", "dep:serde_json"]
# Opt-in opaque-token primitives (mint + sha256 hash). Shared by the session /
# kernel token schemes so the at-rest hashing is defined once.
token = ["dep:sha2", "dep:rand", "dep:base64", "dep:hex"]

[dev-dependencies]
serde_json.workspace = true
axum.workspace = true
tokio = { workspace = true }
