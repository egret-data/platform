[package]
name = "egret-perm"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# SP4a Task 2: the `perm` schema and its store. Grants and named rules over
# registry catalogs — the model a later task compiles into Ranger JSON.
# Model + store live in one crate (unlike the seam "api"/impl split elsewhere)
# because nothing outside SP4a depends on this yet; a later task can split a
# leaf `egret-perm-api` out if a second seam needs the DTOs without sqlx.
[dependencies]
serde.workspace = true
uuid.workspace = true
thiserror.workspace = true
utoipa.workspace = true
sqlx.workspace = true
# Task 4: compiles a Grant into the Ranger AccessPolicyInput/AccessItemInput
# shapes egret-policy's admin/ranger_json.rs already knows how to serialize —
# the compiler builds those values and leaves rendering to that existing code.
egret-policy.workspace = true
# Task 5: compile_rule returns Vec<serde_json::Value> directly (the shape
# egret_policy::admin's renderers already produce) rather than wrapping it in
# a crate-local type.
serde_json.workspace = true

[dev-dependencies]
egret-metastore.workspace = true
egret-test-db.workspace = true
tokio.workspace = true
