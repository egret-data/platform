[package]
name = "egret-automation"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Alerts & Reports seam (P1: model + CRUD; P2 adds the scheduler and evaluator
# to this same crate). Wire DTOs live in the leaf `egret-automation-api`,
# following egret-bi/egret-analytics-api.
[dependencies]
egret-core = { workspace = true, features = ["http"] }
# The SSRF guard behind `deliver::destination` (moved there in workflow #4 C1,
# shared with egret-workflow). A leaf crate: no cycle.
egret-egress.workspace = true
egret-automation-api.workspace = true
egret-metastore.workspace = true
egret-workspace.workspace = true
egret-auth.workspace = true
egret-query.workspace = true
egret-analytics-api.workspace = true
# Task 4 (Z2): the object-kind/read-permission constants a `dataapi_alert`
# needs at save time and run time. A pure leaf (only egret-core) like
# egret-analytics-api above, so this creates no cycle — verified.
egret-dataapi-api.workspace = true
# The render-payload endpoint (P4 Task 3) compiles a chart's saved spec with
# egret-bi's own `compile_chart_sql`, so a report can never diverge from what
# the interactive chart/dashboard endpoints would show. No cycle: egret-bi
# depends on none of egret-automation/-automation-api.
egret-bi.workspace = true
tokio.workspace = true
tokio-util.workspace = true
axum.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
croner.workspace = true
lettre.workspace = true
url.workspace = true
# `for_each_concurrent`: a tick runs its claimed schedules side by side (KI-173).
futures-util.workspace = true
async-trait.workspace = true
reqwest.workspace = true
hmac = "0.12"
sha2.workspace = true
hex.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
egret-secrets.workspace = true
utoipa.workspace = true

[dev-dependencies]
# One private, already-migrated database per test process, cloned from a
# shared template. Replaces the shared `DATABASE_URL` database, which
# nothing cleaned and every fixture paid for.
egret-test-db.workspace = true
tokio.workspace = true
tower.workspace = true
http-body-util = "0.1"
egret-events.workspace = true
egret-analytics-api.workspace = true
async-trait.workspace = true
egret-query.workspace = true
egret-bi.workspace = true
egret-secrets.workspace = true
# Fix-round-2 (Task 5): the REAL `EndpointStore` (not a fake) for
# `AutomationState.dataapi_endpoints` in route tests, so a test proves the
# exact production `DataApiEndpointPort` impl, not a hand-rolled stand-in that
# could quietly drift from it. No cycle: egret-dataapi depends on none of
# egret-automation/-automation-api (verified in the fix-round-2 report).
egret-dataapi.workspace = true
