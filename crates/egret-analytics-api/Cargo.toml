[package]
name = "egret-analytics-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Leaf contract crate for the Analytics/Notebook seam (E5c-1). Holds the shared
# notebook-docs vocabulary — `NotebookSummary`/`EngineOption`/`NotebookRuntime`,
# the `CellOutput` output type, and the engine-token seam types — plus the
# `NotebookDocsPort` reader/writer trait that `egret-kernel` depends on instead
# of concrete `egret-notebook`. Mirrors egret-query-api (E4d) /
# egret-catalog-api (E3b) / egret-policy-api (E2a): pure-serde DTOs + a Port
# trait, no sqlx/axum. Depending on egret-core is fine — it's the foundation
# crate; the leaf stays light. `serde_json` is required only because
# `CellOutput` carries a `serde_json::Value` payload (nbformat display data).
[dependencies]
egret-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
thiserror.workspace = true
# OpenAPI emit (E0·P4b-6): the leaf contract crate carries the `ToSchema` derives
# for the BI wire DTOs (dataset/chart/folder), mirroring egret-query-api. utoipa
# is pure (proc-macro + light runtime), so the leaf stays axum/sqlx-free.
utoipa.workspace = true
