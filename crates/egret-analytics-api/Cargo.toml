[package]
name = "egret-analytics-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Leaf contract crate for the Analytics seam (E5c-1). Holds the engine-token
# seam types (shared by EngineState/BiState delegation) and the pure-serde BI
# wire DTOs (dataset/chart/dashboard/SQL-Lab params and results, hence
# `serde_json`). Mirrors egret-query-api (E4d) / egret-catalog-api (E3b) /
# egret-policy-api (E2a): pure-serde DTOs, no sqlx/axum. Depending on
# egret-core is fine — it's the foundation crate; the leaf stays light.
#
# Data Apps P6 removed this crate's notebook-docs vocabulary and its
# `NotebookDocsPort` trait once `egret-kernel`/`egret-notebook`, its only
# consumers, were deleted — see lib.rs's module doc.
[dependencies]
egret-core.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
async-trait.workspace = true
thiserror.workspace = true
# OpenAPI emit (E0·P4b-6): the leaf contract crate carries the `ToSchema` derives
# for the BI wire DTOs (dataset/chart/folder), mirroring egret-query-api. utoipa
# is pure (proc-macro + light runtime), so the leaf stays axum/sqlx-free.
utoipa.workspace = true
