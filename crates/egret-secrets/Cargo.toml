[package]
name = "egret-secrets"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
egret-core.workspace = true
egret-metastore.workspace = true
aes-gcm.workspace = true
rand.workspace = true
base64.workspace = true
uuid.workspace = true
chrono.workspace = true
serde = { workspace = true, features = ["derive"] }
sqlx.workspace = true
thiserror.workspace = true
# OpenAPI (E0·P4): `NewSecret` is a wire field of the Query seam's database
# registration body, so it carries a `ToSchema` derive.
utoipa.workspace = true

[dev-dependencies]
# One private, already-migrated database per test process, cloned from a
# shared template. Replaces the shared `DATABASE_URL` database, which
# nothing cleaned and every fixture paid for.
egret-test-db.workspace = true
tokio.workspace = true
