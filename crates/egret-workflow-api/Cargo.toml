[package]
name = "egret-workflow-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Leaf contract crate for the Workflow seam (W0/W1). Mirrors egret-dataapi-api /
# egret-query-api / egret-policy-api: no sqlx, axum, or heavy egret-* deps, so
# any cross-seam consumer can depend on the Workflow vocabulary cheaply.
#
# Task 6 is the first caller of `WorkflowRefPort::workspace_of` (`publish`,
# in `egret-workflow`), which is why this crate stops being empty here --
# egret-dataapi-api's own rule: "A trait method with no consumer is untested
# surface -- do not add one ahead of its caller."
[dependencies]
egret-core.workspace = true
uuid.workspace = true
async-trait.workspace = true
