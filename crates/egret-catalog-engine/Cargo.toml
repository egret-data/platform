[package]
name = "egret-catalog-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
# Spike: path deps to the sibling lakekeeper checkout. The lakekeeper workspace
# pins `iceberg` to the same fork rev as egret (bb70173...), so a single
# `iceberg` version must resolve across both workspaces.
# `test-utils` exposes `RequestMetadata::test_user` — a principal-carrying
# actor with a real `UserId`. The spike's headless `bootstrap` needs one:
# `bootstrap` registers the calling user, and `parse_create_user_request`
# requires a user id extractable from the actor. The in-process
# `LakekeeperInternal` actor has NO user id (`user_id()` -> None) and
# `BootstrapRequest` carries no `id` field, so bootstrap-via-internal-actor
# fails with `MissingUserId`. (CE-2 finding — see provision.rs.) `test-utils`
# only adds `lakekeeper-io/storage-in-memory`, so it's cheap to carry.
lakekeeper = { path = "../../../lakekeeper/crates/lakekeeper", features = [
    "router",
    "test-utils",
] }
lakekeeper-storage-postgres = { path = "../../../lakekeeper/crates/lakekeeper-storage-postgres" }
lakekeeper-io = { path = "../../../lakekeeper/crates/io" }

egret-config = { workspace = true }
egret-metastore = { workspace = true }

anyhow.workspace = true
# axum 0.8 — must be the SAME axum major lakekeeper's router uses, so the
# `Router` types unify. lakekeeper re-exports its axum as `lakekeeper::axum`;
# we depend on it directly here for `axum::Router` in our public signatures.
axum = { version = "0.8" }
http.workspace = true
# uuid with v7: `RequestMetadata::new_lakekeeper_internal` and project ids use
# v7/nil. Feature-unified with lakekeeper's uuid anyway, but declared explicitly.
uuid = { version = "1", features = ["v4", "v7", "serde"] }
url = { workspace = true }
# NB: sqlx 0.9 (NOT egret's workspace 0.8) so the `PgPool` we build is the same
# type lakekeeper's migrator accepts — the two sqlx majors have incompatible
# `Pool<Postgres>` types and won't unify across the crate boundary.
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "migrate",
] }

[dev-dependencies]
tokio.workspace = true
# oneshot harness: drive the mounted router with no socket (mirrors
# egret-catalog/tests/http_roundtrip.rs's pattern). `tower::ServiceExt::oneshot`
# + `http_body_util::BodyExt` to collect response bodies.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serde_json.workspace = true
