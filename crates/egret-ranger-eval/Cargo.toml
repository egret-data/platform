[package]
name = "egret-ranger-eval"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# SP4d Task 3: a typed READER for Ranger policy bodies. `policy_jsonb` is
# stored as the client's original Ranger JSON verbatim; nothing else in the
# repo models it for reading (the only typed shapes are the writer's,
# `egret_policy::admin::ranger_json`, documented lossy for policies egret
# did not author). This crate builds the evaluator SP4d needs on top of that
# reader (resource matching, precedence, mask/row-filter — later tasks).
#
# Deliberately pure: no sqlx, no tokio, no network, no filesystem in library
# code — mirrors the discipline documented at `crates/egret-perm/src/eval.rs`.
# No dependency on `egret-policy`: the writer's lossiness is exactly what
# this crate exists to not repeat, so it models the JSON shape itself rather
# than reusing those types.
[dependencies]
serde.workspace = true
serde_json.workspace = true

[features]
# SP4d-3 Task 7 fix round 1 (review I-5): TEST-ONLY. With it on, every
# unprepared entry point (`evaluate`, `evaluate_data_mask`,
# `evaluate_row_filter`) also runs the prepared path over a freshly prepared
# set and `assert_eq!`s the full result, so the crate's whole existing test
# suite is a differential of the two paths:
#   cargo test -p egret-ranger-eval --features crosscheck-prepared
crosscheck-prepared = []

# SP4d-3 Task 8: `tests/differential.rs` asks the REAL Java engines whether a
# migration the grammar accepts decides identically before and after. The
# after-state must be what egret really compiles, so the test drives the
# grammar (`egret-perm-compile::grammar`) and the compiler (`compile_grant` +
# `access_to_ranger_json`, `compile_rule`) themselves rather than a second
# copy of either. DEV-only, and a dev-dependency cycle on purpose
# (`egret-perm-compile` depends on this crate's library): Cargo permits it, the
# integration test links ONE build of this library, and the library itself
# stays `serde` + `serde_json` only — the discipline above is about `src/`.
[dev-dependencies]
egret-perm.workspace = true
egret-perm-compile.workspace = true
egret-policy.workspace = true
uuid.workspace = true
