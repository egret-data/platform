[package]
name = "egret-query-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Leaf contract crate for the Query seam (E4d). The shared domain vocabulary
# (`Engine`/`ConnOptions`/`Database`) plus a re-export of the core result type
# (`TabularResult`/`ColumnMeta`) — no sqlx, axum, or heavy egret-* deps, so any
# cross-seam consumer (egret-bi) can depend on the vocabulary cheaply instead of
# reaching through `egret_query::registry::model::…`. Mirrors egret-catalog-api
# (E3b) / egret-policy-api (E2a). Depending on egret-core is fine — it's the
# foundation crate; the leaf stays light.
# `utoipa` (E0·P4): the contract crate carries the `ToSchema` derives for the
# seam's wire vocabulary. utoipa is pure (proc-macro + light runtime), so the
# leaf stays axum/sqlx-free.
[dependencies]
egret-core.workspace = true
serde.workspace = true
uuid.workspace = true
utoipa.workspace = true
# `QueryExecPort` is the seam's one async trait (the Data API reaches execution
# through it). A proc-macro + no runtime deps, so the leaf stays light.
async-trait.workspace = true
