[package]
name = "egret-machine-idp"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
thiserror.workspace = true
async-trait.workspace = true
# Logs each verifier error in the non-short-circuiting `token_endpoint` loop
# (P2 Task 4) so a failing verifier is never swallowed silently.
tracing.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
# `aws_lc_rs` is named EXPLICITLY, not inherited. jsonwebtoken 10 selects its
# crypto backend from features and PANICS at the first sign/verify when neither
# `rust_crypto` nor `aws_lc_rs` is on. In the full binary the feature arrives by
# unification from lakekeeper's `limes`, so the server works — but any build that
# does not pull lakekeeper in (this crate's own tests, `-p egret-dataapi`) gets a
# crate that compiles and then panics on every token. Declaring it here makes the
# backend this crate's own choice; it adds nothing to the server's feature set,
# which already resolved to exactly this one.
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
rsa.workspace = true
rand.workspace = true
base64.workspace = true
# `credential_generation`: the `cgen` claim is a SHA-256 digest of the stored
# secret hash.
sha2.workspace = true
egret-metastore.workspace = true
egret-core = { workspace = true, features = ["http"] }
# OpenAPI emit (E0·P4b-1): `#[utoipa::path]` on the IdP router's handlers +
# the `IdpApi` doc struct merged in `openapi()`.
utoipa.workspace = true

[dev-dependencies]
# The `--lib` binary runs `#[sqlx::test]` cases against the real key table, so it
# carries the dotenv-fallback guard.
egret-test-db.workspace = true
