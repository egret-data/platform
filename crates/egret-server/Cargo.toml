[package]
name = "egret-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
egret-core.workspace = true
egret-metastore.workspace = true
egret-auth.workspace = true
egret-config.workspace = true
egret-workspace.workspace = true
egret-controlplane.workspace = true
egret-catalog-engine.workspace = true
egret-engine-mgmt.workspace = true
egret-machine-idp.workspace = true
egret-dataapi.workspace = true
egret-workflow.workspace = true
egret-policy.workspace = true
# SP4a Task 9: the data-permission model's HTTP surface (grants/rules/explain/
# compile). Lives in `egret-perm-compile` because every mutating route
# recompiles in the same transaction as its write.
egret-perm-compile.workspace = true
egret-query.workspace = true
egret-bi.workspace = true
egret-automation.workspace = true
egret-apps.workspace = true
axum.workspace = true
# `serve_with_drain` + `shutdown_signal`: the SIGTERM handler, the `watch`
# channel that starts the drain clock, and the deadline that bounds it. A
# runtime dependency and not a dev one — the graceful shutdown is shipped code.
tokio.workspace = true
tower-http.workspace = true
serde_json.workspace = true
tracing.workspace = true
# OpenAPI aggregator (E0·P4): base doc + `.merge(egret_query::openapi())`,
# served at GET /api-docs/openapi.json. P4b adds one `.merge(...)` per crate.
utoipa.workspace = true
# The recorder + text renderer behind `GET /metrics`. This crate owns the
# route, so it is the only one that names the exporter; every instrumented
# crate depends on the `metrics` facade instead. Already in the tree at this
# version via lakekeeper's `axum-prometheus`, so it adds no build.
metrics-exporter-prometheus.workspace = true

[dev-dependencies]
tower.workspace = true
# A lazy pool with a SHORT `acquire_timeout`. `Db::connect_lazy` uses sqlx's
# 30 s default, so every test whose request reaches a database call — the
# `/readyz` 503 and the serving path's own access-log insert — paid 30 s to fail.
# `Db { pool }` is public, so the options can be chosen here instead.
sqlx.workspace = true
http-body-util = "0.1"
# SP4d Task 10: `generated_client_was_emitted_from_the_committed_spec` recomputes
# the sha256 receipt `npm run gen:api` writes beside the orval client, so the
# committed `openapi.json` cannot drift from the committed frontend client. Both
# are already in the tree at these versions (sha2 via argon2/rsa, hex widely), so
# they add no build.
sha2.workspace = true
hex.workspace = true
# Router-mount reachability test: builds a `WorkspaceState` by hand (lazy DB
# pool, stub Pdp) without a live Postgres.
egret-audit.workspace = true
async-trait.workspace = true
chrono.workspace = true
# `dataapi_serving_mount.rs` builds a `DataApiState` by hand to compose the real
# router: `QueryExecPort` for the fake engine, `uuid` for the token claims.
egret-query-api.workspace = true
uuid.workspace = true
# `metrics_endpoint.rs` drives the composed router and asserts a counter's
# VALUE moved, which needs the facade to increment through.
metrics.workspace = true
# `dataapi_serving_bounds.rs` builds the legal worst case of a two-statement
# endpoint out of `DEFAULT_TIMEOUT_SECONDS` rather than typing `60`, so the
# trial deadline's justification moves if that default ever does.
egret-dataapi-api.workspace = true
# `tag_bump_reaches_polled_tag_service.rs` is DB-gated (real Postgres, egret_bi
# + egret_policy wired together — the only crate that already depends on
# both) and self-skips without `DATABASE_URL` the same way every other
# DB-gated suite in the tree does.
egret-test-db.workspace = true
# S1-2: `apps_pod_mounted.rs` and `apps_api_mounted.rs` build an `AppStore` by
# hand (with a `MemStore` test-only fixture), mirroring `egret-apps`'s own HTTP
# tests. The `test-util` feature enables `egret_storage::MemStore`.
egret-storage = { workspace = true, features = ["test-util"] }
