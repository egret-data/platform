[package]
name = "egret-query"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
egret-core = { workspace = true, features = ["http"] }
egret-query-api.workspace = true
egret-analytics-api.workspace = true
egret-metastore.workspace = true
egret-auth.workspace = true
egret-workspace.workspace = true
egret-secrets.workspace = true
egret-storage.workspace = true
# View governance Task 7: `execution::lineage` implements
# `egret_perm_compile::lineage::ExplainRunner` (already in this graph through
# `egret-workspace`).
egret-perm-compile.workspace = true
# KI-154: the row limit is placed by reading the query (`execution::limit`);
# already in this graph through `egret-perm-compile`.
sqlparser.workspace = true
axum.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
reqwest.workspace = true
mysql_async.workspace = true
tokio.workspace = true
tokio-util.workspace = true
async-trait.workspace = true
hex.workspace = true
# OpenAPI emit (E0·P4): `#[utoipa::path]` on the two routers' handlers +
# `QueryRegistryApi`/`QueryExecutionApi` doc structs merged in `openapi()`.
utoipa.workspace = true

[dev-dependencies]
# One private, already-migrated database per test process, cloned from a
# shared template. Replaces the shared `DATABASE_URL` database, which
# nothing cleaned and every fixture paid for.
egret-test-db.workspace = true
tower.workspace = true
http-body-util = "0.1"
url = { workspace = true }
egret-secrets.workspace = true
egret-auth.workspace = true
egret-events.workspace = true
egret-workspace.workspace = true
async-trait.workspace = true
chrono.workspace = true
rcgen = { workspace = true }
# Already a runtime dependency; named again here so an INTEGRATION test can open
# a raw MySQL-protocol connection. `connector_starrocks.rs` needs one to measure
# what `COM_RESET_CONNECTION` does to an `EXECUTE AS` identity — the fact the
# decision not to pool StarRocks connections rests on.
mysql_async.workspace = true
# `#[tokio::test(start_paused = true)]` — tokio's `full` feature does NOT include
# `test-util`, and without it the attribute silently resolves to a private field
# rather than the pause. `port_impl`'s `a_describe_that_never_answers_is_still_bounded`
# drives a 30-second bound in microseconds with it; the alternative was passing the
# timeout in as an argument, which would have tested a mechanism while leaving the
# value every caller actually uses unasserted.
tokio = { workspace = true, features = ["test-util"] }
# A test-local `Layer` that records the `wait_ms` the Trino connector's retry
# policy asks for. `connector_trino_pool.rs` asserts on those numbers instead of
# on elapsed wall-clock time, which is what three of its assertions used to do —
# and what made them fail on a loaded machine while the policy was correct.
tracing-subscriber.workspace = true
