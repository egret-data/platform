[package]
name = "egret-controlplane"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
egret-core = { workspace = true, features = ["http"] }
egret-audit = { workspace = true }
egret-auth.workspace = true
egret-bi.workspace = true
# SP4c Task 3: a role-membership write must recompile the engine policies that
# enumerate that role's holders, in the same transaction (`role_membership`).
egret-perm.workspace = true
egret-perm-compile.workspace = true
# DG #4a fix D1: the plugin judgement reads whether a profile has a tag service
# through `egret_policy::usable_tag_services_via`, the join the profile list and
# the plugin download use. Already in this crate's graph via egret-perm-compile.
egret-policy.workspace = true
egret-catalog-engine.workspace = true
egret-storage.workspace = true
async-trait.workspace = true
egret-secrets.workspace = true
egret-metastore.workspace = true
base64.workspace = true
sqlx.workspace = true
axum.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
# OpenAPI emit (E0·P4b-3): `#[utoipa::path]` on the control-plane access /
# storage / secrets routers' handlers + per-module `#[derive(utoipa::OpenApi)]`
# doc structs, merged into `egret_controlplane::openapi()`.
utoipa.workspace = true

[dev-dependencies]
# One private, already-migrated database per test process, cloned from a
# shared template. Replaces the shared `DATABASE_URL` database, which
# nothing cleaned and every fixture paid for.
egret-test-db.workspace = true
egret-workspace.workspace = true
egret-events = { workspace = true }
# DG #3: the Overview's tests seed the Ranger service-defs.
tower.workspace = true
http-body-util = "0.1"
