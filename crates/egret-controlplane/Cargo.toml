[package]
name = "egret-controlplane"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
egret-core.workspace = true
egret-engine-mgmt-api.workspace = true
egret-auth.workspace = true
egret-authz.workspace = true
egret-catalog.workspace = true
egret-storage.workspace = true
async-trait.workspace = true
egret-secrets.workspace = true
egret-metastore.workspace = true
bcrypt = "0.15"
base64.workspace = true
reqwest.workspace = true
sqlx.workspace = true
axum = { workspace = true, features = ["ws"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
tracing.workspace = true
# For `SinkExt`/`StreamExt` (`WebSocket::send`/`close`/`recv`, `TerminalSize`
# mpsc sender, and the log-follow byte stream) used by the pod-exec and
# pod-logs-follow WS bridges in `engines.rs`.
futures-util.workspace = true
# Chunk type of `EngineProvisioner::pod_logs_stream` (matches
# `WebSocket::Message::Binary`'s `Bytes` payload one-for-one).
bytes.workspace = true
# Only used for the `EngineProvisioner::exec` return type
# (`kube::api::AttachedProcess`) — the WS bridge in `engines.rs` needs the live
# attach handle. Every other seam on the trait stays kube-free; see the module
# doc on `EngineProvisioner` for why this one type leaks through.
kube.workspace = true

[dev-dependencies]
egret-workspace.workspace = true
tower.workspace = true
http-body-util = "0.1"
# `kube` (a normal dep, for `EngineProvisioner::exec`'s `AttachedProcess`
# return type) pulls in `k8s-openapi` with no Kubernetes-version feature
# enabled — by k8s-openapi's own convention, LIBRARY crates must not set that
# feature on their direct dependency, only a dev-dependency, so the version is
# chosen by whichever final binary links them in. Building/testing this crate
# standalone (`cargo test -p egret-controlplane`) needs one enabled here or
# k8s-openapi's build script panics; egret-bin/egret-orchestrator pick the same
# version for the real binary via workspace feature unification.
k8s-openapi.workspace = true
