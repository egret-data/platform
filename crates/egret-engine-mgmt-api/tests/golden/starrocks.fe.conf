LOG_DIR = ${STARROCKS_HOME}/log
DATE = "$(date +%Y%m%d-%H%M%S)"
JAVA_OPTS="-Dlog4j2.formatMsgNoLookups=true -Xmx8192m -XX:+UseG1GC -Xlog:gc*:${LOG_DIR}/fe.gc.log.$DATE:time"
http_port = 8030
rpc_port = 9020
query_port = 9030
edit_log_port = 9010
mysql_service_nio_enabled = true
sys_log_level = INFO
# config for shared-data mode
run_mode = shared_data
cloud_native_meta_port = 6090
cloud_native_storage_type = S3
aws_s3_endpoint = http://host.docker.internal:9000
aws_s3_path = warehouse/starrocks
aws_s3_access_key = egret
aws_s3_secret_key = egretsecret
aws_s3_use_aws_sdk_default_behavior = false
aws_s3_enable_path_style_access = true
enable_load_volume_from_conf = true
access_control = ranger
