[package]
name = "egret-catalog-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Leaf contract crate for the Catalog seam (E3b). DTOs + the `CatalogPort` trait
# only — no sqlx, axum, or egret-* deps, so any seam (engine-mgmt, controlplane)
# can depend on the interface cheaply. Mirrors egret-policy-api (E2a).
# `utoipa`/ToSchema is intentionally absent until E0·P4 wires OpenAPI emit.
[dependencies]
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
thiserror.workspace = true
uuid.workspace = true
chrono.workspace = true
