[package]
name = "egret-apps"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# `http`: `Error` is the gateway's response type (its `IntoResponse` is the one
# error shape the API returns).
egret-core = { workspace = true, features = ["token", "http"] }
egret-config.workspace = true
# The gateway reaches engines only through the port, never `egret-query` itself.
egret-query-api.workspace = true
egret-audit.workspace = true
# `WorkspaceRepo::disabled_features` — the `apps` feature switch.
egret-workspace.workspace = true
axum.workspace = true
# The ticket endpoint reads the login session cookie to bind the grant to it.
axum-extra.workspace = true
serde.workspace = true
serde_json.workspace = true
# `sql_sha256` in the audit detail: the SQL text itself is never logged.
sha2.workspace = true
hex.workspace = true
egret-metastore.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
# The cookie-session API (src/routes.rs): `SessionService` behind `WsContext`.
egret-auth.workspace = true
utoipa.workspace = true
# The read-only gate (src/readonly.rs). Workspace features only (`visitor`): `derive-dialect`
# reads sqlparser's source from the cargo registry at compile time, which is not hermetic.
sqlparser.workspace = true

[dev-dependencies]
# The gateway and route tests run against the REAL Cedar PDP (`CedarPdp::build`
# needs an `EventBus`), not a mocked decision; `egret-auth` is a normal dependency.
egret-events.workspace = true
tower.workspace = true
async-trait.workspace = true
egret-test-db.workspace = true
tokio.workspace = true
