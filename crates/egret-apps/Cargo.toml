[package]
name = "egret-apps"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
# `http`: `Error` is the gateway's response type (its `IntoResponse` is the one
# error shape the API returns).
egret-core = { workspace = true, features = ["token", "http"] }
egret-config.workspace = true
# The gateway reaches engines only through the port, never `egret-query` itself.
egret-query-api.workspace = true
egret-audit.workspace = true
# `WorkspaceRepo::disabled_features` — the `apps` feature switch.
egret-workspace.workspace = true
axum = { workspace = true, features = ["ws"] }
# The ticket endpoint reads the login session cookie to bind the grant to it.
axum-extra.workspace = true
# The apps proxy (src/proxy): query strings, the pod HTTP/WebSocket client, and the streams between them.
url.workspace = true
time = "0.3"
tracing.workspace = true
http.workspace = true
reqwest = { workspace = true, features = ["stream"] }
tokio.workspace = true
# `killpg` in `subprocess_pod`: the launcher signals the pod's process group with a system call, not the `kill` binary.
libc.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
# `sql_sha256` in the audit detail: the SQL text itself is never logged.
sha2.workspace = true
hex.workspace = true
egret-metastore.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
anyhow.workspace = true
# The cookie-session API (src/routes.rs): `SessionService` behind `WsContext`.
egret-auth.workspace = true
utoipa.workspace = true
# The read-only gate (src/readonly.rs). Workspace features only (`visitor`): `derive-dialect`
# reads sqlparser's source from the cargo registry at compile time, which is not hermetic.
sqlparser.workspace = true
# S1-2: `AppStore` holds the object store a draft's/version's actual file content
# (`.py` source, grid-layout JSON) lives in; Postgres keeps the revision counter
# and audit columns. The caller (`egret-bin`) resolves bucket/prefix from config
# and passes the already-built handle in, same pattern as
# `egret_workflow::storage::FileStore`.
egret-storage.workspace = true

[features]
# `tests/lifecycle_store.rs`'s `MemStore`-backed fixture.
test-util = ["egret-storage/test-util"]

[dev-dependencies]
# The gateway and route tests run against the REAL Cedar PDP (`CedarPdp::build`
# needs an `EventBus`), not a mocked decision; `egret-auth` is a normal dependency.
egret-events.workspace = true
tower.workspace = true
egret-test-db.workspace = true
# Activates `test-util` (and transitively `egret-storage/test-util`) for every
# test target of this crate, the pattern `egret-workflow`'s own Cargo.toml uses.
egret-apps = { path = ".", features = ["test-util"] }
