[package]
name = "egret-provisioner"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
egret-engine-mgmt-api.workspace = true
kube.workspace = true
k8s-openapi.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
reqwest.workspace = true
http.workspace = true
chrono.workspace = true
# For `KubeClient::pod_logs_stream`: `futures_util::Stream`/`StreamExt` bound
# the boxed byte-chunk stream; `bytes::Bytes` is the chunk type; `tokio-util`'s
# `io::ReaderStream` turns kube's `log_stream` (a `futures::AsyncBufRead`,
# bridged to `tokio::io::AsyncRead` via the `compat` feature) into that stream.
futures-util.workspace = true
bytes.workspace = true
tokio-util = { workspace = true, features = ["io", "compat"] }
tar.workspace = true
bollard.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }

# Runs WITHOUT libtest so a run without EGRET_TEST_DOCKER=1 reports its tests
# IGNORED, never passed (same contract as egret-workflow's container_docker_live).
[[test]]
name = "docker_live"
harness = false
