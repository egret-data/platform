[package]
name = "egret-bin"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "egret"
path = "src/main.rs"

[dependencies]
egret-core.workspace = true
egret-config.workspace = true
egret-metastore.workspace = true
egret-server.workspace = true
egret-auth.workspace = true
egret-workspace.workspace = true
egret-catalog.workspace = true
# Composition root for the embedded lakekeeper catalog engine (CE-2 T5): builds
# the engine `ApiContext` (migrate + bootstrap + `build_state`), the front-auth
# router (`mount_catalog_engine`), and the concrete `WarehouseProvisioner` impl.
# Only `egret-bin` (and the engine's own tests) depend on this crate, keeping the
# lakekeeper graph + its second `sqlx` major out of `egret-server`/`egret-workspace`.
egret-catalog-engine.workspace = true
egret-storage.workspace = true
egret-authz.workspace = true
egret-ranger.workspace = true
egret-secrets.workspace = true
egret-database.workspace = true
egret-engine.workspace = true
egret-bi.workspace = true
egret-notebook.workspace = true
tokio.workspace = true
axum.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
sqlx.workspace = true
base64.workspace = true
uuid.workspace = true
axum-extra = { version = "0.10", features = ["cookie", "cookie-private"] }
