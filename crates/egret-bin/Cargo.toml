[package]
name = "egret-bin"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "egret_bin"
path = "src/lib.rs"

[[bin]]
name = "egret"
path = "src/main.rs"

[dependencies]
egret-core.workspace = true
egret-config.workspace = true
egret-metastore.workspace = true
egret-server.workspace = true
egret-auth.workspace = true
egret-workspace.workspace = true
egret-catalog.workspace = true
egret-catalog-engine.workspace = true
egret-controlplane.workspace = true
egret-machine-idp.workspace = true
# Composition root for the embedded lakekeeper catalog engine (CE-2 T5): builds
egret-storage.workspace = true
egret-authz.workspace = true
egret-ranger.workspace = true
egret-secrets.workspace = true
egret-database.workspace = true
egret-engine.workspace = true
egret-bi.workspace = true
egret-notebook.workspace = true
egret-kernel.workspace = true
egret-orchestrator.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# Pin a rustls crypto provider so kube-rs's TLS client has one to use (the tree
# enables both ring + aws-lc-rs, which otherwise panics rustls at runtime).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
axum.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
sqlx.workspace = true
base64.workspace = true
uuid.workspace = true
reqwest.workspace = true
serde.workspace = true
axum-extra = { version = "0.10", features = ["cookie", "cookie-private"] }
