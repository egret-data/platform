[package]
name = "egret-bin"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "egret_bin"
path = "src/lib.rs"

[[bin]]
name = "egret"
path = "src/main.rs"

[dependencies]
egret-core.workspace = true
egret-config.workspace = true
egret-metastore.workspace = true
egret-server.workspace = true
egret-auth.workspace = true
egret-audit = { workspace = true }
egret-apps.workspace = true
egret-events = { workspace = true }
egret-workspace.workspace = true
egret-catalog-engine.workspace = true
egret-catalog-registry.workspace = true
egret-engine-mgmt.workspace = true
egret-engine-mgmt-api.workspace = true
egret-controlplane.workspace = true
egret-machine-idp.workspace = true
egret-dataapi.workspace = true
egret-workflow.workspace = true
# Composition root for the embedded lakekeeper catalog engine (CE-2 T5): builds
egret-storage.workspace = true
egret-policy.workspace = true
egret-perm.workspace = true
egret-perm-compile.workspace = true
egret-secrets.workspace = true
egret-query.workspace = true
egret-bi.workspace = true
egret-automation.workspace = true
egret-notebook.workspace = true
egret-provisioner.workspace = true
# `EgretEngineProvisioner::exec` names `kube::api::AttachedProcess` explicitly
# to satisfy the `egret_controlplane::EngineProvisioner` trait signature.
kube.workspace = true
k8s-openapi.workspace = true
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
# `EgretEngineProvisioner::pod_logs_stream` names the boxed byte-chunk stream
# type explicitly to satisfy the `egret_controlplane::EngineProvisioner`
# trait signature (same shape as `egret_provisioner::KubeClient`'s).
futures-util.workspace = true
bytes.workspace = true
# Pin a rustls crypto provider so kube-rs's TLS client has one to use (the tree
# enables both ring + aws-lc-rs, which otherwise panics rustls at runtime).
rustls = { version = "0.23", default-features = false, features = ["ring"] }
axum.workspace = true
clap.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
sqlx.workspace = true
base64.workspace = true
uuid.workspace = true
url.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
# Not in [workspace.dependencies]; only kernel_launcher_k8s (pod-name hashing) needs it.
sha1 = "0.10"
axum-extra = { workspace = true }

[dev-dependencies]
# One private, already-migrated database per test process, cloned from a
# shared template. Replaces the shared `DATABASE_URL` database, which
# nothing cleaned and every fixture paid for.
egret-test-db.workspace = true
# Drives the real IdP router in `tests/idp_issuer.rs` (`oneshot`), so the
# discovery document and the minted token come from the same wiring the binary
# builds rather than from a hand-made copy of it.
tower.workspace = true
