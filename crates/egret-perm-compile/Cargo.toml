[package]
name = "egret-perm-compile"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# SP4a Task 6 fix round 1 (Important 3): split out of `egret-perm` so that
# crate's model/store half — the half `egret-engine-mgmt` actually needs
# (`sync_assignment_grants`, which touches only `perm.*` tables) — carries no
# `egret-policy` dependency. Before the split, `egret-perm` depended on
# `egret-policy` directly for this compiler alone, so any production
# consumer of the model/store half pulled `egret-policy`'s internals into
# its production graph too — the exact thing `egret-policy-api::PolicyPort`
# exists to prevent elsewhere (`egret-policy` is a dev-only dependency of
# `egret-engine-mgmt`). Nothing outside this crate's own tests depends on it
# yet; a later task's compile-profile driver is its first real consumer.
#
# SP4a Task 7: that consumer has landed (`trigger::recompile_service`), so
# `uuid` (grant/rule ids) and `sqlx` (one transaction spanning `perm.compiled`
# and `policy.authz_policies`/`policy.authz_services` — see
# `egret_perm::store::PermStore::pool`'s doc comment) move from dev- to
# regular dependencies.
[dependencies]
egret-perm.workspace = true
# View governance Task 7: `lineage::ExplainRunner` is implemented by a runner in
# `egret-query` and faked in tests, and is held as `dyn` by the commit hold.
async-trait.workspace = true
egret-policy.workspace = true
serde_json.workspace = true
uuid.workspace = true
# SP4d-3 Task 7 fix round 1 (I-2): content hashes of what a migration
# created, so undo can refuse when any of it changed since.
sha2.workspace = true
hex.workspace = true
sqlx.workspace = true
# SP4a Task 7 fix round 1: a skipped grant/rule (WorkspaceMembers, not yet
# expanded) must not vanish silently — the only production caller
# (`egret-bi::catalog_tags`) never inspected `CompileSummary::skipped`, so
# the recompile driver itself logs every skip.
tracing.workspace = true
# SP4a Task 9: the `perm` HTTP surface (`routes`) lives here and not in
# `egret-perm`, because every mutating route recompiles in the SAME
# transaction as its write — and `egret-perm` depending on this crate would
# be a dependency cycle. Same shape `egret-policy` already has (store plus
# admin router in one crate).
axum.workspace = true
egret-auth.workspace = true
egret-core.workspace = true
# J-F3 Task 1b: `group_membership::PermGroupRecompiler` answers through
# `egret_auth`'s port, whose error is `egret_core::Error`, and its `Internal`
# arm carries an `anyhow::Error`.
anyhow.workspace = true
serde.workspace = true
thiserror.workspace = true
utoipa.workspace = true
# SP4d-2a Task 4: hand-written wire DTOs mirroring `egret-ranger-eval`'s
# `Decision`/`DenyReason`/`UndecidableCause` and mask/row-filter results,
# because that crate stays `serde`+`serde_json`-only by discipline (see its
# own `Cargo.toml` and module doc) and does not carry `utoipa` itself.
egret-ranger-eval.workspace = true
# SP4d-2a Task 5: `explain` now evaluates the policy download each engine
# receives, and it assembles that envelope with the SAME `ServicePolicies`
# type `egret-policy`'s `/service/plugins/policies/download/{service}` handler
# serialises — not a second hand-written copy of the shape. Two copies would
# be free to drift, and the whole point of this route is that "what explain
# evaluated" and "what the engine received" cannot.
egret-policy-api.workspace = true
# People & groups Task 3: a membership's `expiresAt` on the principal reads.
chrono.workspace = true

[features]
# View governance Task 3: `harness_support`, the doc-hidden wrappers the
# differential and the timing harness use to build the compiler's own bodies.
# Off in every production build; enabled only by `egret-ranger-eval`'s
# dev-dependency and by `tests/gate_timing.rs` (`required-features`).
harness = []

[[test]]
name = "gate_timing"
required-features = ["harness"]

[dev-dependencies]
egret-metastore.workspace = true
egret-test-db.workspace = true
tokio.workspace = true
# `tests/routes.rs` drives the composed router with `oneshot` and a real
# session cookie, and builds a real `CedarPdp` for the 403 assertions.
tower.workspace = true
async-trait.workspace = true
http-body-util = "0.1"
egret-events.workspace = true
egret-secrets.workspace = true
chrono.workspace = true
serde_json.workspace = true
# SP4d-2a Task 5 review (I3): `tests/wire_dtos.rs` asserts that
# `WireEngineType` and `egret_query_api::Engine` serialise StarRocks to the
# SAME string, so the two published spellings on one API surface cannot drift
# apart independently. A leaf contract crate (no sqlx/axum), and dev-only —
# nothing in `src/` depends on it.
egret-query-api.workspace = true
