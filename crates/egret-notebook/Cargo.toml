[package]
name = "egret-notebook"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
egret-core = { workspace = true, features = ["http"] }
egret-analytics-api.workspace = true
egret-catalog-engine.workspace = true
egret-machine-idp.workspace = true
egret-metastore.workspace = true
egret-auth.workspace = true
egret-workspace.workspace = true
async-trait.workspace = true
axum.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
utoipa.workspace = true

[dev-dependencies]
# One private, already-migrated database per test process, cloned from a
# shared template. Replaces the shared `DATABASE_URL` database, which
# nothing cleaned and every fixture paid for.
egret-test-db.workspace = true
tokio.workspace = true
tower.workspace = true
http-body-util = "0.1"
egret-auth.workspace = true
egret-workspace.workspace = true
egret-events.workspace = true
egret-catalog-engine.workspace = true
# `tests/feature_gate.rs` mounts the real `ws_member_router` next to the
# notebook router so the gate is proven against an ungated production surface;
# building its `WorkspaceState` needs the audit sink.
egret-audit.workspace = true
