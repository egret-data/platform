[package]
name = "egret-dataapi-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Leaf contract crate for the Data API seam (P2). Mirrors egret-query-api /
# egret-catalog-api / egret-policy-api: no sqlx, axum, or heavy egret-* deps, so
# any cross-seam consumer can depend on the Data API's wire vocabulary cheaply.
# Empty for now — Task 4 only stands the crate up; the management-route DTOs
# (client/service-account request+response shapes) land in Task 5.
[dependencies]
egret-core.workspace = true
serde.workspace = true
uuid.workspace = true
utoipa.workspace = true
# Fix-round-2 (Task 5): the DataApiEndpointPort trait -- mirrors
# egret-analytics-api's NotebookDocsPort seam.
async-trait.workspace = true
# M2 Task 2: StatementError's Display impl, matching egret-dataapi's
# ValidationError and egret-catalog-api's CatalogApiError.
thiserror.workspace = true
# C1 Task 1: not used in this crate yet -- egret-dataapi's lifecycle.rs
# (Task 2) needs `regex` to enforce ParamSpec::pattern, and this crate is
# where `regex` needs to become a workspace dependency.
regex.workspace = true

[dev-dependencies]
# Unit-test only: proves `OutputSpec::default()` cannot diverge from
# `serde_json::from_str("{}")`. Does not touch the leaf's normal dependency
# graph — no downstream consumer pulls this in.
serde_json.workspace = true
