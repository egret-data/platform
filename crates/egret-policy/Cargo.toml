[package]
name = "egret-policy"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The Policy/Ranger seam (E2b): policy storage + versioning (AuthzStore) AND the
# Ranger Admin REST serving surface (ranger module), merged from the former
# standalone egret-ranger crate. Implements PolicyPort (egret-policy-api).
[dependencies]
egret-core = { workspace = true, features = ["http"] }
egret-metastore.workspace = true
egret-policy-api.workspace = true
# The admin Policies router (E2d) needs the Auth extractor + identity repos
# (principal picker) from the core hub; gates run through
# `egret_core::authz::require` against the injected PDP (B1b-2).
egret-auth.workspace = true
async-trait.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
thiserror.workspace = true
tracing.workspace = true
axum.workspace = true
# OpenAPI emit (E0·P4b-5): `#[utoipa::path]` on the policy-admin + ranger routers'
# handlers + per-router `#[derive(utoipa::OpenApi)]` doc structs, merged into
# `egret_policy::openapi()`.
utoipa.workspace = true

[dev-dependencies]
# One private, already-migrated database per test process, cloned from a
# shared template. Replaces the shared `DATABASE_URL` database, which
# nothing cleaned and every fixture paid for.
egret-test-db.workspace = true
tokio.workspace = true
tower.workspace = true
http-body-util = "0.1"
# Real CedarPdp in authz-asserting HTTP tests (B1b-2).
egret-events.workspace = true
