[package]
name = "egret-egress"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The one guard for requests to user-chosen URLs (alert webhooks in
# egret-automation, the `http.*` workflow tasks in egret-workflow). A leaf on
# purpose: it depends on no egret crate, so any crate may use it without a
# port-rule question, and egret-core does not grow an HTTP client for the many
# crates that never send one.
[dependencies]
url.workspace = true
reqwest.workspace = true
bytes.workspace = true
tokio = { workspace = true }
async-trait.workspace = true
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true }
axum.workspace = true
