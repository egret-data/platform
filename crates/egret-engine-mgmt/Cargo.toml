[package]
name = "egret-engine-mgmt"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
egret-metastore.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
serde_json.workspace = true
thiserror.workspace = true
egret-engine-mgmt-api.workspace = true
egret-auth.workspace = true
# Catalog seam contract (E3b). Engine-create auto-wires a Catalog Client through
# `CatalogPort`; the concrete `egret-catalog-engine` store impl is wired in egret-bin and only
# needed here as a dev-dep for test state construction.
egret-catalog-api.workspace = true
egret-catalog-registry.workspace = true
# `perm` seam (SP4a Task 6). Assigning a catalog to a workspace must sync the
# implicit `read` grant in the SAME transaction as the assignment write, so
# this crate calls `egret_perm::sync_assignment_grants_in_tx` directly rather
# than going through a port — there is no PermPort seam yet.
egret-perm.workspace = true
egret-storage.workspace = true
egret-secrets.workspace = true
# Policy/Ranger seam contract (E2a). Engine-create auto-binds an engine to a
# Ranger profile through `PolicyPort`; the concrete `egret-policy` impl is wired
# in egret-bin and only needed here as a dev-dep for test state construction.
egret-policy-api.workspace = true
egret-core = { workspace = true, features = ["http"] }
egret-provisioner.workspace = true
# Query seam (P1: assign-engine-to-workspace). `EngineAssignmentService`
# materializes/removes a read-only delegated workspace connection through
# `egret_query::DatabaseRepo`. Cycle-checked: egret-query does NOT depend on
# egret-engine-mgmt, so this edge is acyclic.
egret-query.workspace = true
# Dialect-aware SQL literal escaping (`quote_string`). The StarRocks
# `CREATE USER` DDL below builds single-quoted literals that run as `root` on
# the FE, so it shares the one workspace implementation of the escaping rule
# rather than carrying a fourth private copy of it. Pure leaf crate (egret-core,
# serde, uuid, utoipa) — no cycle, no runtime weight.
egret-query-api.workspace = true
# OpenAPI emit (E0·P4b-9): `#[utoipa::path]` on the engines + monitor handlers +
# co-located `#[derive(utoipa::OpenApi)]` doc structs merged into the top-level
# API doc via `egret_engine_mgmt::openapi()`.
utoipa.workspace = true
axum = { workspace = true, features = ["ws"] }
async-trait.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio.workspace = true
serde.workspace = true
base64.workspace = true
regex.workspace = true
rand.workspace = true
reqwest.workspace = true
# 0.15 -> 0.19, taken even though it costs three duplicate crates: its blowfish
# 0.10 wants cipher 0.5 / inout 0.2 while the aes-gcm 0.10 line stays on cipher
# 0.4. Everywhere else in this upgrade dedup won, but this is the password-hashing
# crate and egret-engine-mgmt is its only consumer — four majors of drift is the
# worse risk. Revisit if aes-gcm ever moves and the split closes on its own.
bcrypt = "0.19"
tracing.workspace = true
kube.workspace = true
rcgen.workspace = true
# StarRocks Iceberg external-catalog auto-wire (T6): a one-shot `CREATE EXTERNAL
# CATALOG` DDL run against the provisioned FE over the raw MySQL protocol, once
# it's Ready. The vendored/patched `mysql_async` (see the workspace `[patch.crates-io]`)
# is the same library `egret-query`'s `StarRocksConnector` wraps; used directly
# here (root, no password, one statement) rather than through the interactive
# `Connector`/`Limits`/`CancellationToken` machinery, which is shaped for
# user-facing query execution, not a fire-and-forget admin DDL.
mysql_async.workspace = true

# Parses `[catalog] public_url` to judge its host (external plugin config), and
# EGRET_TEST_STARROCKS_URL in the engine-gated DDL-runner live suite.
url.workspace = true

[dev-dependencies]
# One private, already-migrated database per test process, cloned from a
# shared template. Replaces the shared `DATABASE_URL` database, which
# nothing cleaned and every fixture paid for.
egret-test-db.workspace = true
# Concrete Policy/Ranger store — only test state construction builds it directly
# (production wires it in egret-bin behind `PolicyPort`).
egret-policy.workspace = true
# SP4a Task 15: `RealProfileCompiler` (tests/routes.rs) actually recompiles
# against the fixture DB, the same construction egret-bin's `ProfileCompilerImpl`
# wires in production behind `ProfileCompilerPort` — dev-only, for the same
# reason `egret-policy` above is.
egret-perm-compile.workspace = true
# Concrete Catalog store — only test state construction builds it directly
# (production wires it in egret-bin behind `CatalogPort`). The store now lives in
# egret-catalog-engine (E3d-1); this dev-dep pulls the embedded lakekeeper engine
# into the TEST build only (prod engine-mgmt stays on `CatalogPort`).
egret-catalog-engine.workspace = true
# Real `CedarPdp` construction in the authz route test (seams migrated onto
# `egret_core::authz::require`): the PDP is built over the roles catalog and
# needs an `EventBus` handle.
egret-events.workspace = true
tower.workspace = true
http-body-util = "0.1"
# `kube` (a normal dep, for `EngineProvisioningPort`'s WS-bridge use of
# `kube::api::AttachedProcess`/`TerminalSize`) pulls in `k8s-openapi` with no
# Kubernetes-version feature enabled — by k8s-openapi's own convention,
# LIBRARY crates must not set that feature on their direct dependency, only a
# dev-dependency, so the version is chosen by whichever final binary links
# them in. Building/testing this crate standalone (`cargo test -p
# egret-engine-mgmt`) needs one enabled here or k8s-openapi's build script
# panics; egret-bin/egret-provisioner pick the same version for the real
# binary via workspace feature unification.
k8s-openapi.workspace = true
# Parse the generated self-signed cert back to verify SANs in tls_cert's test.
# 3, not 4: jsonwebtoken, kube-client, rcgen and the vendored mysql_async all
# depend on pem 3, so 4 only adds a second copy.
pem = "3"
x509-parser = "0.18"
# Reads back the log line the database-error backstop writes (tests/error_mapping.rs).
tracing-subscriber.workspace = true
