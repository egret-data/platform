[package]
name = "egret-engine-mgmt"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
egret-metastore.workspace = true
sqlx.workspace = true
uuid.workspace = true
chrono.workspace = true
serde_json.workspace = true
thiserror.workspace = true
egret-engine-mgmt-api.workspace = true
egret-auth.workspace = true
# Catalog seam contract (E3b). Engine-create auto-wires a Catalog Client through
# `CatalogPort`; the concrete `egret-catalog-engine` store impl is wired in egret-bin and only
# needed here as a dev-dep for test state construction.
egret-catalog-api.workspace = true
egret-storage.workspace = true
egret-secrets.workspace = true
# Policy/Ranger seam contract (E2a). Engine-create auto-binds an engine to a
# Ranger profile through `PolicyPort`; the concrete `egret-policy` impl is wired
# in egret-bin and only needed here as a dev-dep for test state construction.
egret-policy-api.workspace = true
egret-core.workspace = true
egret-orchestrator.workspace = true
axum = { workspace = true, features = ["ws"] }
async-trait.workspace = true
bytes.workspace = true
futures-util.workspace = true
tokio.workspace = true
serde.workspace = true
base64.workspace = true
reqwest.workspace = true
bcrypt = "0.15"
tracing.workspace = true
kube.workspace = true

[dev-dependencies]
# Concrete Policy/Ranger store — only test state construction builds it directly
# (production wires it in egret-bin behind `PolicyPort`).
egret-policy.workspace = true
# Concrete Catalog store — only test state construction builds it directly
# (production wires it in egret-bin behind `CatalogPort`). The store now lives in
# egret-catalog-engine (E3d-1); this dev-dep pulls the embedded lakekeeper engine
# into the TEST build only (prod engine-mgmt stays on `CatalogPort`).
egret-catalog-engine.workspace = true
tower.workspace = true
http-body-util = "0.1"
# `kube` (a normal dep, for `EngineProvisioningPort`'s WS-bridge use of
# `kube::api::AttachedProcess`/`TerminalSize`) pulls in `k8s-openapi` with no
# Kubernetes-version feature enabled — by k8s-openapi's own convention,
# LIBRARY crates must not set that feature on their direct dependency, only a
# dev-dependency, so the version is chosen by whichever final binary links
# them in. Building/testing this crate standalone (`cargo test -p
# egret-engine-mgmt`) needs one enabled here or k8s-openapi's build script
# panics; egret-bin/egret-orchestrator pick the same version for the real
# binary via workspace feature unification.
k8s-openapi.workspace = true
