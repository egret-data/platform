[package]
name = "egret-auth"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
egret-core = { workspace = true, features = ["http", "token"] }
egret-metastore.workspace = true
egret-config.workspace = true
egret-secrets.workspace = true
egret-events = { workspace = true }
egret-audit = { workspace = true }
axum.workspace = true
axum-extra = { workspace = true }
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
argon2.workspace = true
rand.workspace = true
sha2.workspace = true
base64.workspace = true
hex.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tracing.workspace = true
openidconnect.workspace = true
# `aws_lc_rs` named explicitly, for the same reason as `egret-machine-idp`:
# jsonwebtoken 10 selects its crypto backend from features and installs a
# provider whose every sign/verify is a `panic!` when neither `rust_crypto` nor
# `aws_lc_rs` is on. This crate verifies OIDC id-tokens and back-channel logout
# tokens (`oidc.rs`), so that panic is on a live auth path — it did not fire only
# because a sibling crate unified the feature in. Note `from_crate_features`
# gates on `all(feature = "X", not(feature = "Y"))` in BOTH directions, so
# enabling `rust_crypto` anywhere in the tree would turn both on, match neither
# arm, and install the panicking provider in the full binary. One backend, named
# by every crate that needs one.
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }
reqwest.workspace = true
time = "0.3"
# OpenAPI emit (E0·P4b-1): `#[utoipa::path]` on the auth + oidc routers'
# handlers + the `AuthApi`/`OidcApi` doc structs merged in `openapi()`.
utoipa.workspace = true
cedar-policy.workspace = true
arc-swap = { workspace = true }
# Runtime for the PDP hot-reload task (`tokio::spawn`) and the `RolesChanged`
# broadcast receiver it awaits.
tokio.workspace = true

[dev-dependencies]
# One private, already-migrated database per test process, cloned from a
# shared template. Replaces the shared `DATABASE_URL` database, which
# nothing cleaned and every fixture paid for.
egret-test-db.workspace = true
tower.workspace = true
http-body-util = "0.1"
testcontainers.workspace = true
reqwest.workspace = true
# Reuses `generate_rsa_key`/`KeyMaterial` to mint a real RSA signing key for the
# `verify_logout_token` tests (sign with the private key, verify against the JWKS).
egret-machine-idp.workspace = true
# Reads the startup provenance pass's `warn!` lines back (`tests/provenance_log_escapes.rs`).
tracing-subscriber.workspace = true
