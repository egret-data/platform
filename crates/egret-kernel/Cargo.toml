[package]
name = "egret-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
test-util = []

[dependencies]
egret-core = { workspace = true, features = ["http", "token"] }
egret-metastore.workspace = true
egret-auth.workspace = true
egret-workspace.workspace = true
egret-analytics-api.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["ws"] }
tokio-tungstenite.workspace = true
futures-util.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v7"] }
chrono.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
reqwest.workspace = true
tokio.workspace = true
tokio-util.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
utoipa.workspace = true

[dev-dependencies]
# `assert_database_url_is_exported` — this crate's tests are `#[sqlx::test]`,
# which reads DATABASE_URL through dotenvy and would otherwise fall back to
# the dev database without saying so.
egret-test-db.workspace = true
tower.workspace = true
http-body-util = "0.1"
async-trait.workspace = true
futures-channel.workspace = true
# egret-notebook is a DEV-only dep: the http integration test builds the real
# `NotebookDocsPort` impl over a concrete `NotebookState`. Production kernel code
# depends only on the `egret-analytics-api` Port (E5c-1).
egret-notebook.workspace = true
egret-catalog-engine.workspace = true
egret-machine-idp.workspace = true
egret-kernel = { path = ".", features = ["test-util"] }
egret-events.workspace = true
