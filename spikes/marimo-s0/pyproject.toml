[project]
name = "marimo-s0"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "marimo==0.25.0",
  "starlette==0.46.2",
  "uvicorn==0.34.2",
  "httpx==0.28.1",
  "websockets==15.0.1",
  "polars==1.30.0",
  "anywidget==0.9.18",
  "pytest==8.4.0",
  "pytest-asyncio==1.0.0",
  "playwright==1.52.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
