{{- if eq .Values.kernel.launcher "kubernetes" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: egret-kernel-manager, namespace: {{ .Values.kernel.namespace }} }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get","list","watch","create","delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: egret-kernel-manager, namespace: {{ .Values.kernel.namespace }} }
subjects:
  - kind: ServiceAccount
    name: egret
    namespace: {{ .Release.Namespace }}
roleRef: { kind: Role, name: egret-kernel-manager, apiGroup: rbac.authorization.k8s.io }
{{- end }}
