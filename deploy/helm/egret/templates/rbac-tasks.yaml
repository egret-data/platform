{{- /*
W5a: exactly what the Kubernetes task runner calls, and nothing more, in the
task namespace only (W5a spec §5, RBAC):

  pods       get/list/watch/create/delete  -- look up by name (re-attach),
                                              create, list for the orphan
                                              sweep, delete after the outcome
                                              commits or on cancel
  pods/log   get                           -- follow main's and files-out's log
  pods/exec  get/create                    -- move input/output files by
                                              exec + tar, and the markers.
                                              `get` because kube-rs execs over
                                              a WebSocket, an HTTP GET, which
                                              Kubernetes >= 1.30 authorises as
                                              `get` (measured on kind 1.33 in
                                              W5a Task 6's e2e: `create` alone
                                              is a 403 on every exec)

`pods/exec` lets egret exec into task pods; the namespace holds nothing else
(spec §11). Bound to egret's own ServiceAccount.
*/ -}}
{{- if eq .Values.workflow.containerRunner "kubernetes" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: egret-task-runner, namespace: {{ .Values.workflow.tasks.namespace }} }
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get","list","watch","create","delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get","create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: egret-task-runner, namespace: {{ .Values.workflow.tasks.namespace }} }
subjects:
  - kind: ServiceAccount
    name: egret
    namespace: {{ .Release.Namespace }}
roleRef: { kind: Role, name: egret-task-runner, apiGroup: rbac.authorization.k8s.io }
{{- end }}
