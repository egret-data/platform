apiVersion: v1
kind: ConfigMap
metadata: { name: egret-env, namespace: {{ .Release.Namespace }} }
data:
  EGRET_DATABASE__URL: "postgres://{{ .Values.deps.postgres.user }}:{{ .Values.deps.postgres.password }}@postgres:5432/{{ .Values.deps.postgres.db }}"
  EGRET_STORAGE__ENDPOINT: "http://minio:9000"
  EGRET_STORAGE__BUCKET: "{{ .Values.deps.minio.bucket }}"
  EGRET_STORAGE__REGION: "{{ .Values.storage.region }}"
  EGRET_STORAGE__PATH_STYLE: "{{ .Values.storage.pathStyle }}"
  EGRET_CATALOG__ENABLED: "true"
  EGRET_CATALOG__WAREHOUSE: "s3://{{ .Values.deps.minio.bucket }}"
  EGRET_CATALOG__PUBLIC_URL: "http://egret.{{ .Release.Namespace }}.svc.cluster.local:8080"
  EGRET_OIDC__ENABLED: "{{ .Values.oidc.enabled }}"
  EGRET_OIDC__ISSUER_URL: "{{ include "egret.externalUrl" . }}/auth/realms/{{ .Values.oidc.realm }}"
  EGRET_OIDC__CLIENT_ID: "{{ .Values.oidc.clientId }}"
  EGRET_OIDC__REDIRECT_URL: "{{ include "egret.externalUrl" . }}/api/auth/oidc/callback"
  EGRET_RANGER__ENABLED: "{{ .Values.ranger.enabled }}"
  EGRET_RANGER__AUTH_TOKEN: ""
  EGRET_ADMIN_EMAIL: "{{ .Values.admin.email }}"
  EGRET_LOG__FILTER: "info,egret=debug"
  EGRET_AUTOMATION__RENDERER_URL: "http://{{ include "egret.fullname" . }}-renderer:8080"
  EGRET_AUTOMATION__PUBLIC_URL: "http://{{ include "egret.fullname" . }}-frontend"
  # What a PERSON opens from a notification. Distinct from PUBLIC_URL above,
  # which is the in-cluster address the renderer resolves — a mail linking
  # there is a dead end in the recipient's inbox.
  EGRET_AUTOMATION__BROWSER_URL: "{{ include "egret.externalUrl" . }}"
{{- if .Values.ingress.enabled }}
  # What an OUTSIDE CONSUMER of the Data API calls: the base for servers[0].url
  # and tokenUrl in a generated OpenAPI document. Deliberately NOT
  # EGRET_CATALOG__PUBLIC_URL above — that one is the in-cluster Service DNS the
  # ENGINE pods resolve, and it is also the machine-IdP `iss`, byte-compared by
  # StarRocks. Only set when there is an edge to reach; otherwise the backend
  # falls back to the issuer and behaviour is unchanged.
  EGRET_DATA_API__PUBLIC_URL: "{{ include "egret.externalUrl" . }}"
{{- end }}
