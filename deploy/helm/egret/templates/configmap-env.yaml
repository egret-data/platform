apiVersion: v1
kind: ConfigMap
metadata: { name: egret-env, namespace: {{ .Release.Namespace }} }
data:
  EGRET_DATABASE__URL: "postgres://{{ .Values.deps.postgres.user }}:{{ .Values.deps.postgres.password }}@postgres:5432/{{ .Values.deps.postgres.db }}"
  EGRET_STORAGE__ENDPOINT: "http://rustfs:9000"
  EGRET_STORAGE__BUCKET: "{{ .Values.deps.rustfs.bucket }}"
  EGRET_STORAGE__REGION: "{{ .Values.storage.region }}"
  EGRET_STORAGE__PATH_STYLE: "{{ .Values.storage.pathStyle }}"
  EGRET_CATALOG__ENABLED: "true"
  EGRET_CATALOG__WAREHOUSE: "s3://{{ .Values.deps.rustfs.bucket }}"
  EGRET_CATALOG__PUBLIC_URL: "http://egret.{{ .Release.Namespace }}.svc.cluster.local:8080"
  EGRET_OIDC__ENABLED: "{{ .Values.oidc.enabled }}"
  EGRET_OIDC__ISSUER_URL: "{{ include "egret.externalUrl" . }}/auth/realms/{{ .Values.oidc.realm }}"
  EGRET_OIDC__CLIENT_ID: "{{ .Values.oidc.clientId }}"
  EGRET_OIDC__REDIRECT_URL: "{{ include "egret.externalUrl" . }}/api/auth/oidc/callback"
  EGRET_RANGER__ENABLED: "{{ .Values.ranger.enabled }}"
  # **The anonymous webhook surface, OFF by default.**
  #
  # `POST /workflows/v1/{ws}/executions/webhook/{ns}/{flow}/{key}` is
  # unauthenticated by construction: the key in the URL is the whole credential.
  # Its security review's verdict is NOT APPROVED FOR EXPOSURE, and this is the
  # lever that verdict needs — with it false the routes are not mounted at all.
  #
  # ⚠️ Turning it on publishes an endpoint that starts executions to anyone who
  # learns a key. The in-process bounds (a 256 KiB body cap, a 16-permit
  # bulkhead, 60 attempts per minute per target) bound the blast radius; they do
  # not make it safe to expose to the open internet, and they are PER REPLICA.
  # Read `egret_workflow::webhook_routes`' module doc before setting this.
  #
  # It gates only that group: flow authoring under /api/ws/… is unaffected.
  EGRET_WORKFLOW__WEBHOOKS_ENABLED: "{{ .Values.workflow.webhooksEnabled }}"
  # W10 Task 2 — THE SWITCH THAT MAKES THE WORKFLOW ENGINE RUN. Off by default.
  #
  # With it off, a webhook or an API call creates an execution row and nothing
  # ever advances it: that is exactly how every release before W10 behaved, which
  # is what makes `false` the safe value rather than merely the cautious one. On,
  # it starts two per-replica tickers — the claim loop and the lease reaper (the
  # third, the schedule-trigger loop, has its own switch below). No
  # leader election is needed, but NOT for one reason repeated: see
  # `egret_workflow::runtime`'s module doc, which gives a separate safety
  # statement for each of the four statements those loops issue.
  #
  # The tuning knobs beside it — EGRET_WORKFLOW__TICK_INTERVAL_SECS (1),
  # EGRET_WORKFLOW__BATCH (8), EGRET_WORKFLOW__REAPER_INTERVAL_SECS (60) and
  # EGRET_WORKFLOW__WORKING_TIMEOUT_S (3600) — are deliberately NOT chart values:
  # they reach the same config through the same EGRET_<SECTION>__<KEY> convention
  # when a deployment actually needs them, and a chart key nobody has a reason to
  # set is surface with no reader.
  EGRET_WORKFLOW__WORKER_ENABLED: "{{ .Values.workflow.workerEnabled }}"
  # W12 — THE SWITCH THAT MAKES `cron:` SCHEDULE TRIGGERS FIRE. Off by default.
  #
  # With it off, flows' Schedule triggers are still recorded on every save and
  # nothing fires them. On, it starts a third per-replica ticker that creates an
  # execution for each due cron tick. No leader election: see
  # `egret_workflow::scheduler`'s module doc for the safety statement per SQL
  # statement a pass issues.
  #
  # It is independent of workerEnabled, and it ALSO NEEDS THE WORKER ON to be
  # useful: with the scheduler on and the worker off, executions are created and
  # nothing runs them (the server logs a warning at start).
  #
  # Its tuning knob, EGRET_WORKFLOW__TRIGGER_INTERVAL_SECS (1), is deliberately
  # NOT a chart value, for the reason given above for the worker's.
  #
  # The same ticker also processes Flow triggers (W13a: a flow that starts
  # because another execution reached a state), at least one hop per tick. With the
  # scheduler OFF, the flow-trigger outbox (workflow.flow_trigger_events) still
  # GROWS: every execution transition that some flow's Flow trigger listens to
  # writes one row, whatever this switch says. Turning the scheduler on then
  # processes that backlog, oldest first, and fires what it hears -- the
  # flow-trigger analogue of cron's catch-up -- at most 500 events or about one
  # second per tick, so cron ticks keep firing while it drains. Keep this off
  # only if no flow declares a Flow trigger, or expect the backlog to fire when
  # it comes on.
  #
  # The backlog is also UNEVEN. A transition is recorded only if a listener row
  # exists for it, and with the scheduler off the start-up reconciliation never
  # runs: only flows saved after migration 0157 have listener rows. Transitions
  # that an older flow's Flow trigger would hear are not recorded until the
  # scheduler first starts (and reconciles) or that flow is saved again.
  EGRET_WORKFLOW__SCHEDULER_ENABLED: "{{ .Values.workflow.schedulerEnabled }}"
  # W5a — WHERE SCRIPT TASKS RUN. "none" by default: no script handler is
  # registered and the worker is exactly what it was before W5a. "kubernetes"
  # runs one pod per task-run attempt in the task namespace this chart renders
  # (namespace-tasks.yaml, rbac-tasks.yaml, networkpolicy-tasks.yaml). A run
  # still needs the workspace feature `workflow_containers` (off by default)
  # and an image allowed by EGRET_WORKFLOW__PLUGIN_CONFIGURATIONS.
  {{- if eq .Values.workflow.containerRunner "docker" }}
  {{- fail "workflow.containerRunner=docker is for local development only: the chart's backend has no Docker daemon, and a Docker socket in the server is root on the node. Use kubernetes." }}
  {{- end }}
  EGRET_WORKFLOW__CONTAINER_RUNNER: "{{ .Values.workflow.containerRunner }}"
  {{- with .Values.workflow.pluginConfigurations }}
  EGRET_WORKFLOW__PLUGIN_CONFIGURATIONS: {{ . | quote }}
  {{- end }}
  {{- if eq .Values.workflow.containerRunner "kubernetes" }}
  {{- $t := .Values.workflow.tasks }}
  EGRET_WORKFLOW__KUBERNETES__NAMESPACE: "{{ $t.namespace }}"
  EGRET_WORKFLOW__KUBERNETES__HELPER_IMAGE: "{{ $t.helperImage }}"
  EGRET_WORKFLOW__KUBERNETES__RUN_AS_USER: "{{ $t.runAsUser }}"
  EGRET_WORKFLOW__KUBERNETES__IMAGE_PULL_SECRETS: {{ $t.imagePullSecrets | toJson | quote }}
  {{- $h := .Values.workflow.pluginHost }}
  EGRET_WORKFLOW__PLUGIN_HOST__IMAGE: {{ required "workflow.pluginHost.image is required with containerRunner kubernetes" $h.image | quote }}
  EGRET_WORKFLOW__PLUGIN_HOST__JVM_MAX_HEAP: {{ $h.jvmMaxHeap | quote }}
  EGRET_WORKFLOW__PLUGIN_HOST__KILL_GRACE_S: {{ $h.killGraceS | quote }}
  {{- range $key, $res := dict "DEFAULT_RESOURCES" $t.defaultResources "MAX_RESOURCES" $t.maxResources }}
  {{- range $side, $amounts := $res }}
  {{- range $what, $v := $amounts }}
  EGRET_WORKFLOW__KUBERNETES__{{ $key }}__{{ upper $side }}__{{ upper $what }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  EGRET_RANGER__AUTH_TOKEN: ""
  EGRET_ADMIN_EMAIL: "{{ .Values.admin.email }}"
  # Package 4 — HOW MANY OF ME THERE ARE. A pod cannot discover this: the count
  # belongs to the Deployment, and reading it would mean granting every backend
  # pod RBAC to `get deployments` for a number this chart already holds as a
  # literal. Wired from the same value the Deployment's `spec.replicas` uses, so
  # the two cannot disagree.
  #
  # The backend REFUSES TO START when this is above 1 and no shared store is
  # configured — the Data API's rate-limit buckets and response cache would be
  # per process, so every published rate limit would be multiplied by this
  # number. See `sharedStore` in values.yaml for the two remedies.
  EGRET_DATA_API__REPLICAS: "{{ .Values.backend.replicas }}"
{{- if or .Values.sharedStore.enabled .Values.sharedStore.url }}
  # An explicit `sharedStore.url` wins over the in-chart Valkey, so a deployment
  # with a managed Redis/Valkey points at it and `deps-valkey.yaml` renders
  # nothing.
  EGRET_DATA_API__SHARED_STORE_URL: "{{ .Values.sharedStore.url | default (printf "redis://valkey.%s.svc.cluster.local:6379" .Release.Namespace) }}"
{{- end }}
  EGRET_LOG__FILTER: "info,egret=debug"
  EGRET_AUTOMATION__RENDERER_URL: "http://{{ include "egret.fullname" . }}-renderer:8080"
  EGRET_AUTOMATION__PUBLIC_URL: "http://{{ include "egret.fullname" . }}-frontend"
  # What a PERSON opens from a notification. Distinct from PUBLIC_URL above,
  # which is the in-cluster address the renderer resolves — a mail linking
  # there is a dead end in the recipient's inbox.
  EGRET_AUTOMATION__BROWSER_URL: "{{ include "egret.externalUrl" . }}"
{{- if .Values.ingress.enabled }}
  # WHO EGRET IS: the `iss` of every token it mints and the `issuer` of
  # /.well-known/openid-configuration. OIDC Discovery requires that value to
  # equal the URL the document was fetched from, so it must be a name a client
  # OUTSIDE the cluster resolves — which EGRET_CATALOG__PUBLIC_URL above is not.
  # That one stays put: it is the ADDRESS an engine pod dials for the JWKS and
  # the catalog, and routing the data plane's key fetches out through this
  # ingress and back would make every query depend on the ingress being healthy.
  # Identity and address are two questions; unset (no ingress) the backend
  # answers both with the Service DNS name, exactly as before.
  #
  # ⚠️ CHANGING THIS STRANDS EXISTING STARROCKS ENGINES. StarRocks byte-compares
  # `required_issuer` in its security integration, and egret runs
  # `CREATE SECURITY INTEGRATION` — not a replace — ONCE, in the delegation
  # bootstrap at engine creation (egret-engine-mgmt/src/engines.rs). An engine
  # provisioned under the old issuer keeps comparing against it, rejects every
  # new token, and there is no automatic repair. Re-provision such engines, or
  # drop and recreate the integration by hand. (Trino is unaffected: it never
  # reads the issuer — its config sets only jwt.key-file, jwt.principal-field
  # and jwt.required-audience.)
  EGRET_IDP__ISSUER: "{{ include "egret.externalUrl" . }}"
  # What an OUTSIDE CONSUMER of the Data API calls: the base for servers[0].url,
  # tokenUrl and the token_endpoint handed back with a new client. Deliberately
  # NOT EGRET_CATALOG__PUBLIC_URL above — that one is the in-cluster Service DNS
  # the ENGINE pods resolve. A separate key from EGRET_IDP__ISSUER because a
  # deployment may serve its Data API on a third origin; unset, the backend
  # falls back to the issuer, so the `tokenUrl` and the `token_endpoint` beside
  # it in the same document can never name two different hosts by default.
  EGRET_DATA_API__PUBLIC_URL: "{{ include "egret.externalUrl" . }}"
{{- end }}
