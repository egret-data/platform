{{- if .Values.deps.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  replicas: 1
  # The same shape Package 4 found on the Valkey Deployment, and worse here.
  # The default RollingUpdate surges a second pod before terminating the first;
  # with a ReadWriteOnce `postgres-data` PVC that pod cannot mount and the
  # upgrade wedges, and on a ReadWriteMany volume it would be two postmasters
  # over one data directory. Recreate: old pod gone, then new pod.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.deps.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: "{{ .Values.deps.postgres.user }}"
            - name: POSTGRES_PASSWORD
              value: "{{ .Values.deps.postgres.password }}"
            - name: POSTGRES_DB
              value: "{{ .Values.deps.postgres.db }}"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.deps.postgres.user }}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
{{- end }}
