apiVersion: v1
kind: Secret
metadata: { name: egret-secrets, namespace: {{ .Release.Namespace }} }
type: Opaque
stringData:
  master-key: {{ include "egret.masterKey" . | quote }}
  secret-key: {{ include "egret.secretKey" . | quote }}
  storage-access-key: {{ .Values.deps.rustfs.rootUser | quote }}
  storage-secret-key: {{ .Values.deps.rustfs.rootPassword | quote }}
  catalog-auth-token: {{ include "egret.catalogAuthToken" . | quote }}
  admin-password: {{ .Values.admin.password | quote }}
  oidc-client-secret: {{ .Values.oidc.clientSecret | quote }}
