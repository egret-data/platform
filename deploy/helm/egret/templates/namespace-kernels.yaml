{{- /*
The per-user kernel namespace is chart-managed (unlike the engine namespace,
which is pre-created by `just k8s-up`) since it's dedicated to kernel Pods
this chart's backend creates directly. Only rendered when the kubernetes
kernel launcher is enabled.
*/ -}}
{{- if eq .Values.kernel.launcher "kubernetes" }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.kernel.namespace }}
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
{{- end }}
