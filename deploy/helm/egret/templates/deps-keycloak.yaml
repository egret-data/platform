{{- if .Values.oidc.enabled }}
{{- if not .Values.oidc.devRealm }}
{{- fail "oidc.enabled bundles a Keycloak whose only realm is the DEVELOPMENT realm (sslRequired none, a * redirect URI, the password grant, published user passwords, client secret egret-secret). Set oidc.devRealm=true to install it anyway, on a cluster nobody else can reach." }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  labels:
    app: keycloak
data:
  egret-realm.json: |-
    {{- .Files.Get "files/egret-realm.json" | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: {{ .Values.oidc.keycloakImage }}
          args: ["start-dev", "--import-realm"]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: "{{ .Values.oidc.keycloakAdmin }}"
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              value: "{{ .Values.oidc.keycloakAdminPassword }}"
            - name: KC_HTTP_RELATIVE_PATH
              value: "/auth"
            - name: KC_HOSTNAME
              value: "{{ include "egret.externalUrl" . }}/auth"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: "xforwarded"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
          readinessProbe:
            httpGet:
              path: /auth/realms/egret
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 30
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm
            items:
              - key: egret-realm.json
                path: egret-realm.json
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  labels:
    app: keycloak
spec:
  selector:
    app: keycloak
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
