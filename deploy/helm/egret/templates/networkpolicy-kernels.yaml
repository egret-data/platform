{{- /*
NOTE: kind's default CNI (kindnet) does NOT enforce NetworkPolicy — this
policy is declared correctly and is the real production posture, but on a
plain kind cluster it has no runtime effect. Enforcement needs a
NetworkPolicy-capable CNI (Calico, Cilium, ...).
*/ -}}
{{- if and (eq .Values.kernel.launcher "kubernetes") .Values.kernel.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: egret-kernel-isolation, namespace: {{ .Values.kernel.namespace }} }
spec:
  podSelector:
    matchLabels: { managed-by: egret }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} }
      ports:
        - { protocol: TCP, port: 8888 }
  egress:
    # DNS
    - to: []
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # backend (engine-token callback)
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Release.Namespace }} }
    # engines (Trino/StarRocks) + object store
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: {{ .Values.engineNamespace }} }
{{- end }}
