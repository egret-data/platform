{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: egret
  namespace: {{ .Release.Namespace }}
  annotations:
    # PINNED, not inherited. 60 s was ingress-nginx's DEFAULT, read out of the
    # running controller's generated config — a number the Data API's own
    # request deadline is derived from and that this chart did not own, so a
    # controller upgrade or a cluster-wide ConfigMap could have moved it without
    # anything here noticing. `egret_dataapi::serving::SERVING_REQUEST_DEADLINE`
    # (50 s) sits deliberately below it so egret answers an overrun with its own
    # envelope instead of nginx answering with HTML egret never sees; the test
    # `ingress_read_timeout_is_the_number_this_module_derives_from` reads this
    # line and fails if the two stop agreeing.
    #
    # LIMITATION — this annotation is scoped to the INGRESS OBJECT, so it
    # applies to every path of THIS object, not just /data-api: keycloak at
    # /auth and the SPA at / — which carries the
    # console's own /api calls and its websocket connections (the Data Apps pod
    # proxy, engine log streaming), whose upstream nginx deliberately allows
    # 3600 s (`frontend/nginx-prod.conf`). An idle websocket or a long console
    # call behind this ingress is cut at 60 s. One consequence that follows
    # from it is recorded where it bites: `egret_dataapi::try_it` (a trial past
    # 60 s is answered by nginx rather than by egret). One path has been split
    # out so far: /catalog has its own object below (`egret-catalog`, 120 s),
    # because a held view change outlasts 60 s. Splitting the console paths out
    # the same way is still open; whether ingress-nginx routes a path to the
    # object with the longest matching prefix over a merged host is not
    # verified in this repo.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: {{ .Values.ingress.className }}
{{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName | default "egret-ingress-tls" }}
{{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port: { number: 8080 }
          # Machine traffic for the Data API: consumers outside the cluster fetch a
          # token at /oauth/token and call the published endpoint at
          # /data-api/v1/{ws}/{path}. Straight to the backend, not via the SPA's
          # nginx — there is no browser in this path. Listed before the `/`
          # catch-all so it cannot be shadowed, exactly as /auth is.
          - path: /data-api
            pathType: Prefix
            backend:
              service:
                name: egret
                port: { number: 8080 }
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: egret
                port: { number: 8080 }
          # /catalog is routed by the `egret-catalog` Ingress below, which
          # reads for longer than a view-governance hold.
          # The machine-IdP's two discovery documents. EXACT paths, not the
          # /.well-known/ prefix: ACME http-01 challenges, security.txt and
          # anything else under /.well-known belong to the SPA and must keep
          # falling through to it.
          #
          # LIMITATION — this does NOT make external OIDC discovery work. The
          # document's `issuer`, `token_endpoint` and `jwks_uri` are built from
          # the in-cluster issuer (egret-machine-idp `discovery()`), and OIDC
          # requires the document's `issuer` to equal both the `iss` of the
          # minted tokens and the URL the document was fetched from. A client
          # discovering against the external host now gets JSON it correctly
          # rejects instead of HTML it cannot parse — honesty, not a working
          # flow. Closing that needs the issuer itself to be externally
          # reachable, which is deliberately out of scope.
          #
          # /.well-known/jwks.json is the one that is genuinely correct served
          # externally: a key set carries no issuer semantics.
          - path: /.well-known/openid-configuration
            pathType: Exact
            backend:
              service:
                name: egret
                port: { number: 8080 }
          - path: /.well-known/jwks.json
            pathType: Exact
            backend:
              service:
                name: egret
                port: { number: 8080 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: egret-frontend
                port: { number: 80 }
---
# The embedded lakekeeper Iceberg REST catalog, nested at /catalog/v1 by
# egret-server. The warehouse detail page tells the user to paste
# `{origin}/catalog` into Spark and Trino, so this path has to reach the
# backend or that instruction is wrong. Machine traffic with its own bearer
# auth, already CSRF-exempt.
#
# Its own Ingress object because of the read timeout: a view change on a
# classified catalog is HELD until every Trino plugin confirms the new tags,
# for up to `egret_catalog_engine::default_hold_limit()` (3 x the plugin poll
# interval, 90 s). The `egret` object above pins 60 s, which would answer an
# external client 504 while egret goes on to commit or refuse the view. 120 s
# is the hold limit plus a margin; the test
# `the_chart_reads_catalog_requests_for_longer_than_a_hold` reads this line
# and fails if it is not longer than the hold limit.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: egret-catalog
  namespace: {{ .Release.Namespace }}
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
spec:
  ingressClassName: {{ .Values.ingress.className }}
{{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName | default "egret-ingress-tls" }}
{{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /catalog
            pathType: Prefix
            backend:
              service:
                name: egret
                port: { number: 8080 }
{{- end }}
