{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: egret
  namespace: {{ .Release.Namespace }}
  annotations:
    # PINNED, not inherited. 60 s was ingress-nginx's DEFAULT, read out of the
    # running controller's generated config — a number the Data API's own
    # request deadline is derived from and that this chart did not own, so a
    # controller upgrade or a cluster-wide ConfigMap could have moved it without
    # anything here noticing. `egret_dataapi::serving::SERVING_REQUEST_DEADLINE`
    # (50 s) sits deliberately below it so egret answers an overrun with its own
    # envelope instead of nginx answering with HTML egret never sees; the test
    # `ingress_read_timeout_is_the_number_this_module_derives_from` reads this
    # line and fails if the two stop agreeing.
    #
    # LIMITATION — this annotation is scoped to the INGRESS OBJECT, so it now
    # applies to every path below, not just /data-api: keycloak at /auth, the
    # Iceberg REST catalog at /catalog, and the SPA at / — which carries the
    # console's own /api calls and its websocket connections (the Data Apps pod
    # proxy, engine log streaming), whose upstream nginx deliberately allows
    # 3600 s (`frontend/nginx-prod.conf`). An idle websocket or a long console
    # call behind this ingress is now cut at 60 s where it was not before. One
    # consequence that follows from it is recorded where it bites:
    # `egret_dataapi::TRIAL_REQUEST_DEADLINE` (a trial past 60 s is answered by
    # nginx rather than by egret). Fixing it properly means splitting this into
    # two Ingress objects — one for the machine paths that need the pinned 60 s
    # and one for everything else — which is a deployment change nothing in
    # this repo can currently verify, so it is written down rather than
    # guessed at.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
spec:
  ingressClassName: {{ .Values.ingress.className }}
{{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName | default "egret-ingress-tls" }}
{{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port: { number: 8080 }
          # Machine traffic for the Data API: consumers outside the cluster fetch a
          # token at /oauth/token and call the published endpoint at
          # /data-api/v1/{ws}/{path}. Straight to the backend, not via the SPA's
          # nginx — there is no browser in this path. Listed before the `/`
          # catch-all so it cannot be shadowed, exactly as /auth is.
          - path: /data-api
            pathType: Prefix
            backend:
              service:
                name: egret
                port: { number: 8080 }
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: egret
                port: { number: 8080 }
          # Embedded lakekeeper Iceberg REST catalog, nested at /catalog/v1 by
          # egret-server. The warehouse detail page tells the user to paste
          # `{origin}/catalog` into Spark and Trino, so this path has to reach the
          # backend or that instruction is wrong. Machine traffic with its own
          # bearer auth, already CSRF-exempt.
          - path: /catalog
            pathType: Prefix
            backend:
              service:
                name: egret
                port: { number: 8080 }
          # The machine-IdP's two discovery documents. EXACT paths, not the
          # /.well-known/ prefix: ACME http-01 challenges, security.txt and
          # anything else under /.well-known belong to the SPA and must keep
          # falling through to it.
          #
          # LIMITATION — this does NOT make external OIDC discovery work. The
          # document's `issuer`, `token_endpoint` and `jwks_uri` are built from
          # the in-cluster issuer (egret-machine-idp `discovery()`), and OIDC
          # requires the document's `issuer` to equal both the `iss` of the
          # minted tokens and the URL the document was fetched from. A client
          # discovering against the external host now gets JSON it correctly
          # rejects instead of HTML it cannot parse — honesty, not a working
          # flow. Closing that needs the issuer itself to be externally
          # reachable, which is deliberately out of scope.
          #
          # /.well-known/jwks.json is the one that is genuinely correct served
          # externally: a key set carries no issuer semantics.
          - path: /.well-known/openid-configuration
            pathType: Exact
            backend:
              service:
                name: egret
                port: { number: 8080 }
          - path: /.well-known/jwks.json
            pathType: Exact
            backend:
              service:
                name: egret
                port: { number: 8080 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: egret-frontend
                port: { number: 80 }
{{- end }}
