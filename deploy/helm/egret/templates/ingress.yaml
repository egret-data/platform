{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: egret
  namespace: {{ .Release.Namespace }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
{{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName | default "egret-ingress-tls" }}
{{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port: { number: 8080 }
          # Machine traffic for the Data API: consumers outside the cluster fetch a
          # token at /oauth/token and call the published endpoint at
          # /data-api/v1/{ws}/{path}. Straight to the backend, not via the SPA's
          # nginx — there is no browser in this path. Listed before the `/`
          # catch-all so it cannot be shadowed, exactly as /auth is.
          - path: /data-api
            pathType: Prefix
            backend:
              service:
                name: egret
                port: { number: 8080 }
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: egret
                port: { number: 8080 }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: egret-frontend
                port: { number: 80 }
{{- end }}
