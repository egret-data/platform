{{- /*
Package 4 — the same refusal the backend makes at startup, made here so an
operator meets it at `helm upgrade` rather than in a CrashLoopBackOff.

`serving::choose_store` is the AUTHORITY: it runs in every deployment, chart or
no chart, and it is what actually stops a process from serving with
process-local limits. This guard cannot be more permissive than that one (it
tests the same two values with the same comparison) and exists only to move the
message earlier.
*/ -}}
{{- if and (gt (int .Values.backend.replicas) 1) (not .Values.sharedStore.enabled) (not .Values.sharedStore.url) }}
{{- fail (printf "backend.replicas is %d, but no shared store is configured: the Data API's rate-limit buckets and response cache are held per process, so every published rate limit would be multiplied by %d and the response cache fragmented %d ways, silently.\n\nTwo remedies, either of which clears this:\n  1. Set sharedStore.enabled=true (or sharedStore.url=redis://…) so all replicas share one limiter and one cache.\n  2. Set backend.replicas=1, which makes the process-local state correct again." (int .Values.backend.replicas) (int .Values.backend.replicas) (int .Values.backend.replicas)) }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata: { name: egret, namespace: {{ .Release.Namespace }} }
spec:
  replicas: {{ .Values.backend.replicas }}
  selector: { matchLabels: { app: egret } }
  template:
    metadata: { labels: { app: egret } }
    spec:
      serviceAccountName: egret
      containers:
        - name: egret
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - { containerPort: 8080 }
            {{- if .Values.apps.origin }}
            - { containerPort: 8081 }
            {{- end }}
          envFrom:
            - configMapRef: { name: egret-env }
          env:
            - { name: EGRET_STORAGE__ACCESS_KEY, valueFrom: { secretKeyRef: { name: egret-secrets, key: storage-access-key } } }
            - { name: EGRET_STORAGE__SECRET_KEY, valueFrom: { secretKeyRef: { name: egret-secrets, key: storage-secret-key } } }
            - { name: EGRET_SECRETS__MASTER_KEY, valueFrom: { secretKeyRef: { name: egret-secrets, key: master-key } } }
            - { name: EGRET_SECURITY__SECRET_KEY, valueFrom: { secretKeyRef: { name: egret-secrets, key: secret-key } } }
            - { name: EGRET_CATALOG__AUTH_TOKEN, valueFrom: { secretKeyRef: { name: egret-secrets, key: catalog-auth-token } } }
            - { name: EGRET_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: egret-secrets, key: admin-password } } }
            - { name: EGRET_OIDC__CLIENT_SECRET, valueFrom: { secretKeyRef: { name: egret-secrets, key: oidc-client-secret } } }
            {{- if .Values.ingress.tls.enabled }}
            # TLS ends at the ingress, so the backend itself sees plain http; its cookies must still be
            # `Secure` (and `__Host-` prefixed: egret_auth::cookie), or a sibling host's JavaScript could
            # toss a cookie of the same name.
            - { name: EGRET_SESSION__SECURE, value: "true" }
            {{- end }}
            {{- if .Values.apps.origin }}
            - { name: EGRET_APPS__ORIGIN, value: "{{ .Values.apps.origin }}" }
            - { name: EGRET_APPS__EGRET_ORIGIN, value: "{{ .Values.apps.egretOrigin }}" }
            - { name: EGRET_APPS__LISTEN, value: "0.0.0.0:8081" }
            {{- if eq .Values.apps.pod.launcher "kubernetes" }}
            - { name: EGRET_APPS__POD__LAUNCHER, value: "kubernetes" }
            - { name: EGRET_APPS__POD__NAMESPACE, value: "{{ .Values.apps.pod.namespace }}" }
            - { name: EGRET_APPS__POD__IMAGE, value: "{{ .Values.apps.pod.image }}" }
            - { name: EGRET_APPS__POD__IMAGE_PULL_POLICY, value: "{{ .Values.apps.pod.imagePullPolicy }}" }
            - { name: EGRET_APPS__POD__CPU_REQUEST, value: "{{ .Values.apps.pod.resources.cpuRequest }}" }
            - { name: EGRET_APPS__POD__MEM_REQUEST, value: "{{ .Values.apps.pod.resources.memRequest }}" }
            - { name: EGRET_APPS__POD__CPU_LIMIT, value: "{{ .Values.apps.pod.resources.cpuLimit }}" }
            - { name: EGRET_APPS__POD__MEM_LIMIT, value: "{{ .Values.apps.pod.resources.memLimit }}" }
            - { name: EGRET_APPS__POD__READY_TIMEOUT_SECS, value: "{{ .Values.apps.pod.readyTimeoutSecs }}" }
            - { name: EGRET_APPS__POD__IDLE_SECS, value: "{{ .Values.apps.pod.idleSecs }}" }
            # Run pods (D24: one per viewer per published version), separate from the edit settings above.
            - { name: EGRET_APPS__POD__RUN_IDLE_SECS, value: "{{ .Values.apps.pod.run.idleSecs }}" }
            - { name: EGRET_APPS__POD__RUN_SESSION_CAP, value: "{{ .Values.apps.pod.run.sessionCap }}" }
            - { name: EGRET_APPS__POD__RUN_KERNEL_MODE, value: "{{ .Values.apps.pod.run.kernelMode }}" }
            # Where a pod calls back: egret's in-cluster Service, API port (the pod API + the query gateway).
            - { name: EGRET_APPS__POD__CALLBACK_URL, value: "http://egret.{{ .Release.Namespace }}.svc.cluster.local:8080" }
            {{- end }}
            {{- end }}
            {{- if eq .Values.kernel.launcher "kubernetes" }}
            - { name: EGRET_KERNEL__LAUNCHER, value: "kubernetes" }
            - { name: EGRET_KERNEL__NAMESPACE, value: "{{ .Values.kernel.namespace }}" }
            - { name: EGRET_KERNEL__IMAGE, value: "{{ .Values.kernel.image }}" }
            - { name: EGRET_KERNEL__IMAGE_PULL_POLICY, value: "{{ .Values.kernel.imagePullPolicy }}" }
            - { name: EGRET_KERNEL__CPU_REQUEST, value: "{{ .Values.kernel.resources.cpuRequest }}" }
            - { name: EGRET_KERNEL__MEM_REQUEST, value: "{{ .Values.kernel.resources.memRequest }}" }
            - { name: EGRET_KERNEL__CPU_LIMIT, value: "{{ .Values.kernel.resources.cpuLimit }}" }
            - { name: EGRET_KERNEL__MEM_LIMIT, value: "{{ .Values.kernel.resources.memLimit }}" }
            - { name: EGRET_KERNEL__CALLBACK_URL, value: "http://egret.{{ .Release.Namespace }}.svc.cluster.local:8080" }
            - { name: EGRET_KERNEL__ENGINE_TLS_INSECURE, value: {{ .Values.kernel.engineTlsInsecure | quote }} }
            {{- if .Values.kernel.pullSecret }}
            - { name: EGRET_KERNEL__PULL_SECRET, value: "{{ .Values.kernel.pullSecret }}" }
            {{- end }}
            {{- end }}
          # BOTH probes were `tcpSocket`, which is why `/readyz` — a handler that
          # pings the database — had never once been called in this deployment: a
          # pod whose metastore was gone still accepted the listening socket and
          # therefore still received traffic. They are HTTP now, and the two ask
          # DIFFERENT questions on purpose.
          #
          # readiness -> /readyz  ("should I get traffic?"): pings the DB.
          # liveness  -> /healthz ("am I wedged?"): process only, NEVER the DB.
          #
          # Pointing liveness at /readyz is the tempting simplification and it is
          # a trap: a database blip would then RESTART every replica at once,
          # turning a recoverable dependency outage into a cluster-wide crash
          # loop, and the restarts would keep the pods out of service for longer
          # than the outage itself.
          #
          # Timings are chosen, not defaults, and the readiness ones are chosen
          # TOGETHER WITH the bulkhead width and the pool size — the full
          # reconciliation is on `egret_server::READYZ_DB_TIMEOUT`, and
          # `deployment_probes.rs` asserts these numbers against those constants:
          #  * timeoutSeconds 3, not the default 1 — /readyz does a real round
          #    trip. It is also deliberately ABOVE READYZ_DB_TIMEOUT (2 s) so
          #    egret answers the probe rather than the kubelet abandoning it and
          #    leaving a queued pool waiter behind.
          #  * readiness 11 x 5 s = 55 s before traffic is withdrawn. NOT 15 s.
          #    The serving bulkhead admits 64 concurrent requests over a pool of
          #    10 connections, so a pool with nothing free is the normal busy
          #    state of a HEALTHY pod, and one admitted request may hold its
          #    connection for the whole 50 s request deadline. A withdrawal
          #    budget under 50 s therefore removes busy pods, and each removal
          #    moves that load onto peers which fail the same check next — the
          #    flap is caused by the probe, not detected by it. 55 s outlasts one
          #    full-length request; the cost is that a genuinely dead database
          #    keeps taking traffic for 55 s, and those requests fail loudly.
          #  * liveness 3 x 20 s = 60 s wedged before a restart, and it cannot
          #    fire during boot because the startupProbe below gates it.
          #  * startupProbe: boot runs migrations, whose duration is not knowable
          #    from here. 60 x 2 s = 120 s before liveness begins at all. This
          #    does not make a slow migration safe — a migration past 120 s is
          #    still a restart loop — it raises the ceiling from the ~60 s
          #    liveness would otherwise allow, and it is the knob to raise if a
          #    large metastore ever needs longer.
          startupProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /readyz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 11
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Without these the container is BestEffort QoS: no memory ceiling, and
          # first in line for eviction when the node is under pressure. A single
          # served Data API request may materialise `MAX_ROWS_CEILING`
          # (1 000 000) rows in memory, so the exposure is real and it is not
          # theoretical.
          #
          # What a limit does and does not buy, stated plainly: it does NOT make
          # that request survive — nothing here can, and streaming the response
          # is the actual fix. It bounds the BLAST RADIUS. With a limit the
          # kernel kills egret and the pod restarts; without one the same
          # allocation destabilises the node and takes its neighbours with it.
          #
          # 4Gi does NOT hold one largest-publishable response, and an earlier
          # version of this comment claimed it did. The arithmetic:
          # `ServingResponse.data` is a `serde_json::Value` tree built from the
          # engine's `TabularResult`, and `Json(...)` then serialises that tree
          # into a second contiguous buffer before the first byte is written. So
          # at peak there are two to three live representations of the same rows,
          # and a `Value` tree is itself several times the wire bytes (an enum
          # discriminant, a `String` header or a `Map` node per cell). A
          # 1 000 000-row response is OOMKilled at 4Gi, and OOMKill is SIGKILL:
          # the drain this package added does NOT run, so the other in-flight
          # requests on the pod die with it. That is the strongest argument for
          # streaming the response, which is the actual fix and is not here.
          #
          # What 4Gi IS: room for egret's own working set plus a handful of
          # ordinary responses (`limits.max_rows` DEFAULTS to 10 000, three
          # orders of magnitude below the ceiling), and a blast radius bounded to
          # one pod instead of the node. The publishable ceiling of 1 000 000
          # rows is the number that is wrong for this limit; lowering it is a
          # contract change and belongs with the streaming work, not here.
          resources:
{{ toYaml .Values.backend.resources | indent 12 }}
      # Longer than `egret_server::DRAIN_DEADLINE` (55 s) so the PROCESS decides
      # when to stop, not SIGKILL. Kubernetes' default is 30 s, which is below
      # even the per-request deadline (50 s) — leaving it at the default would
      # have made the graceful shutdown unreachable and every deploy would still
      # have killed in-flight queries.
      terminationGracePeriodSeconds: {{ .Values.backend.terminationGracePeriodSeconds }}
