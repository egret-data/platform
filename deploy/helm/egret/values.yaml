backend:
  image: { repository: egret-backend, tag: dev, pullPolicy: IfNotPresent }
  replicas: 1
  # Requests/limits — see backend-deployment.yaml for why each number is what it
  # is. Without them the container is BestEffort QoS.
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  # Must stay ABOVE egret_server::DRAIN_DEADLINE (55 s), or SIGKILL arrives
  # before the drain finishes and the graceful shutdown is decoration.
  terminationGracePeriodSeconds: 65
# Package 4 — where the Data API's rate-limit buckets and response cache live.
#
# Both are process-local unless this is configured. Raising `backend.replicas`
# above 1 without it would multiply every PUBLISHED rate limit by the replica
# count and fragment the response cache, silently — so the backend REFUSES TO
# START in that combination (`serving::choose_store`), and `configmap-env.yaml`
# passes `backend.replicas` down as EGRET_DATA_API__REPLICAS so it can.
#
# Optional on purpose: a single-replica deployment needs nothing here.
sharedStore:
  # Render and use the in-chart Valkey below.
  enabled: false
  # OR point at a Redis/Valkey you already run, in which case nothing is
  # rendered and this URL is used as-is. Wins over `enabled`.
  # Numbered logical databases separate two egret deployments sharing one
  # instance: redis://valkey:6379/1
  url: ""
  image: valkey/valkey:8-alpine
  # Set EXPLICITLY, not inherited. Redis/Valkey default to `noeviction`, under
  # which a full instance fails writes — and since the rate limiter fails CLOSED
  # on a store error, a full cache would become 503s on every rate-limited
  # endpoint. `allkeys-lru` sheds the coldest keys instead. The one consequence:
  # an evicted limiter bucket comes back full, granting that key at most one
  # extra burst — the same caveat the in-process map already documents, and in
  # practice it lands on idle clients, whose buckets had refilled anyway.
  maxmemory: 256mb
  maxmemoryPolicy: allkeys-lru
  # Above `maxmemory`, which bounds the DATA only: the process, its client
  # buffers and its copy-on-write headroom are on top of it.
  memoryRequest: 128Mi
  memoryLimit: 512Mi
frontend:
  image: { repository: egret-frontend, tag: dev, pullPolicy: IfNotPresent }
  nodePort: 30080
renderer:
  image: { repository: egret-renderer, tag: dev, pullPolicy: IfNotPresent }
  replicas: 1
ingress:
  enabled: false
  host: egret.localtest.me
  className: nginx
  tls:
    enabled: false
    # Bring-your-own existing k8s TLS Secret (e.g. cert-manager). Wins when set.
    secretName: ""
    # OR inline PEM cert+key — the chart creates `egret-ingress-tls` from them.
    cert: ""
    key: ""
engineNamespace: egret-engines
# The engine namespace is normally pre-created by `just k8s-up`. Set true only on
# a bare cluster where it doesn't exist yet (else Helm can't adopt it).
createEngineNamespace: false
admin:
  email: admin@egret.local
  password: Admin12345!
oidc:
  enabled: false
  realm: egret
  clientId: egret
  clientSecret: egret-secret
  keycloakImage: quay.io/keycloak/keycloak:26.0
  keycloakAdmin: admin
  keycloakAdminPassword: admin
ranger:
  enabled: false
deps:
  enabled: true
  postgres:
    image: postgres:16
    user: egret
    password: egret
    db: egret
  # A mail catcher, so the dev stack can READ a report's email instead of
  # assuming it. Never for a real deployment — see deps-mailpit.yaml.
  mailpit:
    enabled: true
    image: axllent/mailpit:latest
  minio:
    image: minio/minio:latest
    mcImage: minio/mc:latest
    rootUser: egret
    rootPassword: egretsecret
    bucket: warehouse
storage:
  region: us-east-1
  pathStyle: true
kernel:
  launcher: subprocess        # "kubernetes" enables per-user kernel pods
  namespace: egret-notebooks
  image: egret-kernel:dev
  imagePullPolicy: IfNotPresent
  pullSecret: ""
  # Break-glass ONLY: disable engine-TLS verification in the kernel entirely
  # (accepts any cert — MITM-unsafe). Leave false: the kernel securely PINS the
  # engine's self-signed cert (delivered via the engine-token endpoint), so
  # self-signed engines work without disabling verification.
  engineTlsInsecure: false
  resources:
    cpuRequest: "250m"
    memRequest: "512Mi"
    cpuLimit: "1000m"
    memLimit: "2Gi"
  networkPolicy:
    enabled: true
# master/secret keys: generated-and-persisted by the chart (see secret.yaml); do
# NOT put real secrets here.
