backend:
  image: { repository: egret-backend, tag: dev, pullPolicy: IfNotPresent }
  replicas: 1
  # Requests/limits — see backend-deployment.yaml for why each number is what it
  # is. Without them the container is BestEffort QoS.
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "4Gi"
  # Must stay ABOVE egret_server::DRAIN_DEADLINE (55 s), or SIGKILL arrives
  # before the drain finishes and the graceful shutdown is decoration.
  terminationGracePeriodSeconds: 65
# Package 4 — where the Data API's rate-limit buckets and response cache live.
#
# Both are process-local unless this is configured. Raising `backend.replicas`
# above 1 without it would multiply every PUBLISHED rate limit by the replica
# count and fragment the response cache, silently — so the backend REFUSES TO
# START in that combination (`serving::choose_store`), and `configmap-env.yaml`
# passes `backend.replicas` down as EGRET_DATA_API__REPLICAS so it can.
#
# Optional on purpose: a single-replica deployment needs nothing here.
sharedStore:
  # Render and use the in-chart Valkey below.
  enabled: false
  # OR point at a Redis/Valkey you already run, in which case nothing is
  # rendered and this URL is used as-is. Wins over `enabled`.
  # Numbered logical databases separate two egret deployments sharing one
  # instance: redis://valkey:6379/1
  url: ""
  image: valkey/valkey:8-alpine
  # Set EXPLICITLY, not inherited. Redis/Valkey default to `noeviction`, under
  # which a full instance fails writes — and since the rate limiter fails CLOSED
  # on a store error, a full cache would become 503s on every rate-limited
  # endpoint. `allkeys-lru` sheds the coldest keys instead. The one consequence:
  # an evicted limiter bucket comes back FULL, granting that key at most one
  # extra burst — the same caveat the in-process map already documents. Redis'
  # LRU is approximate (it samples), so that can happen to a client that is
  # actively sending, not only to an idle one.
  #
  # 256mb is as few as ~64 cache entries at their 4 MiB ceiling, while a limiter
  # bucket is a few dozen bytes — so hitting this ceiling is a cache-pressure
  # event, and this is the number to raise if `evicted_keys` on the store is
  # non-zero in steady state.
  maxmemory: 256mb
  maxmemoryPolicy: allkeys-lru
  # Above `maxmemory`, which bounds the DATA only: the process, its client
  # buffers and its copy-on-write headroom are on top of it.
  memoryRequest: 128Mi
  memoryLimit: 512Mi
frontend:
  image: { repository: egret-frontend, tag: dev, pullPolicy: IfNotPresent }
  nodePort: 30080
renderer:
  image: { repository: egret-renderer, tag: dev, pullPolicy: IfNotPresent }
  replicas: 1
ingress:
  enabled: false
  host: egret.localtest.me
  className: nginx
  tls:
    enabled: false
    # Bring-your-own existing k8s TLS Secret (e.g. cert-manager). Wins when set.
    secretName: ""
    # OR inline PEM cert+key — the chart creates `egret-ingress-tls` from them.
    cert: ""
    key: ""
engineNamespace: egret-engines
# The engine namespace is normally pre-created by `just k8s-up`. Set true only on
# a bare cluster where it doesn't exist yet (else Helm can't adopt it).
createEngineNamespace: false
admin:
  email: admin@egret.local
  password: Admin12345!
oidc:
  enabled: false
  realm: egret
  clientId: egret
  clientSecret: egret-secret
  keycloakImage: quay.io/keycloak/keycloak:26.0
  keycloakAdmin: admin
  keycloakAdminPassword: admin
# The workflow engine's deployment switches.
workflow:
  # The ANONYMOUS webhook surface. Off by default, and it should stay off unless
  # you have read `egret_workflow::webhook_routes`' module doc: the key in the
  # URL is the whole credential, the surface's own security review says it is
  # not approved for exposure, and the in-process bounds are per replica.
  webhooksEnabled: false
  # The claim loop and the lease reaper. Off by default: until W10 nothing in any
  # binary called them, so a deployment that says nothing keeps behaving exactly
  # as it did. Turn it on and executions actually advance.
  workerEnabled: false
  # `cron:` schedule triggers. Off by default. Needs workerEnabled too: with the
  # scheduler on and the worker off, executions are created and nothing runs them.
  schedulerEnabled: false
  # W5a: where script tasks (io.kestra.plugin.scripts.{shell,python}.*, and the
  # aliases egret.container / egret.script.python) run. "none" (the default)
  # registers no script handler: the worker is exactly what it was before W5a.
  # "kubernetes" runs one pod per task-run attempt in `tasks.namespace` and
  # renders that namespace (Pod Security restricted), a Role with exactly
  # pods get/list/watch/create/delete, pods/log get and pods/exec get/create, its
  # RoleBinding to egret's ServiceAccount, and the NetworkPolicy below.
  # ("docker" is for local development only and is refused by this chart: a
  # Docker socket in the server is root on the node.)
  # Running a script task ALSO needs the workspace feature
  # `workflow_containers` (off by default) and an allowed image below.
  containerRunner: none
  # `workflow.plugin_configurations` (Kestra's `kestra.plugins.configurations`
  # shape), as the one env value egret reads. Empty allows NO image, e.g.:
  # '[{type="io.kestra.plugin.ee.kubernetes.runner.Kubernetes",values={allowed-images=["python:3.13-slim","ubuntu:*"]}}]'
  pluginConfigurations: ""
  # W5b: the image and JVM that run Kestra plugin tasks (`type: kestra.<FQCN>`,
  # built from deploy/docker/plugin-host.Dockerfile). Rendered only with
  # containerRunner kubernetes, where egret refuses to start without an image.
  # It is NOT matched against allowed-images: the author cannot choose it.
  # Running a plugin task also needs the workspace feature
  # `workflow_kestra_plugins` (off by default, requires workflow_containers).
  pluginHost:
    # REQUIRED whenever containerRunner is not `none`, even with no plugin task:
    # egret refuses to start without it (W5b release note). `egret-plugin-host:dev`
    # is published nowhere -- set a pullable image built from
    # deploy/docker/plugin-host.Dockerfile (or `kind load` it for local use).
    image: egret-plugin-host:dev
    # The JVM's -Xmx, below the pod's default memory limit (512Mi).
    jvmMaxHeap: 384m
    # Seconds between SIGTERM (the host calls the plugin's kill(), which
    # cancels the query on Postgres/Trino) and SIGKILL on a timeout. Minimum 3
    # (egret refuses to start below it: the host waits the grace less 2 s).
    killGraceS: 15
  tasks:
    namespace: egret-tasks
    # deploy/docker/task-helper.Dockerfile; must be pullable from the task
    # namespace (or `kind load`ed).
    helperImage: egret-task-helper:dev
    runAsUser: 1000
    # Existing dockerconfigjson Secrets in the task namespace.
    imagePullSecrets: []
    # Unset keys keep egret's defaults (request 100m/128Mi, limit 1/512Mi;
    # max limit 2/2Gi). e.g. defaultResources: { limit: { memory: 1Gi } }
    # Node disk: `ephemeral_storage` (default request 256Mi, limit 10Gi, max
    # limit 10Gi). The limit is also the task's working-directory emptyDir
    # sizeLimit; a task that writes past it is evicted and FAILED with the
    # kubelet's reason. e.g. maxResources: { limit: { ephemeral_storage: 20Gi } }
    defaultResources: {}
    maxResources: {}
    networkPolicy:
      enabled: true
      # REQUIRED (the render fails without them): the cluster's pod and
      # service CIDRs. They are excepted from the "outside the cluster" rule so
      # in-cluster traffic is judged only by the namespace/pod rules, which
      # leave egret's Postgres out. Wrong values silently re-open Postgres on a
      # CNI that matches ipBlock against pod IPs (Calico does), which is why
      # there is no default. kind: 10.244.0.0/16 and 10.96.0.0/12.
      podCidr: ""
      serviceCidr: ""
      # The Kubernetes API server's endpoint addresses. Looked up from the
      # `default/kubernetes` Endpoints at install/upgrade only (the deprecated
      # Endpoints API; control-plane IPs on EKS/GKE can change between
      # upgrades -- re-run `helm upgrade`, or list them here); `helm template`
      # cannot look up, so set them there (kubectl get endpoints kubernetes -n
      # default). Empty after both: the render fails.
      apiServerCidrs: []
      # IPs task pods must not reach. The default is the cloud metadata
      # service (node credentials on EKS/GKE without IMDSv2 hop limit or
      # Workload Identity); remove it only deliberately. Add an OUT-OF-CLUSTER
      # metadata Postgres here, e.g. "10.0.12.7/32". An IN-cluster address
      # cannot be denied this way (in-cluster traffic is judged by selectors):
      # use deniedNamespaces for that.
      deniedCidrs: ["169.254.169.254/32"]
      # Namespaces task pods must not reach at all, besides egret's own
      # Postgres pod. A metadata Postgres run in-cluster outside egret's
      # release namespace goes here (its whole namespace is denied).
      deniedNamespaces: []
      # IPv4 only: on a dual-stack cluster IPv6 egress is therefore DENIED
      # (fail-closed), not open.

ranger:
  enabled: false
deps:
  enabled: true
  postgres:
    image: postgres:16
    user: egret
    password: egret
    db: egret
  # A mail catcher, so the dev stack can READ a report's email instead of
  # assuming it. Never for a real deployment — see deps-mailpit.yaml.
  mailpit:
    enabled: true
    image: axllent/mailpit:latest
  # The bundled S3 server is RustFS, not MinIO: MinIO withdrew its public images
  # (docker.io/minio/* and quay.io/minio/* both answer 401), so a fresh install
  # wedged forever on a deployment that could never pull. The key, the Service
  # and the Deployment keep the name `minio` because engines, e2e recipes and
  # seed scripts address `http://minio:9000`; only what runs behind it changed.
  # egret needs STS AssumeRole from this server (the embedded catalog vends
  # credentials through it), which is what ruled the other candidates out.
  minio:
    image: rustfs/rustfs:1.0.1
    # Any image with a shell and the `aws` CLI: it creates the bucket once.
    clientImage: amazon/aws-cli:2.37.9
    rootUser: egret
    rootPassword: egretsecret
    bucket: warehouse
storage:
  region: us-east-1
  pathStyle: true
# master/secret keys: generated-and-persisted by the chart (see secret.yaml); do
# NOT put real secrets here.

# Data Apps (marimo): the apps host, and the pods that run an author's edit session.
apps:
  # Where marimo is served to the browser: a SIBLING subdomain of ingress.host (`apps.<host>`),
  # never another port on the same host (cookies are not isolated by port). Empty = the apps
  # iframe is off and the apps listener is not started.
  origin: ""
  # egret's own browser-facing origin: the only one allowed to frame the apps origin.
  egretOrigin: ""
  pod:
    launcher: none            # "kubernetes" starts one hardened Pod per author per workspace
    namespace: egret-apps     # chart-managed; Pod Security `restricted` is enforced there
    image: egret-apps:dev
    imagePullPolicy: IfNotPresent
    resources: { cpuRequest: 250m, memRequest: 512Mi, cpuLimit: 1000m, memLimit: 2Gi }
    readyTimeoutSecs: 60
    idleSecs: 1800            # an edit pod unused this long is stopped
    networkPolicy: { enabled: true }
    # Run pods (D24: one per viewer per published version, never shared).
    run:
      idleSecs: 300           # shorter than idleSecs above: an abandoned tab costs less than an author's work
      sessionCap: 8           # that one viewer's own open tabs, not concurrent strangers (D24)
      kernelMode: thread      # "thread" (default, safe because D24 makes one pod one viewer) or "forced_ipc"
