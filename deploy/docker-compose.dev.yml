name: egret-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: egret
      POSTGRES_PASSWORD: egret
      POSTGRES_DB: egret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egret"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: egret
      MINIO_ROOT_PASSWORD: egretsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    # No healthcheck: `minio/minio:latest` has no `local` mc alias preconfigured and
    # no curl, so a readiness probe is unreliable here. Phase 2 (when a service gates
    # on MinIO) adds a proper probe against http://localhost:9000/minio/health/ready.
    volumes:
      - miniodata:/data

  trino:
    image: trinodb/trino:latest
    ports:
      - "8090:8080"
      - "8453:8443"   # F2-P5: HTTPS (JWT auth is only ENFORCED over TLS)
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      # F2-P3/P5: JWT auth + group ACL over HTTPS. JWT is only enforced over TLS
      # (see trino/etc/README.md); dev uses a self-signed keystore.
      - ./trino/etc/config.properties:/etc/trino/config.properties
      - ./trino/etc/access-control.properties:/etc/trino/access-control.properties
      - ./trino/etc/rules.json:/etc/trino/rules.json
      - ./trino/etc/trino-keystore.p12:/etc/trino/trino-keystore.p12

  starrocks:
    image: starrocks/allin1-ubuntu:latest
    ports:
      - "9030:9030"   # MySQL protocol (query)
      - "8030:8030"   # FE HTTP
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'select 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # Apache Polaris — external Iceberg REST catalog, driven by egret's control plane.
  # Dev config: INTERNAL auth (bootstrap root principal via Polaris's own OAuth2
  # client_credentials endpoint). The MIXED/Keycloak-OIDC target is the prod design
  # (see the control-plane-polaris spec); dev uses Polaris-internal tokens so the
  # egret-polaris client (any OAuth2 client_credentials source) points at Polaris itself.
  polaris:
    image: apache/polaris:latest
    depends_on:
      - minio
    ports:
      - "8181:8181"   # Iceberg REST + management API
      - "8182:8182"   # Quarkus management (health)
    environment:
      # Storage: MinIO (S3-compatible). AWS SDK honors AWS_ENDPOINT_URL_S3 + path-style.
      AWS_ACCESS_KEY_ID: egret
      AWS_SECRET_ACCESS_KEY: egretsecret
      AWS_REGION: us-east-1
      AWS_ENDPOINT_URL_S3: http://minio:9000
      AWS_ENDPOINT_URL: http://minio:9000
      # Bootstrap realm POLARIS with a root principal (clientId=root, secret=s3cr3t).
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,root,s3cr3t
      polaris.realm-context.realms: POLARIS
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": "[\"FILE\",\"S3\"]"
      polaris.readiness.ignore-severe-issues: "true"
      quarkus.otel.sdk.disabled: "true"
      quarkus.log.file.enabled: "false"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8182/q/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Optional: serve the production-built frontend via nginx.
  # Primary dev path is `npm run dev` (Vite) + `cargo run -p egret-bin -- serve`.
  # Note: the Egret backend is not containerized in this compose yet, so /api
  # requests will not resolve. Use this service for static-build smoke tests only.
  frontend:
    build: ../frontend
    ports:
      - "5173:80"
    depends_on:
      - postgres

volumes:
  pgdata:
  miniodata:
