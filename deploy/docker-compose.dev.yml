name: egret-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: egret
      POSTGRES_PASSWORD: egret
      POSTGRES_DB: egret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egret"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  rustfs:
    # Not MinIO: its public images were withdrawn (docker.io and quay.io answer 401). egret
    # needs STS AssumeRole from this server — the embedded catalog vends credentials through it.
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: egret
      RUSTFS_SECRET_KEY: egretsecret
    ports:
      - "9000:9000"   # S3 API; readiness is GET /health
      - "9001:9001"   # console
    # A new volume, not the old `miniodata`: RustFS cannot read MinIO's on-disk format.
    volumes:
      - rustfsdata:/data

  trino:
    image: trinodb/trino:latest
    ports:
      - "8090:8080"
      - "8453:8443"   # F2-P5: HTTPS (JWT auth is only ENFORCED over TLS)
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      # F2-P3/P5: JWT auth + group ACL over HTTPS. JWT is only enforced over TLS
      # (see trino/etc/README.md); dev uses a self-signed keystore.
      - ./trino/etc/config.properties:/etc/trino/config.properties
      - ./trino/etc/access-control.properties:/etc/trino/access-control.properties
      - ./trino/etc/rules.json:/etc/trino/rules.json
      - ./trino/etc/trino-keystore.p12:/etc/trino/trino-keystore.p12

  starrocks:
    image: starrocks/allin1-ubuntu:latest
    ports:
      - "9030:9030"   # MySQL protocol (query)
      - "8030:8030"   # FE HTTP
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'select 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      # Ranger authorization plugin config (dev). FE conf-dir path confirmed
      # against a real `starrocks/allin1-ubuntu:latest` container (`find / -name
      # fe.conf` -> /data/deploy/starrocks/fe/conf/fe.conf, which is on the FE's
      # CLASSPATH per fe/bin/start_fe.sh) — see deploy/starrocks/README.md.
      - ./starrocks/ranger/ranger-starrocks-security.xml:/data/deploy/starrocks/fe/conf/ranger-starrocks-security.xml:ro
      - ./starrocks/ranger/ranger-starrocks-audit.xml:/data/deploy/starrocks/fe/conf/ranger-starrocks-audit.xml:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # (Apache Polaris removed — egret embeds lakekeeper in-process as the Iceberg
  # REST catalog. See docs/en/specs/2026-07-02-egret-embedded-catalog-design.md.)

  # Optional: serve the production-built frontend via nginx.
  # Primary dev path is `npm run dev` (Vite) + `cargo run -p egret-bin -- serve`.
  # Note: the Egret backend is not containerized in this compose yet, so /api
  # requests will not resolve. Use this service for static-build smoke tests only.
  frontend:
    build: ../frontend
    ports:
      - "5173:80"
    depends_on:
      - postgres

volumes:
  pgdata:
  rustfsdata:
