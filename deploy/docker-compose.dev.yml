name: egret-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: egret
      POSTGRES_PASSWORD: egret
      POSTGRES_DB: egret
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egret"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  # The shared limiter + response cache store (SP4d Task 8). Valkey rather than Redis:
  # same protocol, same client, BSD licence, and it is what `deploy/helm/egret` runs, so
  # a dev stack exercises the same server a deployment gets — the same choice CI made.
  #
  # It is here because `just check` REQUIRES it, exactly as it requires the Postgres above.
  # Before this, `check` left the store axis undecided: the workspace run ended
  # `0 passed; 14 failed` on `crates/egret-dataapi/tests/serving_shared_store.rs` and the
  # panic's remedy text told the reader to export `EGRET_ALLOW_STORE_SKIP=1`, after which
  # every `check` on that machine skipped all fourteen silently. The cheapest fix to that
  # is to make the service present, not to make the gate optional.
  #
  # 6399, not 6379: it is the port the suite's own panic message names, the port every plan
  # doc in `docs/en/plans/` exports, and it stays clear of a system Redis on the default.
  # No volume — the limiter and the cache are both reconstructible by definition, and a
  # store that survives a restart would let one test run's keys reach the next.
  valkey:
    image: valkey/valkey:8
    ports:
      - "6399:6379"
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    # Not MinIO: its public images were withdrawn (docker.io and quay.io answer 401). egret
    # needs STS AssumeRole from this server — the embedded catalog vends credentials through it.
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: egret
      RUSTFS_SECRET_KEY: egretsecret
    ports:
      - "9000:9000"   # S3 API; readiness is GET /health
      - "9001:9001"   # console
    # A new volume, not the old `miniodata`: RustFS cannot read MinIO's on-disk format.
    volumes:
      - rustfsdata:/data

  trino:
    image: trinodb/trino:483@sha256:db58cc93e593a2706553745f276bb119c9810e69918be56ecde088ba7ccb0534
    ports:
      - "8090:8080"
      - "8453:8443"   # F2-P5: HTTPS (JWT auth is only ENFORCED over TLS)
    volumes:
      - ./trino/catalog:/etc/trino/catalog
      # F2-P3/P5: JWT auth + group ACL over HTTPS. JWT is only enforced over TLS
      # (see trino/etc/README.md); dev uses a self-signed keystore.
      - ./trino/etc/config.properties:/etc/trino/config.properties
      - ./trino/etc/access-control.properties:/etc/trino/access-control.properties
      - ./trino/etc/rules.json:/etc/trino/rules.json
      - ./trino/etc/trino-keystore.p12:/etc/trino/trino-keystore.p12

  starrocks:
    image: starrocks/allin1-ubuntu:4.1.6@sha256:5cbf09c4c788d2ca41a8e38599b650f04dbc6af0de51ebda0952770fb8333e5d
    ports:
      - "9030:9030"   # MySQL protocol (query)
      - "8030:8030"   # FE HTTP
    healthcheck:
      test: ["CMD-SHELL", "mysql -h127.0.0.1 -P9030 -uroot -e 'select 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    volumes:
      # Ranger authorization plugin config (dev). FE conf-dir path confirmed
      # against a real `starrocks/allin1-ubuntu:latest` container (`find / -name
      # fe.conf` -> /data/deploy/starrocks/fe/conf/fe.conf, which is on the FE's
      # CLASSPATH per fe/bin/start_fe.sh) — see deploy/starrocks/README.md.
      #
      # egret's /ranger surface requires an engine credential by default
      # (`ranger.auth_mode = required`), and this hand-written XML carries none,
      # so this FE's policy download is refused (401) as is. Either register
      # this StarRocks as an external engine bound to the `sr1` profile
      # (POST /api/control-plane/engines/external returns its credential once)
      # and add `ranger.plugin.starrocks.policy.rest.client.username` /
      # `.password` properties with it to the XML, or run the host egret with
      # EGRET_RANGER__AUTH_MODE=anonymous for local development only.
      - ./starrocks/ranger/ranger-starrocks-security.xml:/data/deploy/starrocks/fe/conf/ranger-starrocks-security.xml:ro
      - ./starrocks/ranger/ranger-starrocks-audit.xml:/data/deploy/starrocks/fe/conf/ranger-starrocks-audit.xml:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro

  # (Apache Polaris removed — egret embeds lakekeeper in-process as the Iceberg
  # REST catalog. See docs/en/specs/2026-07-02-egret-embedded-catalog-design.md.)

  # Optional: serve the production-built frontend via nginx.
  # Primary dev path is `npm run dev` (Vite) + `cargo run -p egret-bin -- serve`.
  # Note: the Egret backend is not containerized in this compose yet, so /api
  # requests will not resolve. Use this service for static-build smoke tests only.
  frontend:
    build: ../frontend
    ports:
      - "5173:80"
    depends_on:
      - postgres

volumes:
  pgdata:
  rustfsdata:
