# =============================================================================
# DEV-ONLY Trino coordinator config — JWT auth against Keycloak (egret realm).
#
# Several details are intentionally provisional and will be reconciled when
# the live Keycloak + Trino stack is first brought up in F2-P5:
#
#   * JWKS URL host/port: compose service DNS is `keycloak:8080` (used here);
#     if Trino contacts Keycloak through the host instead, change to
#     `localhost:8081` (the host-mapped port).
#
#   * required-audience: set to `trino`; the actual client_id configured in
#     the Keycloak realm must match.  Adjust in P5 after realm import is
#     validated.
#
#   * internal-communication.shared-secret: when authentication is enabled,
#     trinodb/trino:latest requires a shared secret for internal cluster
#     communication even on a single-node coordinator.  The value below is a
#     dev placeholder; replace with a secure random string before any
#     non-local environment.
#
#   * allow-insecure-over-http: MUST be removed (or set false) in any
#     environment with real certificates.  Dev-only override.
#
# Do NOT use this file in staging/production.
# =============================================================================

coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# OIDC JWT authentication against Keycloak (JWKS auto-discovered from issuer).
http-server.authentication.type=JWT
http-server.authentication.jwt.key-file=http://keycloak:8080/realms/egret/protocol/openid-connect/certs
http-server.authentication.jwt.required-audience=trino
http-server.authentication.jwt.principal-field=sub

# Dev stack is plain HTTP; JWT auth normally requires HTTPS.
http-server.authentication.allow-insecure-over-http=true
http-server.process-forwarded=true

# Required when authentication is enabled on a trinodb/trino image even for
# a single-node coordinator (intra-node HTTP calls authenticate too).
# P5: replace with a strong random secret or inject via environment.
internal-communication.shared-secret=egret-dev-shared-secret
