map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name localhost;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 500m;

    # X-FORWARDED-FOR IS OVERWRITTEN, NEVER APPENDED, IN EVERY PROXY BLOCK BELOW.
    #
    # `$remote_addr` (overwrite), not `$proxy_add_x_forwarded_for` (append) —
    # the same posture ingress-nginx takes by default, and for the same reason.
    # The backend's rate limiter keys on the FIRST hop of X-Forwarded-For
    # (`egret-core`'s `client_ip`), so appending hands the caller the limiter's
    # key: with `$proxy_add_x_forwarded_for`, a client-supplied header becomes
    # hop one. Measured through the frontend pod before this change: 60
    # `POST /oauth/token` with a fixed spoofed X-Forwarded-For reached 429, then
    # one header edit with the SAME client_id was allowed again — a full fresh
    # budget on demand. `location /api/` carries the same line, so the login
    # limiter (5 attempts / 300s, the thing standing in front of password
    # guessing) was defeated identically.
    #
    # THE TRADE-OFF: if something ELSE fronts this nginx — a cloud LB, a CDN,
    # another reverse proxy — the real client IP is lost and every caller behind
    # it shares one limiter bucket. That is over-limiting, never under-limiting:
    # the safe direction, and why it is the right default. Appending is the
    # unsafe direction because it is unconditional trust in an unauthenticated
    # header.
    #
    # Trusting an upstream proxy is OPT-IN, not a return to appending: enable
    # nginx's `real_ip` module and name the upstream explicitly —
    #
    #     set_real_ip_from 10.0.0.0/8;   # the upstream's addresses, nothing wider
    #     real_ip_header X-Forwarded-For;
    #     real_ip_recursive on;
    #
    # which makes `$remote_addr` itself the client address, so the lines below
    # keep working unchanged and the trust stays pinned to a named source.

    # API proxy to backend
    # NOTE: In the dev compose stack the Egret backend is not yet containerized;
    # for a local static-build smoke test, traffic to /api will not reach a
    # running backend. In a production or full-stack compose setup, point this
    # to the backend service, e.g. http://egret:8080.
    location /api/ {
        proxy_pass http://egret:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 3600s;
    }

    # Data API machine traffic: an outside consumer fetches a token at
    # /oauth/token and calls the published endpoint at /data-api/v1/{ws}/{path}.
    #
    # DELIBERATE DUPLICATION: the Helm ingress routes both prefixes straight to
    # the backend Service, so in the kind/k8s deployment these blocks never see
    # traffic. They exist for deployments that front EVERYTHING with this SPA
    # server (the compose stack, a single-container image) — there the ingress
    # rules do not exist and without these the SPA catch-all below answers a
    # machine with 200 text/html, which is exactly the defect this fixes.
    location /data-api/ {
        proxy_pass http://egret:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 3600s;
    }

    location /oauth/ {
        proxy_pass http://egret:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # The Ranger plugin surface (`/ranger/service/...`), polled by engines with
    # a Basic engine credential. Same DELIBERATE DUPLICATION as the blocks
    # above: the Helm ingress routes /ranger itself; this is for deployments
    # that front everything with this SPA server, where the catch-all would
    # otherwise answer an engine's plugin with 200 text/html.
    location /ranger/ {
        proxy_pass http://egret:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Embedded lakekeeper Iceberg REST catalog (nested at /catalog/v1 by the
    # backend). The warehouse detail page tells the user to paste
    # `{origin}/catalog` into Spark and Trino, so this has to reach the backend.
    # Same DELIBERATE DUPLICATION as the two blocks above: the Helm ingress
    # already routes this prefix, so in kind/k8s this block never sees traffic;
    # it is here for deployments that front everything with this SPA server.
    #
    # BARE `/catalog` NEEDS ITS OWN `=` BLOCK. The ingress rule is
    # `pathType: Prefix`, which matches on path ELEMENTS: it covers `/catalog`
    # and `/catalog/...` alike, so the exact base URI the warehouse page hands
    # the user reaches the backend and answers 404. A bare `location /catalog/`
    # here does not match `/catalog`, which would fall through to the SPA
    # catch-all and answer 200 text/html — the two deployments then give a
    # client probing the base URI different answers. Kept as `=` plus the
    # prefix rather than a bare `location /catalog` so that `/catalogue` and
    # friends are NOT captured, matching Prefix's element-boundary semantics.
    location = /catalog {
        proxy_pass http://egret:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 3600s;
    }

    location /catalog/ {
        proxy_pass http://egret:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization $http_authorization;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 3600s;
    }

    # The machine-IdP's two discovery documents. EXACT-match locations (`=`), not
    # a `/.well-known/` prefix: ACME http-01 challenges, security.txt and
    # anything else under /.well-known must keep falling through to the SPA
    # catch-all. `=` locations are also matched before the regex block below, so
    # the .json suffix cannot be captured by the static-asset rule.
    #
    # LIMITATION — this does NOT make external OIDC discovery work. The
    # document's `issuer`, `token_endpoint` and `jwks_uri` are built from the
    # in-cluster issuer (egret-machine-idp `discovery()`), and OIDC requires the
    # document's `issuer` to equal both the `iss` of the minted tokens and the
    # URL the document was fetched from. A client discovering against the
    # external host now gets JSON it correctly rejects instead of HTML it cannot
    # parse — an improvement in honesty, not a working discovery flow. Closing
    # that needs the issuer itself to become externally reachable, which is
    # deliberately out of scope.
    #
    # /.well-known/jwks.json is the one genuinely correct served externally: a
    # key set carries no issuer semantics.
    location = /.well-known/openid-configuration {
        proxy_pass http://egret:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location = /.well-known/jwks.json {
        proxy_pass http://egret:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Static assets caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|ttc|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # SPA routing — serve index.html for all non-asset routes
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;

        # WHERE EXECUTABLE CODE MAY COME FROM. `script-src 'self'` is the directive that makes
        # a runtime fetch of third-party JavaScript fail instead of run. It exists because we
        # had one: `@monaco-editor/loader` defaults to `https://cdn.jsdelivr.net/npm/...` and
        # fetched 12 files from it on every page with an editor until the loader was pointed at
        # our own bundle. That fix is a line of TypeScript a refactor can undo; this line is
        # what stops the next one, from any dependency, silently.
        #
        # Measured against the BUILT `dist` served under this exact header, page by page: every
        # script and every worker comes from our origin, so `'self'` is the whole list. Measured
        # the other way round too — with the header off, a `<script src=cdn.jsdelivr.net/...>`
        # appended at runtime loads and defines `window.require`; with it on, the browser blocks
        # it as a `script-src-elem` violation and `require` stays undefined.
        #
        # NO `'unsafe-inline'` AND NO `'unsafe-eval'`, and both are load-bearing absences: with
        # either one present this directive stops being a defence against injected code.
        #   - inline: `dist/index.html` carries no inline <script>; Vite emits a module tag.
        #     `scripts/assert-csp-allows-entry.mjs` fails the build if that ever changes, because
        #     the symptom otherwise is a blank page in production and a green test suite.
        #   - eval: no bundle calls `eval()`. The three `Function(...)` sites in the bundle
        #     (echarts' JSON fallback, plotly's `function-bind` and `is-generator-function`
        #     shims) are all guarded by a modern-browser check or a try/catch, so none runs.
        #
        # `worker-src` IS NOT OPTIONAL HERE. Absent, it falls back to `script-src`, which forbids
        # `blob:` — and two shipped features build a worker from `URL.createObjectURL(new Blob(
        # [...]))`. Both were measured against this build, serving the same `dist` twice and
        # changing only this token:
        #   - `.xlsx` export. write-excel-file zips through fflate's ASYNC `zip()`
        #     (`modules/zip/zipToArrayBuffer.js`), which spawns a blob worker — but only once a
        #     member of the archive passes ~160KB; below that it silently takes fflate's
        #     synchronous path. A 1-row sheet therefore exports fine WITHOUT `blob:` and a
        #     6000-row one hangs forever, its promise never settling. A small-file check would
        #     have signed off on the broken policy.
        #   - plotly map traces. Its bundled maplibre/mapbox sets `workerUrl` to a blob URL; a
        #     `scattermap` trace in notebook output never resolves `newPlot` without `blob:`.
        # Monaco's own editor worker is a plain same-origin URL (`/assets/editor.worker-*.js`),
        # so `'self'` covers that one.
        #
        # `object-src 'none'` and `base-uri 'self'` close the two ways script provenance can be
        # subverted around `script-src`: a plugin document, and a <base> that re-points every
        # relative script URL. The app has neither <object>/<embed> nor <base>.
        #
        # Still deliberately NOT a full policy: there is no default-src, so styles, fonts,
        # images and connections stay unconstrained. Getting those wrong breaks the app in
        # production in ways the test suite cannot see, and they are not what this is for.
        #
        # The BROWSER half of the iframe card's host allow-list. The client guard in
        # components/chart/dashboard/iframe-url.ts is the other half; a test pins the two
        # together, so adding a host there and forgetting this line fails the suite.
        # THE APPS ORIGIN MAY BE FRAMED, and only by this page. The app editor is an iframe on a
        # sibling origin (`apps.<host>`, spec §6.1); without it in `frame-src` the browser refuses the
        # frame and the editor is a blank box — found only by running it, no unit test sees a CSP.
        # `${APPS_ORIGIN}` is filled in by the nginx image at container start (the Dockerfile ships
        # this file as a template and restricts substitution to `APPS_*`, so nginx's own `$uri`
        # etc. are untouched); the chart sets it from `apps.origin`. Empty = no apps origin, and the
        # directive is exactly the iframe card's allow-list as before.
        add_header Content-Security-Policy "script-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-src https://youtube.com https://*.youtube.com https://youtu.be https://*.youtu.be https://loom.com https://*.loom.com https://vimeo.com https://*.vimeo.com https://docs.google.com https://*.docs.google.com https://calendar.google.com https://*.calendar.google.com https://airtable.com https://*.airtable.com https://typeform.com https://*.typeform.com https://canva.com https://*.canva.com https://codepen.io https://*.codepen.io https://figma.com https://*.figma.com https://grafana.com https://*.grafana.com https://miro.com https://*.miro.com https://excalidraw.com https://*.excalidraw.com https://notion.com https://*.notion.com https://atlassian.com https://*.atlassian.com https://trello.com https://*.trello.com https://asana.com https://*.asana.com https://gist.github.com https://*.gist.github.com https://linkedin.com https://*.linkedin.com https://twitter.com https://*.twitter.com https://x.com https://*.x.com ${APPS_ORIGIN};" always;
    }
}
