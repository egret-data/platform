[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
egret-core = { path = "crates/egret-core" }
egret-config = { path = "crates/egret-config" }
egret-metastore = { path = "crates/egret-metastore" }
egret-server = { path = "crates/egret-server" }
egret-auth = { path = "crates/egret-auth" }
egret-workspace = { path = "crates/egret-workspace" }
egret-storage = { path = "crates/egret-storage" }
egret-iceberg-ext = { path = "crates/egret-iceberg-ext" }
egret-catalog-api = { path = "crates/egret-catalog-api" }
egret-catalog-engine = { path = "crates/egret-catalog-engine" }
egret-controlplane = { path = "crates/egret-controlplane" }
egret-policy-api = { path = "crates/egret-policy-api" }
egret-policy = { path = "crates/egret-policy" }
egret-secrets = { path = "crates/egret-secrets" }
egret-query-api = { path = "crates/egret-query-api" }
egret-query = { path = "crates/egret-query" }
egret-bi = { path = "crates/egret-bi" }
egret-analytics-api = { path = "crates/egret-analytics-api" }
egret-automation-api = { path = "crates/egret-automation-api" }
egret-automation = { path = "crates/egret-automation" }
egret-notebook = { path = "crates/egret-notebook" }
egret-kernel = { path = "crates/egret-kernel" }
egret-orchestrator = { path = "crates/egret-orchestrator" }
egret-engine-mgmt-api = { path = "crates/egret-engine-mgmt-api" }
egret-engine-mgmt = { path = "crates/egret-engine-mgmt" }
egret-events = { path = "crates/egret-events" }
egret-audit = { path = "crates/egret-audit" }

# Iceberg model — pin the lakekeeper fork/rev so the TableMetadataBuilder /
# TableUpdate::apply / TableRequirement::check API matches the reference exactly.
iceberg = { git = "https://github.com/lakekeeper/iceberg-rust.git", rev = "bb7017339f778de44830b4f970d9d5e1e84f5599" }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1.2" }
aws-sdk-s3 = { version = "1.121", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = { version = "1.2" }
url = { version = "2", features = ["serde"] }
http = "1"
typed-builder = "0.20"
# OpenAPI emit (E0·P4): per-crate `#[derive(OpenApi)]` + `ToSchema`, merged in
# egret-server. utoipa 5 emits OpenAPI 3.1. `preserve_order` keeps property order
# stable across emits so the committed `openapi.json` diff stays minimal.
utoipa = { version = "5", features = ["uuid", "chrono", "preserve_order"] }
# Swagger-UI axum integration (utoipa 5 → utoipa-swagger-ui 9, axum 0.8). Declared
# here so P4b can opt a UI in with one line; the JSON endpoint is the deliverable.
utoipa-swagger-ui = { version = "9", features = ["axum"] }

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = "0.26"
futures-util = "0.3"
futures-channel = "0.3"
bytes = "1"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
# sqlx 0.9, the same major the git-pinned lakekeeper is on. Holding the workspace
# at 0.8 is what forced egret-catalog-engine to carry BOTH majors side by side
# (a `sqlx08` alias next to `sqlx`), because `Pool<Postgres>` from two majors are
# unrelated types that cannot cross a crate boundary. 0.9 split the old combined
# `runtime-tokio-rustls` feature into `runtime-tokio` + `tls-rustls`.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# Cron parsing for automation schedules (P1). `croner` speaks the standard
# 5-field crontab users type (and that Superset accepts); the older `cron` crate
# requires a leading seconds field, which would silently reinterpret every
# expression a user pastes in. `chrono-tz` resolves the IANA zone a schedule is
# expressed in, so "09:00 Asia/Ho_Chi_Minh" survives DST rather than drifting.
croner = "2"
chrono-tz = "0.10"
# SMTP for alert/report email (P3). rustls to match the rest of the workspace's
# TLS stack, so there is one certificate story rather than two.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname", "ring"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
# `cookie-private` moves onto the workspace entry: egret-auth and egret-bin used
# to declare their own `axum-extra = "0.10"` WITH this feature, which is both why
# a second axum-extra stayed in the tree and why egret-workspace compiled at all —
# it takes the workspace entry (cookie only) and got `cookie::Key` by feature
# unification from its siblings. 0.12 gates `Key` behind cookie-signed/-private,
# so `PrivateCookieJar` needs it named here, once.
axum-extra = { version = "0.12", features = ["cookie", "cookie-private"] }
async-trait = "0.1"
openidconnect = "4"
# 10.x, not the newest 11: 10.4 is what lakekeeper's `limes` (and gcloud-auth,
# jwks_client_rs) resolve to, so this is the version that leaves ONE jsonwebtoken
# in the tree. 11 would reintroduce the duplicate it is here to remove.
jsonwebtoken = "10"
rsa = { version = "0.9", features = ["sha2"] }
egret-machine-idp = { path = "crates/egret-machine-idp" }
# Held at 0.12 — NOT stale. `openidconnect` implements `AsyncHttpClient` for
# reqwest 0.12's `Client` specifically, and every published openidconnect
# (through 4.0.1, the newest) depends on `reqwest ^0.12`. On 0.13 the OIDC
# discovery and code-exchange calls in egret-auth/src/oidc.rs stop compiling.
#
# This is why reqwest 0.12 and 0.13 both appear in the tree: lakekeeper's
# `gcloud-metadata` is on 0.13 and we cannot follow it until openidconnect does.
# Revisit when openidconnect ships a reqwest-0.13 release.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
mysql_async = { version = "0.34", default-features = false, features = ["default-rustls"] }
testcontainers = "0.23"
# kube 2 / k8s-openapi 0.26 — the versions lakekeeper's `limes` already pulls in,
# so the tree holds one of each instead of two. (kube 4 is newer still, but limes
# is git-pinned to 2, so following `latest` would put the duplicate straight back.)
kube = { version = "2", features = ["client", "runtime", "derive", "ws"] }
# `v1_32` rather than `latest`. k8s-openapi's build script refuses to run with two
# Kubernetes-version features enabled, and `limes` enables `v1_32` — `latest` on
# 0.26 means v1_34, so the two unify into a hard build failure. Pinning v1_32 is
# also a no-op for the API we compile against: `latest` on the previous
# k8s-openapi 0.24 WAS v1_32, that being the newest it supported.
k8s-openapi = { version = "0.26", features = ["v1_32"] }
cedar-policy = "4.11.2"
arc-swap = "1"
rcgen = { version = "0.13", default-features = false, features = ["pem", "crypto", "ring"] }

# Vendored mysql_async: patched to support StarRocks' JWT/OIDC auth-switch
# (`authentication_openid_connect_client`). See third_party/mysql_async.
[patch.crates-io]
mysql_async = { path = "third_party/mysql_async" }

[profile.dev]
opt-level = 0
# Slim debuginfo so linking the workspace's many test binaries doesn't exhaust the
# CI runner's memory (`ld ... signal 7 [Bus error]`). Keeps line-table backtraces.
debug = "line-tables-only"
