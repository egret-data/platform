[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
egret-core = { path = "crates/egret-core" }
egret-config = { path = "crates/egret-config" }
egret-metastore = { path = "crates/egret-metastore" }
egret-server = { path = "crates/egret-server" }
egret-auth = { path = "crates/egret-auth" }
egret-workspace = { path = "crates/egret-workspace" }
egret-storage = { path = "crates/egret-storage" }
egret-iceberg-ext = { path = "crates/egret-iceberg-ext" }
egret-catalog-api = { path = "crates/egret-catalog-api" }
egret-catalog-engine = { path = "crates/egret-catalog-engine" }
egret-catalog-registry = { path = "crates/egret-catalog-registry" }
egret-controlplane = { path = "crates/egret-controlplane" }
egret-policy-api = { path = "crates/egret-policy-api" }
egret-policy = { path = "crates/egret-policy" }
egret-perm = { path = "crates/egret-perm" }
egret-perm-compile = { path = "crates/egret-perm-compile" }
egret-ranger-eval = { path = "crates/egret-ranger-eval" }
egret-secrets = { path = "crates/egret-secrets" }
egret-query-api = { path = "crates/egret-query-api" }
egret-query = { path = "crates/egret-query" }
egret-bi = { path = "crates/egret-bi" }
egret-analytics-api = { path = "crates/egret-analytics-api" }
egret-automation-api = { path = "crates/egret-automation-api" }
egret-automation = { path = "crates/egret-automation" }
egret-workflow-api = { path = "crates/egret-workflow-api" }
egret-workflow = { path = "crates/egret-workflow" }
egret-provisioner = { path = "crates/egret-provisioner" }
egret-engine-mgmt-api = { path = "crates/egret-engine-mgmt-api" }
egret-engine-mgmt = { path = "crates/egret-engine-mgmt" }
egret-events = { path = "crates/egret-events" }
egret-audit = { path = "crates/egret-audit" }
egret-dataapi-api = { path = "crates/egret-dataapi-api" }
egret-dataapi = { path = "crates/egret-dataapi" }
egret-apps = { path = "crates/egret-apps" }
# Test-only: one private, already-migrated Postgres per test process. A
# dev-dependency of every crate whose tests talk to a database; never linked
# into a shipped binary.
egret-test-db = { path = "crates/egret-test-db" }

# Iceberg model — pin the lakekeeper fork/rev so the TableMetadataBuilder /
# TableUpdate::apply / TableRequirement::check API matches the reference exactly.
iceberg = { git = "https://github.com/lakekeeper/iceberg-rust.git", rev = "bb7017339f778de44830b4f970d9d5e1e84f5599" }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1.2" }
aws-sdk-s3 = { version = "1.121", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = { version = "1.2" }
url = { version = "2", features = ["serde"] }
http = "1"
typed-builder = "0.23"
# OpenAPI emit (E0·P4): per-crate `#[derive(OpenApi)]` + `ToSchema`, merged in
# egret-server. utoipa 5 emits OpenAPI 3.1. `preserve_order` keeps property order
# stable across emits so the committed `openapi.json` diff stays minimal.
utoipa = { version = "5", features = ["uuid", "chrono", "preserve_order"] }
# Swagger-UI axum integration (utoipa 5 → utoipa-swagger-ui 9, axum 0.8). Declared
# here so P4b can opt a UI in with one line; the JSON endpoint is the deliverable.
utoipa-swagger-ui = { version = "9", features = ["axum"] }

tokio = { version = "1", features = ["full"] }
# `libc::atexit` — used only by `egret-test-db`, to drop a test process's
# private database as the process exits.
libc = "0.2"
tokio-util = "0.7"
tokio-tungstenite = "0.30"
futures-util = "0.3"
futures-channel = "0.3"
bytes = "1"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
# 0.6, not the newer 0.7: lakekeeper, kube-client, axum-prometheus and reqwest are
# all on 0.6, so 0.7 buys a second tower-http and nothing else.
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
thiserror = "2"
anyhow = "1"
# sqlx 0.9, the same major the git-pinned lakekeeper is on. Holding the workspace
# at 0.8 is what forced egret-catalog-engine to carry BOTH majors side by side
# (a `sqlx08` alias next to `sqlx`), because `Pool<Postgres>` from two majors are
# unrelated types that cannot cross a crate boundary. 0.9 split the old combined
# `runtime-tokio-rustls` feature into `runtime-tokio` + `tls-rustls`.
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# SQL parser for the Data Apps read-only gate (egret-apps). Pinned: the gate matches
# on AST variants, so an upgrade must re-run egret-apps' readonly tests.
sqlparser = { version = "=0.63.0", features = ["visitor"] }
# Cron parsing for automation schedules (P1). `croner` speaks the standard
# 5-field crontab users type (and that Superset accepts); the older `cron` crate
# requires a leading seconds field, which would silently reinterpret every
# expression a user pastes in. `chrono-tz` resolves the IANA zone a schedule is
# expressed in, so "09:00 Asia/Ho_Chi_Minh" survives DST rather than drifting.
croner = "3"
chrono-tz = "0.10"
# SMTP for alert/report email (P3). rustls to match the rest of the workspace's
# TLS stack, so there is one certificate story rather than two.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-rustls-tls", "builder", "hostname", "ring"] }
argon2 = "0.5"
# 0.10, not 0.11. The 0.10 line is held by `cookie 0.18` (which axum-extra pulls)
# and by the git-pinned `iceberg` fork — neither ours to move — so 0.11 duplicates
# the whole RustCrypto cipher stack (aead, aes, cipher, ctr, ghash, inout, polyval,
# universal-hash) for no dedup at all.
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
# C1: ParamSpec::pattern (egret-dataapi-api) and its enforcement in
# egret-dataapi's publish-time check_constraints. Already resolved at 1.13.1
# as a transitive dependency, so this adds no new compilation.
regex = "1.13"
# Package 5: `pattern_confines_to_safe_alphabet` in egret-dataapi's
# `lifecycle.rs` decides whether an author's `pattern` can accept a character
# that is unsafe in SQL TEXT. That is a question about the pattern's LANGUAGE,
# not about any one value, so it needs the parsed HIR that `regex` itself is
# built on rather than a `Regex` (which can only be asked about strings).
#
# `regex` 1.13 depends on exactly this version, so it is already compiled and
# already in the lock file: naming it here adds a direct edge, not a build.
#
# **These two must resolve to ONE copy each**, and nothing in cargo's
# resolution says so: they are independent carets, and a `regex` bump onto a
# new `regex-syntax` minor would give the workspace two parsers — the gate
# reading one language while the matcher enforces another, silently, with every
# test green. `egret-dataapi`'s `regex_and_regex_syntax_resolve_to_one_parser`
# asserts the count in `Cargo.lock`, so bump them together.
regex-syntax = "0.8"
# C2: the response-transform evaluator (egret-dataapi's `transform`). Two-component
# per this manifest's convention, which for a 0.x crate IS a minor pin — cargo's
# compatibility range for `0.14` is `>=0.14.0, <0.15.0`, so the build is
# reproducible without a third component freezing patch fixes.
#
# Chosen for a property no allow-list can give: Starlark has no `import`, no
# filesystem, no clock and no randomness IN THE LANGUAGE. `db`, `http`, `tx` and
# `cache` are not reachable because there is nothing to reach them WITH — see
# `transform.rs`, whose first test pins exactly that.
starlark = "0.14"
# The Data API's endpoint-SQL renderer (P4.5). `default-features = false` with an
# explicit list: `macros` and `multi_template` are dropped so `{% macro %}`,
# `{% call %}`, `{% include %}` and `{% extends %}` do not parse at all, and
# `fuel` is named because it is NOT default-on. `json`, `urlencode`,
# `custom_syntax`, `loop_controls` and `unstable_machinery` stay off — leaving
# `custom_syntax` off also means no template author can change the `{{ }}`
# delimiters out from under the renderer.
# **Pinned EXACTLY, not caret.** `crates/egret-workflow/oracle/name-surface.txt`
# is a fixture over the names minijinja binds by DEFAULT, and
# `runners::env::the_built_in_surface_matches_the_engines` checks egret's
# surface against it. A caret range lets a minor release add a default filter
# or test, which would silently re-open the over-acceptance that fixture exists
# to close -- minijinja exposes no way to enumerate filters or tests at
# runtime, so nothing else could notice. Bumping this means re-deriving
# `MINIJINJA_DEFAULT_FILTERS`/`_TESTS` from the new version's `defaults.rs`.
minijinja = { version = "=2.24.0", default-features = false, features = [
    "builtins",
    "serde",
    "deserialization",
    "std_collections",
    "debug",
    "fuel",
] }
# `cookie-private` moves onto the workspace entry: egret-auth and egret-bin used
# to declare their own `axum-extra = "0.10"` WITH this feature, which is both why
# a second axum-extra stayed in the tree and why egret-workspace compiled at all —
# it takes the workspace entry (cookie only) and got `cookie::Key` by feature
# unification from its siblings. 0.12 gates `Key` behind cookie-signed/-private,
# so `PrivateCookieJar` needs it named here, once.
axum-extra = { version = "0.12", features = ["cookie", "cookie-private"] }
async-trait = "0.1"
openidconnect = "4"
# 10.x, not the newest 11: 10.4 is what lakekeeper's `limes` (and gcloud-auth,
# jwks_client_rs) resolve to, so this is the version that leaves ONE jsonwebtoken
# in the tree. 11 would reintroduce the duplicate it is here to remove.
jsonwebtoken = "10"
rsa = { version = "0.9", features = ["sha2"] }
egret-machine-idp = { path = "crates/egret-machine-idp" }
# Held at 0.12 — NOT stale. `openidconnect` implements `AsyncHttpClient` for
# reqwest 0.12's `Client` specifically, and every published openidconnect
# (through 4.0.1, the newest) depends on `reqwest ^0.12`. On 0.13 the OIDC
# discovery and code-exchange calls in egret-auth/src/oidc.rs stop compiling.
#
# This is why reqwest 0.12 and 0.13 both appear in the tree: lakekeeper's
# `gcloud-metadata` is on 0.13 and we cannot follow it until openidconnect does.
# Revisit when openidconnect ships a reqwest-0.13 release.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
# `default-rustls-ring`, not `default-rustls`: 0.37 redefined the latter to pull
# aws-lc-rs, and this workspace is ring-only. 0.37's feature set is also leaner
# than 0.34's `default-rustls` — no bigdecimal/rust_decimal/time/frunk/binlog —
# which costs nothing here: the StarRocks connector decodes rows through
# `ColumnType` + `Value::Bytes` and never names those types.
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
testcontainers = "0.28"
# kube 2 / k8s-openapi 0.26 — the versions lakekeeper's `limes` already pulls in,
# so the tree holds one of each instead of two. (kube 4 is newer still, but limes
# is git-pinned to 2, so following `latest` would put the duplicate straight back.)
kube = { version = "2", features = ["client", "runtime", "derive", "ws"] }
# `v1_32` rather than `latest`. k8s-openapi's build script refuses to run with two
# Kubernetes-version features enabled, and `limes` enables `v1_32` — `latest` on
# 0.26 means v1_34, so the two unify into a hard build failure. Pinning v1_32 is
# also a no-op for the API we compile against: `latest` on the previous
# k8s-openapi 0.24 WAS v1_32, that being the newest it supported.
k8s-openapi = { version = "0.26", features = ["v1_32"] }
cedar-policy = "4.12"
arc-swap = "1"
# Metrics (Package 2). The FACADE (`metrics`) is what instrumented crates depend
# on: `counter!`/`histogram!` are no-ops until a recorder is installed, so a
# library crate never has to know whether one is. `metrics-exporter-prometheus`
# is the recorder + text renderer behind `GET /metrics`, and only `egret-server`
# (which owns the route) and `egret-bin` (which owns process startup) name it.
#
# Both versions are the ones the tree ALREADY resolves: lakekeeper's
# `axum-prometheus 0.9` pulls `metrics 0.24` and `metrics-exporter-prometheus
# 0.17`, so these entries add no package to `Cargo.lock` and no compilation unit
# to the build. That is why this library was chosen over `prometheus` /
# `prometheus-client` / `opentelemetry`, each of which would have introduced a
# second, parallel metrics stack into a dependency graph that already carries
# pins it cannot move.
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.17", default-features = false }
rcgen = { version = "0.14", default-features = false, features = ["pem", "crypto", "ring"] }
# Package 4: the SHARED limiter/cache store behind `egret-dataapi`'s
# `RateLimitStore` and `ResponseStore` seams.
#
# Chosen over `fred` and over a `deadpool-redis`/`bb8-redis` pool for one
# measured reason: with `default-features = false` and only `script`,
# `tokio-comp` and `connection-manager` it adds exactly THREE packages to
# `Cargo.lock` — `redis`, `combine`, `arcstr` — and `connection-manager` is
# itself a reconnecting, multiplexed connection, so no second pooling crate
# joins the tree either.
#
# `script` is load-bearing, not a convenience: the token bucket is a Lua script,
# because a read-modify-write across a network over-admits under exactly the
# concurrency a limiter exists to bound. `redis::Script` is EVALSHA with an EVAL
# fallback, so the whole check is ONE round trip.
#
# TLS features are deliberately absent. The store is an in-cluster Service, and
# `tls-rustls-comp` would add a second rustls configuration story for a hop that
# never leaves the pod network. Add it with the deployment that needs it.
redis = { version = "1", default-features = false, features = ["script", "tokio-comp", "connection-manager"] }

# Vendored mysql_async: patched to support StarRocks' JWT/OIDC auth-switch
# (`authentication_openid_connect_client`). See third_party/mysql_async.
[patch.crates-io]
mysql_async = { path = "third_party/mysql_async" }

[profile.dev]
opt-level = 0
# Slim debuginfo so linking the workspace's many test binaries doesn't exhaust the
# CI runner's memory (`ld ... signal 7 [Bus error]`). Keeps line-table backtraces.
debug = "line-tables-only"
# macOS defaults to `packed`, which runs `dsymutil` once PER BINARY to gather debug
# info into a .dSYM bundle. This workspace links 163 integration-test binaries across
# 31 crates, and nothing here reads a .dSYM — backtraces come from the line tables
# above. Measured on this repo: rebuilding `egret-dataapi`'s 21 test binaries after
# touching one lib file went from 134s to the figure in the commit message, with the
# `sys` half of the cost being dsymutil's file churn.
split-debuginfo = "unpacked"
