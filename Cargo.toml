[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
egret-core = { path = "crates/egret-core" }
egret-config = { path = "crates/egret-config" }
egret-metastore = { path = "crates/egret-metastore" }
egret-server = { path = "crates/egret-server" }
egret-auth = { path = "crates/egret-auth" }
egret-workspace = { path = "crates/egret-workspace" }

tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
axum-extra = { version = "0.10", features = ["cookie"] }
async-trait = "0.1"
openidconnect = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
testcontainers = "0.23"

[profile.dev]
opt-level = 0
