[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
egret-core = { path = "crates/egret-core" }
egret-config = { path = "crates/egret-config" }
egret-metastore = { path = "crates/egret-metastore" }
egret-server = { path = "crates/egret-server" }
egret-auth = { path = "crates/egret-auth" }
egret-workspace = { path = "crates/egret-workspace" }
egret-storage = { path = "crates/egret-storage" }
egret-catalog = { path = "crates/egret-catalog" }
egret-controlplane = { path = "crates/egret-controlplane" }
egret-authz = { path = "crates/egret-authz" }
egret-ranger = { path = "crates/egret-ranger" }
egret-secrets = { path = "crates/egret-secrets" }
egret-database = { path = "crates/egret-database" }
egret-engine = { path = "crates/egret-engine" }
egret-bi = { path = "crates/egret-bi" }
egret-notebook = { path = "crates/egret-notebook" }
egret-kernel = { path = "crates/egret-kernel" }
egret-polaris = { path = "crates/egret-polaris" }

# Iceberg model — pin the lakekeeper fork/rev so the TableMetadataBuilder /
# TableUpdate::apply / TableRequirement::check API matches the reference exactly.
iceberg = { git = "https://github.com/lakekeeper/iceberg-rust.git", rev = "bb7017339f778de44830b4f970d9d5e1e84f5599" }
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = { version = "1.2" }
aws-sdk-s3 = { version = "1.121", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-sts = { version = "1", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sigv4 = { version = "1.2" }
url = { version = "2", features = ["serde"] }
http = "1"
typed-builder = "0.20"

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = "0.26"
futures-util = "0.3"
futures-channel = "0.3"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "migrate", "uuid", "chrono"] }
figment = { version = "0.10", features = ["toml", "env"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
axum-extra = { version = "0.10", features = ["cookie"] }
async-trait = "0.1"
openidconnect = "4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "cookies"] }
mysql_async = { version = "0.34", default-features = false, features = ["default-rustls"] }
testcontainers = "0.23"

# Vendored mysql_async: patched to support StarRocks' JWT/OIDC auth-switch
# (`authentication_openid_connect_client`). See third_party/mysql_async.
[patch.crates-io]
mysql_async = { path = "third_party/mysql_async" }

[profile.dev]
opt-level = 0
# Slim debuginfo so linking the workspace's many test binaries doesn't exhaust the
# CI runner's memory (`ld ... signal 7 [Bus error]`). Keeps line-table backtraces.
debug = "line-tables-only"
