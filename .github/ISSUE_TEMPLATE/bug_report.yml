name: Bug report
description: Report incorrect behavior, a UI defect, or a crash
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: UI steps, API calls, SQL or configuration needed to reproduce.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Deployment (kind, Kubernetes, docker-compose), query engine (Trino, StarRocks), browser, OS.
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Redact secrets and personal data before pasting.
