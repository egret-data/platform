name: apps-image
on:
  pull_request:
    paths: ["apps-image/**", ".github/workflows/apps-image.yml"]
jobs:
  apps-pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: apps-image } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt -e .
      - run: python -m pytest -q
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -m e2e
  apps-image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: apps-image } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: ./smoke.sh
