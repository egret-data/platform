name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://egret:egret@localhost:5432/egret

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: egret
          POSTGRES_PASSWORD: egret
          POSTGRES_DB: egret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U egret"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # `cargo test --workspace` links 114 integration-test binaries, each pulling in the whole
      # dependency graph, and the debug target directory measures ~12 GB. That does not fit beside
      # the ~26 GB of preinstalled toolchains the image ships, and the linker dies part-way through
      # with `ld terminated with signal 7 [Bus error]` — SIGBUS, not SIGKILL, because rust-lld
      # mmaps its output file and the write cannot be backed once the disk is full. It reads like a
      # compiler crash and is not one.
      #
      # None of these are used by this repo. Removed inline rather than via a third-party action so
      # the reclaim is auditable and adds no supply-chain surface to a job holding a DB password.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      # Prints on failure too, so a future disk exhaustion is a number in the log rather than a
      # mystery SIGBUS — this one cost a full investigation to identify.
      - name: Disk after build
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Nothing else checks `src/api/generated/` against the committed
      # `openapi.json` — that gap shipped three runtime breaks of the same
      # kind: a `ColumnSpec` missing `required`, and twice a client still
      # declaring a field the backend's request body had already dropped
      # (`deny_unknown_fields` refused it, and no test failed). `gen:api` is
      # the npm script, never bare `orval`: it also runs
      # `encode-path-params.mjs`, the codemod that puts back the
      # `encodeURIComponent` orval 8.24 drops from every URL builder.
      - run: npm run gen:api
      - name: Fail if the generated API client drifted from openapi.json
        run: |
          if ! git diff --quiet -- src/api/generated; then
            echo "::error::frontend/src/api/generated is stale relative to openapi.json — run 'npm run gen:api' in frontend/ and commit the result"
            git diff --stat -- src/api/generated
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Asserts the shipped bundle still carries ECharts' LabelManager. It cannot live in `npm test`
      # — vitest does not tree-shake and does not produce `dist/`, so the only place this can fail
      # for the right reason is right here, against the artefact the step above just built. The
      # script's header explains which symbols survive minification and why.
      - run: npm run test:bundle
      # Asserts the .xlsx writer is still in its own chunk and still in some chunk. Same reason as
      # the step above: vitest does not code-split, so this can only fail for the right reason
      # against the artefact `npm run build` just produced.
      - run: npm run test:bundle:xlsx
      # Asserts the built `index.html` is still loadable under the `script-src 'self'` that
      # `nginx-prod.conf` sends: no inline <script>, no cross-origin src. Same reason again —
      # neither vitest nor `vite dev` serves the CSP, so a build that the policy would blank out
      # in production is green everywhere else. `src/lib/__tests__/csp.test.ts` pins the header
      # itself; this pins the artefact against it.
      - run: npm run test:bundle:csp
      # Asserts Monaco is still OUT of the entry chunk. The source-level guards in
      # lib/__tests__/monaco.test.ts match import specifiers, so they miss the one-token
      # regression that matters: `import type * as MonacoNS from "monaco-editor"` losing its
      # `type` is tsc-clean, lint-clean, and puts ~3.8MB back on every page including login.
      # Only a production build can be asked, because neither vitest nor `vite dev` splits.
      - run: npm run test:bundle:monaco
