name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # `egret_test`, not `egret`. The runner's Postgres is ephemeral so either name works
  # here — but `egret` is the DEV database's name, and `#[sqlx::test]` resolves
  # DATABASE_URL through dotenvy unconditionally, so a developer who copies this line
  # points their whole suite at the database their server boots from. CI should model the
  # rule it documents (docs/en/testing/db-gated-tests.md), not the exception to it.
  #
  # This variable is also what keeps CI honest under the fail-closed gate added
  # 2026-08-30: with no DATABASE_URL, `egret_test_db::url()` panics rather than letting
  # every DB-gated suite report `ok` having asserted nothing. Removing it does not make
  # CI skip those tests — it makes CI fail, which is the point.
  DATABASE_URL: postgres://egret:egret@localhost:5432/egret_test
  # Package 4's shared limiter/cache store. Same fail-closed reasoning as the
  # line above and the same consequence: with this unset,
  # `tests/serving_shared_store.rs` panics rather than reporting `ok` for a
  # suite whose entire subject is that serving state is no longer per process.
  # That suite is the only thing standing between "the shared store works" and
  # "the shared store silently fell back to a HashMap", so it may not be
  # optional in CI.
  EGRET_TEST_SHARED_STORE_URL: redis://localhost:6379

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: egret
          POSTGRES_PASSWORD: egret
          POSTGRES_DB: egret_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U egret"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # Package 4. Valkey rather than Redis: same protocol, same client, BSD
      # licence — and it is what the chart runs, so CI exercises the same server
      # a deployment gets.
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # `cargo test --workspace` links 114 integration-test binaries, each pulling in the whole
      # dependency graph, and the debug target directory measures ~12 GB. That does not fit beside
      # the ~26 GB of preinstalled toolchains the image ships, and the linker dies part-way through
      # with `ld terminated with signal 7 [Bus error]` — SIGBUS, not SIGKILL, because rust-lld
      # mmaps its output file and the write cannot be backed once the disk is full. It reads like a
      # compiler crash and is not one.
      #
      # None of these are used by this repo. Removed inline rather than via a third-party action so
      # the reclaim is auditable and adds no supply-chain surface to a job holding a DB password.
      - name: Reclaim runner disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      # `--no-fail-fast` because without it this step reports ONE failure and hides
      # every other. Measured, not supposed: run 33460143378 stopped at
      # `egret-automation --test tick_end_to_end` after 45 of ~114 binaries, so the
      # whole of `egret-controlplane` never ran — and the failure waiting behind it
      # (`catalog_drift`, a false negative in the scanner) had been mislabelled
      # "pre-existing, environmental" for an entire programme because nobody could
      # see past the first red binary. A red run costs longer; a red run that
      # answers one question at a time costs weeks.
      # BEFORE the workspace run, because it is the fast, NAMED version of a
      # failure the workspace run reports as a mystery — and because the
      # command developers actually iterate with cannot see it at all.
      #
      # Cargo unifies features across the packages a build SELECTS. So
      # `cargo test -p egret-workflow` and the shipping binary can compile the
      # same crate against different dependencies. Measured: `starlark` 0.14.2
      # turns on `serde_json/arbitrary_precision`, `egret-dataapi` depends on
      # starlark, and `egret-bin` pulls `egret-dataapi` and `egret-workflow`
      # together — so the feature was ON in everything that ships and OFF in
      # `-p egret-workflow`. That feature changes how serde_json hands numbers
      # to a `Visitor`, every float becoming a one-entry map under a private
      # sentinel key, so egret-workflow rendered
      # `{"$serde_json::private::Number":"1.0"}` where it meant `1.0`. 13 lib
      # tests and both differential-oracle tests were red in the only
      # configuration that ships, while the single-crate command their authors
      # ran all day was green.
      #
      # Selecting `-p egret-bin` alongside is what makes this the SHIPPING
      # resolution rather than some other one; `--lib --test oracle` then
      # limits it to three test binaries, so it costs the dependency build and
      # almost nothing else. `cargo test --workspace` below would also have
      # caught this particular instance — it is not a substitute for this step,
      # because it reports a broken test rather than a moved resolution, and
      # because a drift no current test happens to observe is invisible to it.
      #
      # `crates/egret-workflow/Cargo.toml` now names the feature so the two
      # resolutions agree, and
      # `runners::env::tests::the_arbitrary_precision_sentinel_is_still_spelled_this_way`
      # fails by name if that declaration is ever dropped. This step is what
      # covers the NEXT feature, which will be a different one.
      - name: egret-workflow under the shipping feature resolution
        run: cargo test -p egret-bin -p egret-workflow --lib --test oracle --no-fail-fast
      # `EGRET_ALLOW_ENGINE_SKIP` is the engine axis, and it is typed here rather
      # than assumed: `crates/egret-workflow/tests/sql_starrocks_live.rs` is the
      # only instrument `worker::handlers::sql` has, and it used to self-skip —
      # `7 passed; 0 failed; 0 ignored` in 0.00s with no engine and the same
      # line in 0.88s with one. It fails without an engine now, so this runner,
      # which has no StarRocks, says so in the command that produced the green.
      # `EGRET_ALLOW_DOCKER_SKIP` is a third axis, added by W4 Task 5 for the
      # same reason and typed for the same one:
      # `crates/egret-workflow/tests/container_docker_live.rs` is the only
      # instrument `worker::handlers::{container,python}` have against a real
      # daemon — zero of the 345 corpus flows declare a script or container task
      # type — so it FAILS without one instead of self-skipping. This runner has
      # no daemon with those images pulled, so the green says so in the command.
      # ⚠ **This step's green does NOT cover the two Ranger gates** — the
      # `ranger-differential` job below does. They are in this run (they are
      # workspace tests) and they SELF-SKIP without `EGRET_TEST_RANGER_E2E=1`,
      # reporting `1 passed … 0.00s` each, so their contribution to this green is
      # zero. Whole-branch review, item 0b: a gate that is absent is visibly
      # absent, and a gate that is present and vacuously green is worse, because
      # its presence is the argument against adding another.
      #
      # The RIGHT fix is the one the two steps above already use —
      # `EGRET_ALLOW_ENGINE_SKIP` / `EGRET_ALLOW_DOCKER_SKIP`: fail without the
      # instrument unless an explicit opt-out is typed, so the skip is visible in
      # the command that produced the green. Those two test files were outside the
      # scope of the change that added this comment; inverting them to
      # `EGRET_ALLOW_RANGER_E2E_SKIP` is open item 0b and would let this step
      # carry the flag like the other two axes.
      - name: Test
        run: EGRET_ALLOW_ENGINE_SKIP=1 EGRET_ALLOW_DOCKER_SKIP=1 cargo test --workspace --no-fail-fast
      # Prints on failure too, so a future disk exhaustion is a number in the log rather than a
      # mystery SIGBUS — this one cost a full investigation to identify.
      - name: Disk after build
        if: always()
        run: df -h / && du -sh target 2>/dev/null || true

  # The two gates whose other side is Apache Ranger itself rather than this
  # repository's reading of the jars. Their own job because they need a JDK and
  # Maven (preinstalled on the GitHub runner image) and because a failure here
  # must be attributable to them rather than lost in a workspace run.
  #
  # ⚠ **Item 0b, measured 2026-10-01:** `cargo test --workspace` in the `rust` job
  # already RUNS both of these and they self-skip to `1 passed … 0.00s` without
  # `EGRET_TEST_RANGER_E2E=1`. So that green covered nothing, and this job is what
  # makes the instrument that found SEVEN defects in reviewed code run on an
  # automated path.
  #
  # `continue-on-error` is deliberately NOT set: a gate allowed to fail is the
  # vacuous green again, one level up.
  ranger-differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # `mvn` resolves `org.apache.ranger:ranger-plugins-common` from Maven
      # Central for each version the harness asks for (2.5.0 and 2.8.0 — the two
      # versions the live Trino and StarRocks plugins run). Cached by the pom so
      # the second run does not re-download.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: Swatinem/rust-cache@v2
      # The differential corpus (~4000 cases at two plugin versions) plus the
      # enforcement gate. Both assert the per-class surefire summary BY NAME, so a
      # `mvn` that exits 0 having run nothing fails them — which is why no `-q`
      # appears anywhere in this job.
      - name: Ranger engine gate
        run: EGRET_TEST_RANGER_E2E=1 cargo test -p egret-policy --test ranger_engine_gate --no-fail-fast
      - name: Ranger differential corpus
        run: EGRET_TEST_RANGER_E2E=1 cargo test -p egret-ranger-eval --test differential --no-fail-fast -- --nocapture

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Nothing else checks `src/api/generated/` against the committed
      # `openapi.json` — that gap shipped three runtime breaks of the same
      # kind: a `ColumnSpec` missing `required`, and twice a client still
      # declaring a field the backend's request body had already dropped
      # (`deny_unknown_fields` refused it, and no test failed). `gen:api` is
      # the npm script, never bare `orval`: it also runs
      # `encode-path-params.mjs`, the codemod that puts back the
      # `encodeURIComponent` orval 8.24 drops from every URL builder.
      #
      # This step regenerates FROM the committed `openapi.json`, so on its own it
      # only proves the client matches whatever spec is in the tree. What proves
      # the spec itself is `committed_openapi_json_is_current` in the `rust` job,
      # which byte-compares it against a fresh emit. The two jobs run in
      # PARALLEL and neither `needs:` the other on purpose — both are required,
      # so a stale spec fails `rust` and cannot merge whatever this job says, and
      # ordering them would serialise every run to buy a clearer error message
      # for a case that is already blocked. What is NOT covered either way is a
      # run that does not happen: the 413/502 response types that packages 3a/3b
      # added to the spec sat un-generated in the committed client for several
      # merges, which is what this step would have caught had it run.
      - run: npm run gen:api
      - name: Fail if the generated API client drifted from openapi.json
        run: |
          if ! git diff --quiet -- src/api/generated; then
            echo "::error::frontend/src/api/generated is stale relative to openapi.json — run 'npm run gen:api' in frontend/ and commit the result"
            git diff --stat -- src/api/generated
            exit 1
          fi
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Asserts the shipped bundle still carries ECharts' LabelManager. It cannot live in `npm test`
      # — vitest does not tree-shake and does not produce `dist/`, so the only place this can fail
      # for the right reason is right here, against the artefact the step above just built. The
      # script's header explains which symbols survive minification and why.
      - run: npm run test:bundle
      # Asserts the .xlsx writer is still in its own chunk and still in some chunk. Same reason as
      # the step above: vitest does not code-split, so this can only fail for the right reason
      # against the artefact `npm run build` just produced.
      - run: npm run test:bundle:xlsx
      # Asserts the built `index.html` is still loadable under the `script-src 'self'` that
      # `nginx-prod.conf` sends: no inline <script>, no cross-origin src. Same reason again —
      # neither vitest nor `vite dev` serves the CSP, so a build that the policy would blank out
      # in production is green everywhere else. `src/lib/__tests__/csp.test.ts` pins the header
      # itself; this pins the artefact against it.
      - run: npm run test:bundle:csp
      # Asserts Monaco is still OUT of the entry chunk. The source-level guards in
      # lib/__tests__/monaco.test.ts match import specifiers, so they miss the one-token
      # regression that matters: `import type * as MonacoNS from "monaco-editor"` losing its
      # `type` is tsc-clean, lint-clean, and puts ~3.8MB back on every page including login.
      # Only a production build can be asked, because neither vitest nor `vite dev` splits.
      - run: npm run test:bundle:monaco
      # Asserts the Governance Data area (the catalog tree and object pages) is still a lazy
      # chunk, out of the entry and its preloads. Same reason: only a production build splits.
      - run: npm run test:bundle:governance-data
      # The same for the Governance People area (the People & groups index and principal pages).
      - run: npm run test:bundle:governance-people
